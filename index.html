ase}`),overlay:p.variant,evidence:'',props:''},{time:Math.round(duration*.3)+'–'+Math.round(duration*.67),visual:testing?tr('ถ่ายการทดลองต่อเนื่อง แสดงข้อจำกัดให้เห็น','Film the test without hiding limitations'):tr('เปิดข้อมูลที่มา ไฮไลต์ข้อความ และแยกสิ่งที่ยังไม่ทราบ','Show the source, highlight its wording and label unknowns'),voice:proof?(testing?tr('จากบันทึกการทดลองของฉัน: ','From my recorded test: '):tr('ข้อมูลที่บันทึกจากแหล่งอ้างอิงระบุว่า: ','The recorded source states: '))+proof:tr('[เพิ่มข้อมูลที่ตรวจสอบแล้ว พร้อมแหล่งอ้างอิง]','[Add a verified observation with its source]'),overlay:tr('ตรวจหลักฐานและเงื่อนไข','Check evidence and conditions'),evidence:ref,props:tr('หลักฐานหรือบันทึกการทดลอง','Source or test notes')},{time:Math.round(duration*.67)+'–'+Math.round(duration*.87),visual:tr('เช็กลิสต์รุ่น ขนาด การใช้งาน และข้อจำกัด','Checklist: variant, size, compatibility and limitations'),voice:tr(`ยังต้องตรวจว่ารุ่น ${p.variant} ตรงกับการใช้งานของคุณ รวมถึงราคาและเงื่อนไขปัจจุบันหรือไม่`,`Check whether variant ${p.variant} fits your use, plus the current price and conditions.`),overlay:tr('รุ่นนี้เหมาะกับเราไหม?','Does this variant fit?'),evidence:'',props:''},{time:Math.round(duration*.87)+'–'+duration,visual:tr('ปิดด้วยเช็กลิสต์และข้อความ Affiliate','End on the checklist and affiliate disclosure'),voice:b.goal==='trust'?tr('ถ้ายังมีข้อสงสัย เก็บข้อมูลให้ครบก่อนตัดสินใจ','If something is unclear, gather more information before deciding'):b.goal==='click'?tr('ดูรายละเอียดและเงื่อนไขล่าสุดผ่านลิงก์ที่แนบไว้ได้','Use the attached link to review current details and conditions'):tr('ใช้เช็กลิสต์นี้เทียบกับความต้องการก่อนเลือกซื้อ','Use this checklist to compare against your needs'),overlay:tr('ลิงก์ Affiliate • อาจได้รับคอมมิชชัน','Affiliate link • I may earn commission'),evidence:'',props:''}];const middle=[

ot="${i}" ${s.shotDone?.[i]?'checked':''}>${uiText('filmed')}</label></div><div class="grid cols2">${area('visual'+i,uiText('visual_direction'),x.visual)}${area('voice'+i,uiText('spoken_script'),x.voice)}</div><div class="formgrid">${field('overlay'+i,uiText('on_screen_text'),x.overlay)}${field('ref'+i,uiText('evidence_id'),x.evidence)}</div><div class="row between"><small>${uiText('props')}: ${esc(x.props||'—')}</small>${btn(uiText('copy_scene_script'),'copy-part','small','data-part="scene" data-scene="'+i+'"')}</div></article>`).join('')}</div></section><section id="panel-review" data-studio-panel="review" role="tabpanel" aria-labelledby="tab-review" class="card"><h2>${uiText('review_before_filming')}</h2><p class="sub">${uiText('basic_checks_flag_risky_wording_and_gaps_you_must_still')}</p><div id="quality-flags">${flags.length?flags.map(f=>`<p class="notice">${esc(f)}</p>`).join(''):badge(uiText('basic_checks_passed'),'green')}</div><details><summary>${uiText('view_available_evidence')}</summary>${p.dims.map((d,i)=>d.evidence?`<p><strong>${p.id.slice(0,6)}-E${i+1}</strong> · ${esc(d.evidence)}</p>`:'').join('')}${s.brief.experience?`<p><strong>USER-TEST</strong> · ${esc(s.brief.experience)}</p>`:''}</details><label class="checkrow mt"><input id="reviewed" type="checkbox" ${s.reviewed?'checked':''}><span>${uiText('i_checked_every_claim_against_the_evidence_and_have_rig')}</span></label><label class="checkrow"><input id="linkChecked" type="checkbox" ${s.linkChecked?'checked':''}><span>${uiText('i_checked_the_link_variant_price_offer_and_disclosure')}</span></label><div class="actions mt">${btn(uiText('check_again'),'validate-story','cyan')}${s.evidenceVersion!==p.snapshots.at(-1)?.id?btn(uiText('review_latest_evidence'),'refresh-story-evidence','cyan'):''}${btn(uiText('save_as_ready'),'ready-story','primary')}${btn(uiText('open_planner_2'),'nav','ghost','data-page="planner"')}</div></section><section id="panel-history" data-studio-panel="history" role="tabpanel" a function schedule(stories,cfg,reserved={}){const capacity=Math.floor(cfg.minutes*(1-cfg.reserve/100)),days=Array.from({length:cfg.days},(_,i)=>dayPlus(cfg.start,i)),usage={},tasks=[],deferred=[];days.forEach(d=>usage[d]=reserved[d]||0);let cursor=cfg.start;stories.slice(0,cfg.max).forEach(s=>{let dep=null,lastPublish=null;const jobs=[['research',15],['script',20],['shoot',s.brief.minutes||30],['edit',30],['check',10],['publish',5],['measure',10]];let blocked=false;for(const [type,effort]of jobs){if(blocked){deferred.push({storyId:s.id,type,effort});continue}let remaining=effort,parts=[];let earliest=cursor;if(type==='shoot'&&s.brief.own&&cfg.arrival>earliest)earliest=cfg.arrival;if(type==='measure'&&lastPublish)earliest=dayPlus(lastPublish,3);for(const d of days){if(d<earliest||cfg.off.includes(d)||!cfg.weekdays.includes(new Date(d+'T12:00:00+07:00').getUTCDay()))continue;let free=capacity-usage[d];if(free<=0)continue;const n=Math.min(remaining,free);const task={id:uid(),storyId:s.id,productId:s.productId,revision:s.revisions.at(-1)?.id||null,type,effort:n,totalEffort:effort,date:d,time:(()=>{const [h,m]=cfg.time.split(':').map(Number),t=h*60+m+usage[d]+n;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')})(),status:'todo',dependency:dep,part:parts.length+1,platform:s.platform};tasks.push(task);parts.push(task);usage[d]+=n;remaining-=n;dep=task.id;cursor=d;if(!remaining){if(type==='publish')lastPublish=d;break}}
if(remaining){deferred.push({storyId:s.id,type,effort:remaining});blocked=true}}
});return {id:uid(),createdAt:now(),config:cfg,capacity,tasks,deferred,usage};}

function scheduleCloudUpload(){clearTimeout(cloudTimer);if(cloudUser&&cloudMeta.auto&&mode==='real'&&!cloudChanging&&!cloudBusy&&!cloudConflict)cloudTimer=setTimeout(()=>cloudUpload().catch(e=>cloudNote(cloudError(e))),2000);}
function cloudContext(){return {owner:cloudUser?.id,scope:workspaceKey(),epoch:cloudEpoch};}
function assertCloudContext(context){if(!context||cloudChanging||mode!=='real'||context.owner!==cloudUser?.id||context.scope!==workspaceKey()||context.epoch!==cloudEpoch)throw Error(uiText('account_or_workspace_changed_try_again'));}
async function requireCloud(){if(!cloudClient||!cloudUser||mode!=='real')throw Error(uiText('sign_in_and_switch_to_your_real_workspace_first'));const context=cloudContext();const {data,error}=await cloudClient.auth.getUser();assertCloudContext(context);if(error||data.user?.id!==context.owner)throw Error(uiText('session_expired_sign_in_again'));return context.owner;}
async function cloudUpload(){if(cloudBusy||cloudChanging)return;cloudBusy=true;const scope=workspaceKey(),context=cloudContext();let uploadedVersion=sessionVersion;try{const owner=await requireCloud();await flushSession();assertCloudContext(context);const payload=backupPayload();validateImport(payload);validateRecovery(payload.editingSession,payload.data);const snapshot=structuredClone(payload);uploadedVersion=sessionVersion;cloudNote(uiText('uploading'));const {data,error}=await cloudClient.rpc('sp_affiliate_save_workspace',{p_expected_revision:cloudMeta.revision||0,p_payload:snapshot});assertCloudContext(context);if(error){if(error.message?.includes('CLOUD_CONFLICT'))cloudConflict=true;throw error}if(scope!==workspaceKey()||cloudUser?.id!==owner)return;cloudMeta={...cloudMeta,revision:data.revision};await writeRecord('cloud-meta:'+scope,cloudMeta);cloudNote(uiText('synced_revision')+data.revision);if($('#cloud-auto'))$('#cloud-auto').disabled=false;}finally{cloudBusy=false;if(scope===workspaceKey()&&uploadedVersion!==sessionVersion)scheduleCloudUpload();}}
async function fetchCloud(){const context=cloudContext();const owner=await requireCloud();const {data,error}=await cloudClient.from('sp_affiliate_workspaces').select('revision,payload,updated_at').eq('owner_id',owner).maybeSingle();assertCloudContext(context);if(error)throw error;if(!data)throw Error(uiText('no_cloud_copy_yet_upload_this_workspace_first'));const valid=validateImport(data.payload),recovery=validateRecovery(data.payload.editingSession,valid);return {...data,payload:{...data.payload,data:valid,editingSession:recovery},owner,context};}

async function writeCloudBatch(entries){const frozen=structuredClone(entries);const job=saveQueue.catch(()=>{}).then(()=>new Promise((resolve,reject)=>{const tx=db.transaction('workspaces','readwrite');for(const [key,value]of frozen)tx.objectStore('workspaces').put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Transaction aborted'))}));saveQueue=job;await job;}
function applyCloudCopy(copy){const run=cloudSwitchQueue.catch(()=>{}).then(()=>applyCloudCopyNow(copy));cloudSwitchQueue=run;return run;}
async function applyCloudCopyNow(copy){assertCloudContext(copy.context);if(copy.owner!==cloudUser?.id||mode!=='real')throw Error('Account changed');setCloudChanging(true);clearTimeout(cloudTimer);try{await flushSession();const scope=workspaceKey(),previous=backupPayload();const session=copy.payload.editingSession||{version:1,drafts:{},sessionStories:{},page:'settings'};const meta={revision:copy.revision,auto:false};await writeCloudBatch([[scope,copy.payload.data],['session:'+scope,session],['cloud-backup:'+scope,previous],['cloud-meta:'+scope,meta]]);try{localStorage.removeItem(journalKey())}catch{}await load();await loadSession();cloudMeta=meta;cloudConflict=null;page='settings';render();syncRoute(true);cloudNote(uiText('downloaded_the_previous_copy_is_retained_on_this_device'));}finally{setCloudChanging(false)}}

let storefrontFilter='all', storefrontSort='newest', storefrontQuery='', storefrontStatus='all', storefrontLayout='grid', commerceWindow='72h';
let focusBackground=(()=>{try{return localStorage.getItem('aff-focus-background')==='true'}catch{return false}})();
const categoryKeys=['fashion','beauty','home','tech','food','health','baby','pets','books','sport','auto','other'];
function productCategoryId(p){return p.category?.trim()?'custom:'+p.category.trim():'uncategorized';}
function productCategoryName(p){return p.category?.trim()||uiText('uncategorized');}
function catalogueCategories(){const groups=new Map();for(const p of state.products){const id=productCategoryId(p);if(!groups.has(id))groups.set(id,{id,label:productCategoryName(p),count:0});groups.get(id).count++}return [...groups.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label));}
function categoryMatches(p,id){return ['all','latest'].includes(id)||productCategoryId(p)===id;}
function productMetadataFields(p){const suggestions=[...new Set([...categoryKeys.map(k=>uiText('category_'+k)),...state.products.map(p=>p.category).filter(Boolean)])];return `${field('category',uiText('category_label'),p.category||'','text','maxlength="120" list="category-suggestions" aria-describedby="category-help"')}<datalist id="category-suggestions">${suggestions.map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist>${field('brand',uiText('brand_label'),p.brand||'','text','maxlength="120"')}${field('tags',uiText('tags_label'),p.tags||'','text','maxlength="500"')}<p class="sub metadata-help" id="category-help">${uiText('category_hint')}</p>`;}
function storefrontProducts(){
 const products=state.products.filter(p=>categoryMatches(p,storefrontFilter)&&storefrontMatches(p)).slice();
 const recent=(a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''));
 const numeric=(a,b,key,descending=false)=>{const av=a[key],bv=b[key];if(av==null&&bv==null)return recent(a,b);if(av==null)return 1;if(bv==null)return -1;return (descending?bv-av:av-bv)||recent(a,b)};
 return products.sort((a,b)=>storefrontSort==='price'?numeric(a,b,'price'):storefrontSort==='commission'?numeric(a,b,'commission',true):storefrontSort==='evidence'?score(b).coverage-score(a).coverage||recent(a,b):recent(a,b));

function storefrontHero(){return `<section class="store-hero"><div class="hero-copy"><span class="eyebrow">SP-AFFILIATE <span class="eyebrow-divider">/</span> AFFILIATE INTELLIGENCE</span><h1>${uiText('creator_heading')}</h1><p>${uiText('creator_intro')}</p></div>${creatorJourney()}<div class="hero-entry"><div class="hero-link-entry">${icon('link')}<label class="sr-only" for="creator-link">${uiText('original_affiliate_link')}</label><input id="creator-link" type="url" placeholder="https://shopee.co.th/…" autocomplete="off">${btn(uiText('start_link')+icon('arrow'),'start-product-link','primary')}</div><p class="hero-link-hint">${uiText('link_hint')}</p><div class="hero-footnote">${badge(uiText('platform_manual'))}<span>${uiText('shopee_ai_online_research')} · ${uiText('not_connected')}</span></div></div></section>`;}

function categoryStrip(){const categories=catalogueCategories(),chips=[{id:'all',label:uiText('all_categories'),count:state.products.length},...categories];return `<section class="category-rail"><div class="category-heading"><h2>${uiText('emerald_choose_category')}</h2>${btn(uiText('view_all')+icon('arrow'),'nav','text-link','data-page="products"')}</div><div class="filter-chips" aria-label="${uiText('filter_products')}">${chips.map(c=>`<button data-action="store-category" data-category="${esc(c.id)}" aria-pressed="${storefrontFilter===c.id}">${icon(c.id==='all'?'grid':'products')}<span class="category-name">${esc(c.label)}</span>${lang==='th'&&c.id==='all'?'<span class="category-sub">All Categories</span>':''}<small>${c.count}</small></button>`).join('')}${!state.products.length?categoryKeys.filter(k=>k!=='other').map(k=>`<span class="category-example">${icon(k)}<span>${uiText('category_short_'+k)}</span>${lang==='th'?`<small class="category-sub">${TRANSLATIONS.en['category_short_'+k]}</small>`:''}</span>`).join(''):''}</div></section>`;}
function storefrontCollection(){const categories=catalogueCategories();if(!['all','latest',...categories.map(c=>c.id)].includes(storefrontFilter))storefrontFilter='all';return `<section id="store-collection" class="store-section"><div class="store-section-head"><div><h2>${uiText('collection_heading')}</h2><p>${uiText('collection_sub')}</p></div><div class="collection-head-actions">${btn(uiText('view_all')+icon('arrow'),'nav','text-link','data-page="products"')}${btn(icon('products'),'new-product','icon-button',`aria-label="${uiText('add_product')}" title="${uiText('add_product')}"`)}</div></div><div class="collection-controls"><div class="collection-search">${icon('analyze')}<label class="sr-only" for="store-query">${uiText('search_saved')}</label><input id="store-query" type="search" placeholder="${uiText('search_saved')}" value="${esc(storefrontQuery)}" autocomplete="off"></div><div class="collection-sort"><label class="sr-only" for="store-sort">${uiText('commerce_sort')}</label><select id="store-sort">${['newest','evidence','commission','price'].map(k=>`<option value="${k}" ${storefrontSort===k?'selected':''}>${uiText('sort_'+k)}</option>`).join('')}</select><div class="view-switch" role="group" aria-label="${uiText('emerald_view')}">${['grid','list'].map(k=>btn(icon(k==='grid'?'grid':'more'),'store-layout','icon-button',`data-layout="${k}" aria-label="${uiText(k==='grid'?'emerald_grid':'list')}" aria-pressed="${storefrontLayout===k}"`)).join('')}</div></div></div><div class="content-filters" role="group" aria-label="${uiText('emerald_content_status')}">${['all','draft','ready','published'].map(k=>btn(`${uiText('emerald_status_'+k)} <span>${state.products.filter(p=>categoryMatches(p,storefrontFilter)&&(k==='all'||productContentStatus(p)===k)).length}</span>`,'store-status','small',`data-status="${k}" aria-pressed="${storefrontStatus===k}"`)).join('')}</div><div id="store-results">${storefrontResults()}</div></section>`;}
function productContentStatus(p){if(state.posts.some(post=>post.productId===p.id))return 'published';const stories=state.stories.filter(story=>story.productId===p.id);return stories.some(story=>story.ready)?'ready':'draft';}
function storefrontMatches(p){const query=storefrontQuery.trim().toLocaleLowerCase();return (storefrontStatus==='all'||productContentStatus(p)===storefrontStatus)&&(!query||[p.title,p.brand,p.category,p.tags,p.variant,p.shop,p.usecase].filter(Boolean).join(' ').toLocaleLowerCase().includes(query));}

function recentStories(){const stories=state.stories.slice().sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''))).slice(0,3);return `<section class="recent-stories"><div class="store-section-head"><div><span class="eyebrow">STORY STUDIO</span><h2>${uiText('studio_recent')}</h2></div>${btn(uiText('studio_open')+' ↗','nav','text-link','data-page="studio"')}</div>${stories.length?`<div class="recent-list">${stories.map((s,i)=>`<button class="recent-story" data-action="open-story" data-id="${esc(s.id)}"><span class="recent-index">0${i+1}</span><span class="recent-copy"><strong>${esc(s.name)}</strong><small>${esc(product(s.productId)?.title||'')} · ${esc(s.platform)} · ${s.duration}s</small></span><span class="recent-arrow" aria-hidden="true">↗</span></button>`).join('')}</div>`:`<div class="recent-empty">${icon('studio')}<div><h3>${uiText('studio_recent_empty')}</h3><p>${uiText('studio_recent_hint')}</p></div>${btn(uiText('create_story'),'nav','ghost','data-page="studio"')}</div>`}</section>`;}
function commerceInsights(){const tasks=state.plans.flatMap(p=>p.tasks).filter(t=>t.date===today()),done=tasks.filter(t=>t.status==='done').length,rows=latestRows(commerceWindow,'all'),a=attributed(rows);return `<aside class="commerce-insights"><section class="insight-card daily-goals"><div class="insight-title">${icon('check')}<div><h2>${uiText('commerce_tasks')}</h2><time datetime="${today()}">${new Intl.DateTimeFormat(lang==='th'?'th-TH':'en-GB',{dateStyle:'medium',timeZone:'Asia/Bangkok'}).format(new Date())}</time></div>${btn(icon('arrow'),'nav','icon-button',`data-page="planner" aria-label="${uiText('open_planner')}"`)}</div><div class="daily-progress"><div class="ring" style="--v:${tasks.length?done/tasks.length*100:0}" role="meter" aria-label="${uiText('emerald_task_progress')}" aria-valuemin="0" aria-valuemax="${Math.max(1,tasks.length)}" aria-valuenow="${done}" aria-valuetext="${done}/${tasks.length}"><div><strong>${done}<small>/${tasks.length}</small></strong></div></div><div><h3>${tasks.length?uiText('emerald_your_plan'):uiText('commerce_no_tasks')}</h3><p>${tasks.length?uiText('emerald_completed_tasks'):uiText('commerce_no_tasks_sub')}</p></div></div>${tasks.length?`<ul class="daily-checklist">${tasks.slice(0,5).map(t=>`<li class="${t.status==='done'?'is-done':''}">${icon(t.status==='done'?'check':'clock')}<span>${esc(jobNames()[t.type]||t.type)}<small>${esc(state.stories.find(s=>s.id===t.storyId)?.name||'')} · ${esc(t.time)}</small></span></li>`).join('')}</ul>${tasks.length>5?btn(uiText('view_all')+icon('arrow'),'nav','text-link','data-page="planner"'):''}`:`<div class="insight-next">${btn(icon('products')+uiText('add_product'),'new-product','ghost small')}${btn(icon('planner')+uiText('open_planner'),'nav','ghost small','data-page="planner"')}</div>`}</section><section class="insight-card performance-card"><div class="insight-title">${icon('results')}<h2>${uiText('emerald_performance')}</h2><label class="sr-only" for="commerce-window">${uiText('post_age_window')}</label><select id="commerce-window">${['24h','72h','7d'].map(w=>`<option ${commerceWindow===w?'selected':''}>${w}</option>`).join('')}</select></div><p class="metric-basis">${uiText('emerald_metric_basis')}</p><div class="insight-metrics">${[['clicks',num(total(rows,'clicks'))],['confirmed',money(total(a,'confirmed'))],['views',num(total(rows,'views'))]].map(([k,value])=>`<div><span>${uiText(k)}</span><strong>${value}</strong></div>`).join('')}</div>${commerceChart(rows)}${btn(uiText('log_results')+icon('arrow'),'nav','text-link','data-page="results"')}</section>${commerceTools()}</aside>`;}
function commerceSeries(rows){const grouped=new Map();for(const r of rows){if(!Number.isFinite(r.clicks))continue;const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(r.post.publishedAt));grouped.set(day,(grouped.get(day)||0)+r.clicks);}return [...grouped].sort((a,b)=>a[0].localeCompare(b[0]));}
function commerceChart(rows){const points=commerceSeries(rows);if(!points.length)return `<div class="chart-empty">${icon('results')}<p>${uiText('commerce_no_metrics')}</p></div>`;const max=Math.max(1,...points.map(x=>x[1])),plot=points.map(([day,value],i)=>({day,value,x:28+(points.length>1?i/(points.length-1):.5)*244,y:112-value/max*82}));return `<figure class="commerce-chart"><figcaption>${uiText('emerald_chart_caption')}</figcaption><svg viewBox="0 0 300 150" role="img" aria-labelledby="commerce-chart-title"><title id="commerce-chart-title">${uiText('emerald_chart_caption')}</title>${[30,71,112].map(y=>`<line x1="28" y1="${y}" x2="272" y2="${y}" class="chart-grid"/>`).join('')}<text x="0" y="25">${num(max)}</text><text x="12" y="117">0</text>${plot.length>1?`<polyline points="${plot.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" class="chart-line"/>`:''}${plot.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" class="chart-dot"><title>${esc(p.day)}: ${num(p.value)}</title></circle>`).join('')}<text x="28" y="142">${esc(plot[0].day.slice(5))}</text>${plot.length>1?`<text x="272" y="142" text-anchor="end">${esc(plot.at(-1).day.slice(5))}</text>`:''}</svg><details><summary>${uiText('emerald_chart_data')}</summary><table><thead><tr><th>${uiText('emerald_post_date')}</th><th>${uiText('clicks')}</th></tr></thead><tbody>${points.map(([day,value])=>`<tr><td>${esc(day)}</td><td>${num(value)}</td></tr>`).join('')}</tbody></table></details></figure>`;}

function commerceTools(){return `<section class="insight-card quick-tools"><div class="insight-title">${icon('lab')}<h2>${uiText('emerald_quick_tools')}</h2></div><div class="commerce-tools">${[['studio','story_studio'],['lab','experiment_lab'],['planner','planner'],['results','results']].map(([route,key])=>btn(`<span class="tool-icon">${icon(route)}</span><span><strong>${uiText(key)}</strong></span>${icon('arrow')}`,'nav','commerce-tool',`data-page="${route}"`)).join('')}</div></section>`;}

function todayView(){return `<div class="dashboard-content"><div class="dashboard-main">${storefrontHero()}<div id="home-recovery"></div>${categoryStrip()}${storefrontCollection()}${recentStories()}</div>${commerceInsights()}</div><details class="workspace-details"><summary>${uiText('commerce_details')}</summary><section class="creator-workspace store-section"><div class="store-section-head"><h2>${uiText('workspace_today')}</h2></div>${workspaceOverview()}</section></details>`;}

on(id)+`<span>${navItems().find(([k])=>k===id)[1]}</span>`,'nav',page===id?'active':'',`data-page="${id}" ${page===id?'aria-current="page"':''}`)).join('')+btn(icon('more')+`<span>${uiText('more')}</span>`,'workspace-menu',['today','products','studio'].includes(page)?'':'active');}
