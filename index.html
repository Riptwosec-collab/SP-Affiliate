function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('affiliate-intelligence-v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('workspaces');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){if(!db){state=base();return}state=await new Promise((res,rej)=>{let r=db.transaction('workspaces').objectStore('workspaces').get(workspaceKey());r.onsuccess=()=>res(r.result||base());r.onerror=()=>rej(r.error)});}
async function persist(){saveIndicator('saving');try{await writeRecord(workspaceKey(),state);businessSaveFailure=false;saveFailure=sessionSaveFailure;saveIndicator(saveFailure?'error':sessionVersion>savedSessionVersion?'saving':'saved')}catch(err){businessSaveFailure=true;saveFailure=true;saveIndicator('error');throw Error(T('บันทึกไม่สำเร็จ ข้อมูลยังอยู่ในหน้านี้ ส่งออกสำรองก่อนปิด','Save failed. Your work remains in this page; export a backup before closing.'))}}
function capture(){if($('#main'))$$('#main input,#main textarea,#main select').forEach(e=>{if(e.id&&e.type!=='file'&&e.type!=='password'&&!e.closest('[data-private]'))drafts[page+':'+e.id]=e.type==='checkbox'?e.checked:e.value})}
function restore(){Object.entries(drafts).filter(([k])=>k.startsWith(page+':')).forEach(([k,v])=>{const el=document.getElementById(k.slice(page.length+1));if(el&&el.type!=='password'&&!el.closest('[data-private]')){if(el.type==='checkbox')el.checked=v;else el.value=v}})}
function clearDraft(p){Object.keys(drafts).filter(k=>k.startsWith(p+':')).forEach(k=>delete drafts[k])}

const dimensions=()=>[[T('ปัญหาและการใช้งาน','Problem & use case'),T('ใครมีปัญหาอะไร ใช้ในสถานการณ์ไหน','Who has the problem? In what situation?')],[T('สาธิตได้จริง','Demonstration potential'),T('ระบุวิธีถ่ายหรือผลทดลอง ไม่เดาจากรูป','Describe a shoot or test; do not infer from images')],[T('ราคาและคุณค่า','Price & value'),T('รุ่น ราคา และตัวเทียบที่เงื่อนไขใกล้กัน','Variant, price and comparable alternatives')],[T('รีวิวและร้านค้า','Reviews & seller'),T('คะแนน จำนวนรีวิว และตัวอย่างที่อ่านจริง','Rating, review count and actual review samples')],[T('ผลตอบแทนที่ทราบ','Known commission'),T('อัตราหรือยอด พร้อมเงื่อนไขที่ตรวจแล้ว','Rate or payout with checked eligibility')],[T('อุปสรรคก่อนซื้อ','Purchase friction'),T('คะแนนสูง = เลือกง่าย ข้อจำกัดทราบชัด','Higher = clear compatibility and simpler purchase')],[T('มุมเล่าที่แตกต่าง','Distinct story angle'),T('บอกว่าต่างอย่างไรและมีอะไรพิสูจน์','Describe the difference and supporting evidence')]];
function score(p){let weight=0,total=0,count=0;(p.dims||[]).forEach((d,i)=>{if(d.rating!==null&&Number.isFinite(d.rating)&&d.rating>=0&&d.rating<=5&&d.evidence?.trim()&&d.reason?.trim()){weight+=WEIGHTS[i];total+=WEIGHTS[i]*d.rating/5;count++}});return {coverage:weight,score:weight<60?null:Math.round(100*total/weight),count}}
function stale(p){return !p.observedAt||(Date.now()-Date.parse(p.observedAt))/36e5>state.settings.staleHours}
function formatScore(p){let s=score(p);return s.score===null?'—':s.score}

function head(k,title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>${actions}</div>`}
function kpi(label,value,note,color=''){return `<div class="card stat"><span class="muted">${label}</span><div class="value ${color}">${value}</div><span class="sub">${note}</span></div>`}
function paired(rows,a,b,mul=1){const valid=rows.filter(x=>x[a]!==null&&x[a]!==undefined&&x[b]!==null&&x[b]!==undefined);return valid.length?ratio(valid.reduce((n,x)=>n+x[a],0),valid.reduce((n,x)=>n+x[b],0),mul):null}
function total(rows,key){let r=rows.filter(x=>x[key]!==null&&x[key]!==undefined);return r.length?r.reduce((n,x)=>n+x[key],0):null}
function latestRows(window=filter.window,platform=filter.platform){return state.posts.filter(p=>platform==='all'||p.platform===platform).flatMap(p=>{const m=p.metrics.filter(x=>x.window===window).sort((a,b)=>a.observedAt.localeCompare(b.observedAt)).at(-1);return m?[{...m,post:p}]:[]})}
function attributed(rows){return rows.filter(x=>x.attribution==='post')}

function analyzeView(){const p=product(selected)||{dims:Array.from({length:7},()=>({rating:null,evidence:'',reason:''})),observedAt:now()};return head('PRODUCT INTELLIGENCE',T('เพิ่มสินค้าอย่างเป็นขั้นตอน','Build a product brief'),T('เก็บร่างอัตโนมัติ ทำต่อจากขั้นตอนเดิมได้','Drafts save automatically. Continue from your last step.'))+productStepper()+`<form id="product-form" novalidate><section data-product-step="0" class="card"><div class="section-title"><h2>${T('01 · รู้จักสินค้าที่จะขาย','01 · Identify the product')}</h2>${badge(T('ผู้ใช้กรอก','User-provided'),'cyan')}</div>${onlineProductControls()}<div class="formgrid">${field('affiliate',T('ลิงก์ Affiliate เดิม *','Original affiliate link *'),p.affiliate||'','url','required placeholder="https://s.shopee.co.th/…"')}${field('canonical',T('ลิงก์สินค้าหลัก','Canonical product URL'),p.canonical||'','url')}${field('title',T('ชื่อสินค้า *','Product name *'),p.title||'','text','required maxlength="200"')}${field('variant',T('รุ่น / ขนาด / ตัวเลือก *','Variant / size / option *'),p.variant||'','text','required maxlength="120"')}${field('shop',T('ร้านค้า','Shop'),p.shop||'')}${field('price',T('ราคาของรุ่นนี้ (บาท)','Variant price (THB)'),p.price??'','number','min="0" step="0.01"')}${field('commission',T('คอมมิชชันต่อออเดอร์ (ถ้าทราบ)','Commission per order (if known)'),p.commission??'','number','min="0" step="0.01"')}${field('observed',T('วันที่ตรวจข้อมูล','Observation date'),(p.observedAt||now()).slice(0,10),'date',`required max="${today()}"`)}${field('rating',T('คะแนนสินค้า 0–5','Listing rating 0–5'),p.rating??'','number','min="0" max="5" step="0.1"')}${field('reviews',T('จำนวนรีวิว','Review count'),p.reviews??'','number','min="0" step="1"')}</div></section><section data-product-step="1" class="card"><h2>${T('02 · สิ่งที่รู้และหลักฐานที่มี','02 · What you know and can support')}</h2><div class="mt">${area('usecase',T('ปัญหาหรือสถานการณ์ที่จะเล่า *','Problem or situation *'),p.usecase||'','required maxlength="2000"')} "actions"><button id="step-back" type="button" data-action="step-back">${T('ย้อนกลับ','Back')}</button><button id="step-next" type="button" class="primary" data-action="step-next">${T('ขั้นตอนถัดไป','Next step')}</button><button id="product-submit" type="submit" class="primary">${T('บันทึกและวิเคราะห์','Save & analyze')}</button></div></div></form>`;}

function analysisCard(p){const s=score(p),prev=p.snapshots?.at(-2),delta=prev?s.coverage-prev.coverage:null;return `<div class="row"><div class="ring" style="--v:${s.coverage}"><div><strong>${s.coverage}%</strong><small>${T('หลักฐานครบ','COVERAGE')}</small></div></div><div><div class="muted">${T('คะแนนโอกาส','Opportunity score')}</div><h1>${s.score===null?'—':s.score+' / 100'}</h1>${badge(s.coverage<60?T('เก็บข้อมูลเพิ่ม','More evidence needed'):s.coverage<80?T('คะแนนเบื้องต้น','Provisional'):T('พร้อมทดลอง','Ready to test'),s.coverage<60?'orange':'cyan')}</div></div>${delta!==null?`<p class="sub">${T('Coverage เปลี่ยนจากครั้งก่อน','Coverage change since last snapshot')}: ${delta>0?'+':''}${delta}%</p>`:''}<p class="sub">${T('ความครบถ้วน ไม่ใช่ความแม่นยำ • ประเมินได้','Coverage is not accuracy • Assessed')} ${s.count}/7 ${T('มิติ','dimensions')}</p>`}
function productsView(){if(!state.products.length)return head('SELLING LIST',T('คลังสินค้าของคุณ','Your selling list'),'')+empty(T('เริ่มจากสินค้าหนึ่งชิ้น','Start with one product'),T('บันทึกลิงก์ รุ่น ราคา และหลักฐานที่ใช้เลือกขาย','Save a link, variant, price and supporting evidence.'));return head('SELLING LIST',T('เลือกจากข้อมูลที่มี','Choose with evidence'),T('เปรียบเทียบ 2–5 สินค้า โดยไม่จัดอันดับเมื่อข้อมูลยังไม่พอ','Compare 2–5 products. Incomplete evidence stays visible.'),`<div class="actions">${btn(T('เปรียบเทียบที่เลือก','Compare selected'),'compare','cyan')}${btn(T('+ สินค้า','+ Product'),'new-product','primary')}</div>`)+productToolbar()+(productFilters.view==='table'?productsTable():`<div class="grid cols3">${filteredProducts().map(p=>`<article class="card"><div class="row between mb"><label class="check"><input type="checkbox" class="compare-check" value="${p.id}">${T('เปรียบเทียบ','Compare')}</label>${badge(T('ผู้ใช้กรอก','User-provided'))}</div>${safeImage(p.imageUrl)?`<img class="product-img" src="${esc(safeImage(p.imageUrl))}" alt="${esc(p.title)}" referrerpolicy="no-referrer">`:`<div class="product-blank">${icon('products')}</div>`}<h2 class="product-title">${esc(p.title)}</h2><p class="sub">${esc(p.variant)} · ${esc(p.shop||T('ไม่ระบุร้าน','Shop unknown'))}</p><div class="metrics"><div><small>${T('ราคา','Price')}</small><strong>${money(p.price)}</strong></div><div><small>${T('คอมมิชชัน/ออเดอร์','Commission/order')}</small><strong>${money(p.commission)}</strong></div></div>${analysisCard(p)}${stale(p)?`<div class="notice">${T('ข้อมูลราคา/โปรเก่า ตรวจซ้ำก่อนโพสต์','Price/offer evidence is stale. Recheck before posting.')}</div>`:''}<details><summary>${T('เหตุผล หลักฐาน และประวัติ','Rationale, evidence & history')}</summary>${dimensions().map(([d],i)=>`<div class="dim"><strong>${d} · ${p.dims[i]?.rating??'—'}/5</strong><p>${esc(p.dims[i]?.reason||T('ยังไม่มีเหตุผล','No rationale yet'))}</p><p class="sub">[${p.id.slice(0,6)}-E${i+1}] ${esc(p.dims[i]?.evidence||T('ไม่มีหลักฐาน','Missing evidence'))}</p>${safeUrl(p.dims[i]?.source)?`<a href="${esc(p.dims[i].source)}" target="_blank" rel="noopener noreferrer">${T('ดูแหล่งข้อมูล','Open source')}</a>`:''}</div>`).join('')}<p class="sub">${T('สังเกตเมื่อ','Observed')} ${date(p.observedAt)} · ${RUBRIC}</p>${(p.snapshots||[]).slice().reverse().map(x=>`<p class="sub">${date(x.createdAt)} · Coverage ${x.coverage}% · Score ${x.score??'—'}</p>`).join('')}</details><div class="mt">${sel('status-'+p.id,T('สถานะในคลัง','Pipeline status'),[['research',T('กำลังค้นคว้า','Researching')],['ready',T('พร้อมทดลอง','Ready to test')],['creating',T('กำลังทำเนื้อหา','Creating')],['publishing',T('กำลังเผยแพร่','Publishing')],['paused',T('พัก','Paused')],['archived',T('เก็บเข้าคลัง','Archived')]],p.status)}</div><div class="actions">${btn(T('สร้างเรื่อง','Create story'),'product-story','primary small',`data-id="${p.id}"`)}${btn(T('แก้ข้อมูล','Edit'),'edit-product','small',`data-id="${p.id}"`)}${btn(T('ลิงก์','Copy link'),'copy-link','small ghost',`data-id="${p.id}"`)}</div><div class="mt"><a href="${esc(p.affiliate)}" target="_blank" rel="noopener noreferrer">${T('เปิด Shopee','Open Shopee')} ↗</a></div></article>`).join('')}</div>`)+(!filteredProducts().length?noProducts():'')+`<div id="comparison" class="space"></div>`}
async function saveProduct(form){const f=new FormData(form),v=k=>String(f.get(k)||'').trim();if(!shopee(v('affiliate'))||v('canonical')&&!shopee(v('canonical'))){inlineError(!shopee(v('affiliate'))?'affiliate':'canonical',T('ใช้ HTTPS ของ Shopee ประเทศไทย','Use a Shopee Thailand HTTPS link'));throw Error(T('ใช้ลิงก์ HTTPS ของ Shopee ประเทศไทยเท่านั้น','Use an HTTPS Shopee Thailand link.'));}let dims=WEIGHTS.map((_,i)=>({rating:N(v('dim'+i)),reason:v('reason'+i),evidence:v('ev'+i),source:v('src'+i)}));for(const [i,d] of dims.entries()){if(d.rating!==null&&(!d.reason||!d.evidence)){inlineError((!d.reason?'reason':'ev')+i,T('กรอกเหตุผลและหลักฐานให้ครบ','Add the rationale and supporting evidence'));throw Error(T('ทุกมิติที่ให้คะแนนต้องมีเหตุผลและหลักฐาน','Each rated dimension requires rationale and evidence.'));}if(d.source&&!safeUrl(d.source))throw Error(T('URL หลักฐานไม่ถูกต้อง','Invalid evidence URL.'))}const old=product(selected),id=old?.id||uid();let img=v('imageUrl')||draftImage||old?.imageUrl||'';const file=$('#imageFile').files[0];if(file){if(file.size>5*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error(T('ใช้ JPG, PNG หรือ WebP ไม่เกิน 5 MB','Use JPG, PNG or WebP up to 5 MB.'));img=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}const p={id,title:v('title'),variant:v('variant'),shop:v('shop'),affiliate:v('affiliate'),canonical:v('canonical'),price:N(v('price')),commission:N(v('commission')),rating:N(v('rating')),reviews:N(v('reviews')),observedAt:v('observed')+'T00:00:00+07:00',sourceText:v('sourceText'),usecase:v('usecase'),imageUrl:img,dims,status:old?.status||'research',updatedAt:now(),snapshots:old?.snapshots||[]};const s=score(p);p.snapshots.push({id:uid(),createdAt:now(),rubric:RUBRIC,...s,evidence:structuredClone(dims),price:p.price,variant:p.variant,observedAt:p.observedAt});if(old)state.products[state.products.indexOf(old)]=p;else state.products.push(p);state.stories.filter(s=>s.productId===p.id).forEach(s=>{s.ready=false;s.reviewed=false;s.linkChecked=false});await persist();delete productDrafts[selected||'_new'];clearDraft('analyze');draftImage='';productStep=0;selected=id;page='products';render();toast(T('บันทึกสินค้าและ snapshot แล้ว','Product and evidence snapshot saved.'));}

[T('ปัญหาในหนึ่งวัน','A moment in your day'),T('เริ่มจากสถานการณ์ที่คนดูพบจริง แล้วชวนตรวจทางเลือก','Open with a specific situation and inspect a possible solution.')],

function profileFields(){const p=state.profile;return `<div class="formgrid">${field('audience',T('กลุ่มคนดู *','Audience *'),p.audience,'text','required placeholder="'+T('เช่น คนทำงานที่ถ่ายคลิปคนเดียว','e.g. solo creators working from home')+'"')}${sel('storyLanguage',T('ภาษาบท (แยกจาก UI)','Story language (independent of UI)'),[['th','ไทย'],['en','English']],storyDraft?.language||lang)}${sel('goal',T('เป้าหมาย','Goal'),[['educate',T('ช่วยตัดสินใจ','Help a decision')],['click',T('ชวนดูรายละเอียด','Encourage product research')],['trust',T('สร้างความเชื่อถือ','Build trust')]],p.goal)}${sel('tone',T('น้ำเสียง','Tone'),[['friendly',T('เป็นกันเอง','Friendly')],['direct',T('กระชับตรงประเด็น','Direct')],['calm',T('อธิบายใจเย็น','Calm and helpful')]],p.tone)}${sel('duration',T('ความยาวเป้าหมาย','Target length'),[[15,'15 '+T('วินาที','seconds')],[30,'30 '+T('วินาที','seconds')],[60,'60 '+T('วินาที','seconds')]],storyDraft?.duration||30)}${sel('platform',T('ช่องทาง','Platform'),[['TikTok','TikTok'],['Facebook','Facebook Reels']],storyDraft?.platform||'TikTok')}${field('equipment',T('อุปกรณ์ที่มี','Available equipment'),p.equipment)}${field('shootMinutes',T('เวลาถ่าย (นาที)','Filming time (min)'),p.minutes,'number','required min="10" max="480" step="1"')}${field('budget',T('งบที่มี (บาท)','Available budget (THB)'),p.budget??'','number','min="0" step="0.01"')}${field('avoid',T('สิ่งที่ไม่อยากพูด','Words or topics to avoid'),p.avoid)}</div><div class="row mb"><label class="check"><input id="own" type="checkbox" ${p.own?'checked':''}>${T('มีสินค้าทดลองในมือ','Product in hand')}</label><label class="check"><input id="face" type="checkbox" ${p.face?'checked':''}>${T('ออกหน้ากล้อง','Show my face')}</label></div>${area('experience',T('ผลทดลองจริงของคุณ (ว่างหากยังไม่ได้ทดลอง)','Your actual test observations (blank if untested)'),p.experience)}<small>${T('ใช้บรีฟนี้กับมุมเรื่อง • บทสร้างจากแม่แบบ ไม่ใช่ AI ออนไลน์','This brief guides the template. Online AI is not connected.')}</small>`}
function studioView(){if(!state.products.length)return head('STORY STUDIO',T('ให้หลักฐานกลายเป็นเรื่องเล่า','Turn evidence into a story'),'')+empty(T('เพิ่มสินค้าก่อนสร้างบท','Add a product first'),T('บทจะผูกกับสินค้าและหลักฐานที่คุณบันทึก','Stories reference your saved products and evidence.'));const pid=storyDraft?.productId||studioProductId||state.products[0].id;return head('STORY STUDIO',T('พื้นที่สร้างเรื่องของคุณ','Your story workspace'),T('เก็บร่างอัตโนมัติ แก้ทีละส่วน ซ้อมก่อนถ่าย','Autosaved drafts. Focused editing. Rehearse before filming.'))+studioTabsHTML()+`<div class="studio-layout"><div class="studio-main"><section id="panel-brief" data-studio-panel="brief" role="tabpanel" aria-labelledby="tab-brief" class="card tone-violet">${sel('storyProduct',T('สินค้าที่จะเล่า','Product to feature'),state.products.map(p=>[p.id,p.title+' · '+p.variant]),pid)}${profileFields()}<div class="actions mt">${btn(T('บันทึกบรีฟ','Save brief'),'save-profile','ghost')}${btn(T('เลือกมุมเรื่อง','Choose an angle'),'studio-tab','primary','data-tab="angles"')}</div></section><section id="panel-angles" data-studio-panel="angles" role="tabpanel" aria-labelledby="tab-angles"><div class="section-title"><h2>${T('เลือกเรื่องที่เหมาะกับคนดู','Choose a story for your audience')}</h2>${badge(T('แม่แบบในเครื่อง','Local templates'),'violet')}</div><div class="grid cols2">${angles().map((a,i)=>`<button class="card angle ${storyDraft?.angle===i?'selected':''}" data-action="generate-story" data-angle="${i}"><div class="number">ANGLE 0${i+1}</div><h3>${a[0]}</h3><p>${a[1]}</p></button>`).join('')}</div>${btn(T('ให้ AI สร้างร่างจากหลักฐาน','Generate AI evidence draft'),'online-story','cyan mt')}<p class="sub">${T('ส่งเฉพาะสินค้าและบรีฟที่เลือกให้บริการ AI เมื่อกดปุ่ม','Sends only the selected product and brief to the AI service when pressed.')}</p>${hookLibrary()}</section><div id="story-editor">${storyDraft?storyEditor():''}</div></div><aside class="studio-side card"><h2>${T('บทและร่างที่บันทึก' function readProfile(){const get=id=>$('#'+id)?.value||'';state.profile={audience:get('audience').trim(),goal:get('goal'),tone:get('tone'),equipment:get('equipment'),minutes:N(get('shootMinutes'))||60,budget:N(get('budget')),avoid:get('avoid'),own:$('#own').checked,face:$('#face').checked,experience:get('experience').trim()};return state.profile;}
function makeStory(p,b,angle,duration,language,platform){const tr=(a,c)=>language==='th'?a:c;const own=b.own,testing=own&&!!b.experience;const a=angle===1&&!own?3:angle;const question=[tr(`เคยเจอปัญหา ${p.usecase} ไหม?`,`Ever run into this: ${p.usecase}?`),tr(`ก่อนเชื่อเรื่อง ${p.title} มีอะไรที่ควรลองให้เห็น?`,`What should we test before trusting ${p.title}?`),tr(`ข้อมูลที่เห็น กับสิ่งที่รู้จริงเกี่ยวกับ ${p.title} ต่างกันตรงไหน?`,`What is listed, and what do we actually know about ${p.title}?`),tr(`จะเลือก ${p.title} ให้ตรงการใช้งาน ต้องเช็กอะไร?`,`What should you check before choosing ${p.title}?`),tr(`ก่อนตัดสินใจเรื่อง ${p.title} คุณกังวลตรงไหน?`,`What would you want answered before buying ${p.title}?`),tr(`${p.title} อาจไม่เหมาะกับทุกคน เช็กอะไรก่อนดี?`,`${p.title} may not suit everyone. What should we check?`)][a];const tone=b.tone==='direct'?tr('เช็กก่อนซื้อ: ','Before buying: '):b.tone==='calm'?tr('ลองค่อย ๆ ดูด้วยกัน: ','Let’s look at this together: '):'';const facts=p.dims.filter(x=>x.evidence).map((d,i)=>d.evidence);const validEvidence=p.dims.map((d,i)=>d.evidence?{id:p.id.slice(0,6)+'-E'+(i+1),text:d.evidence}:null).filter(Boolean);const proof=testing?b.experience:validEvidence[0]?.text;const ref=testing?'USER-TEST':validEvidence[0]?.id||'';const shots=[{time:'0–'+Math.round(duration*.1),visual:tr(own?(b.face?'คุณกับสินค้าในบริบทการใช้งาน':'ภาพมือและสินค้าบนโต๊ะ'):'ภาพเช็กลิสต์ที่ทำเองหรือภาพสินค้าที่ได้รับอนุญาต',own?(b.face?'You with the product in context':'Hands and product on a table'):'Your own checklist or licensed product image'),voice:tone+question,overlay:tr('คำถามก่อนตัดสินใจ','A question before buying'),evidence:'',props:b.equipment||tr('อุปกรณ์ที่คุณมี','Your available gear')},{time:Math.round(duration*.1)+'–'+Math.round(duration*.3),visual:tr('แสดงบริบท ระบุหากเป็นสถานการณ์จำลอง','Show context; label staged situations'),voice:tr(`สำหรับ ${b.audience} ลองเริ่มจากคำถามนี้: ${p.usecase}`,`For ${b.audience}, start with this situation: ${p.usecase}`),overlay:p.variant,evidence:'',props:''},{time:Math.round(duration*.3)+'–'+Math.round(duration*.67),visual:testing?tr('ถ่ายการทดลองต่อเนื่อง แสดงข้อจำกัดให้เห็น','Film the test without hiding limitations'):tr('เปิดข้อมูลที่มา ไฮไลต์ข้อความ และแยกสิ่งที่ยังไม่ทราบ','Show the source, highlight its wording and label unknowns'),voice:proof?(testing?tr('จากบันทึกการทดลองของฉัน: ','From my recorded test: '):tr('ข้อมูลที่บันทึกจากแหล่งอ้างอิงระบุว่า: ','The recorded source states: '))+proof:tr('[เพิ่มข้อมูลที่ตรวจสอบแล้ว พร้อมแหล่งอ้างอิง]','[Add a verified observation with its source]'),overlay:tr('ตรวจหลักฐานและเงื่อนไข','Check evidence and conditions'),evidence:ref,props:tr('หลักฐานหรือบันทึกการทดลอง','Source or test notes')},{time:Math.round(duration*.67)+'–'+Math.round(duration*.87),visual:tr('เช็กลิสต์รุ่น ขนาด การใช้งาน และข้อจำกัด','Checklist: variant, size, compatibility and limitations'),voice:tr(`ยังต้องตรวจว่ารุ่น ${p.variant} ตรงกับการใช้งานของคุณ รวมถึงราคาและเงื่อนไขปัจจุบันหรือไม่`,`Check whether variant ${p.variant} fits your use, plus the current price and conditions.`),overlay:tr('รุ่นนี้เหมาะกับเราไหม?','Does this variant fit?'),evidence:'',props:''},{time:Math.round(duration*.87)+'–'+duration,visual:tr('ปิดด้วยเช็กลิสต์และข้อความ Affiliate','End on the checklist and affiliate disclosure'),voice:b.goal==='trust'?tr('ถ้ายังมีข้อสงสัย เก็บข้อมูลให้ครบก่อนตัดสินใจ','If something is unclear, gather more information before deciding'):b.goal==='click'?tr('ดูรายละเอียดและเงื่อนไขล่าสุดผ่านลิงก์ที่แนบไว้ได้','Use the attached link to review current details and conditions'):tr('ใช้เช็กลิสต์นี้เทียบกับความต้องการก่อนเลือกซื้อ','Use this checklist to compare against your needs'),overlay:tr('ลิงก์ Affiliate • อาจได้รับคอมมิชชัน','Affiliate link • I may earn commission'),evidence:'',props:''}];const middle=[
tr(`ลองนึกถึงสถานการณ์ ${p.usecase} สำหรับ ${b.audience} สิ่งแรกที่อยากแก้คืออะไร?`,`Picture this: ${p.usecase}. For ${b.audience}, what needs to change first?`),
tr('ตั้งคำถามที่ทดสอบได้หนึ่งข้อ แล้วจดเงื่อนไขก่อนเริ่ม อย่าเปลี่ยนเงื่อนไขระหว่างถ่าย','Choose one testable question and record the conditions before you begin. Keep them consistent.'),
tr('แบ่งกระดาษเป็นสองฝั่ง: แหล่งข้อมูลบอกอะไร และมีอะไรที่ยังไม่ได้พิสูจน์','Split the page: what the source says, and what has not yet been verified.'),

tr('คำถามก่อนซื้อ: รุ่นนี้ตรงกับงานของเราหรือไม่? ถ้าข้อมูลไม่ตอบ ให้เก็บเป็นคำถามถึงร้าน','Buying question: does this variant fit the task? If the listing cannot answer, ask the seller.'),
tr('เริ่มจากสิ่งที่เรายังไม่รู้ แล้วแยกว่าเรื่องไหนต้องถามร้าน เรื่องไหนต้องทดลองเอง','Start with the unknowns. Separate seller questions from things you need to test yourself.')
];shots[1].voice=middle[a];

if(a===1&&!testing)shots[2].voice=tr('[เพิ่มผลทดลองจริงก่อนอ้างผลลัพธ์]','[Add actual test observations before claiming a result]');
return {id:uid(),productId:p.id,language,platform,duration,angle:a,name:p.title+' · '+tr(['ปัญหา','ทดสอบ','ก่อนเชื่อ','วิธีเลือก','ข้อกังวล','ข้อจำกัด'][a],['Situation','Test','Verify','Choose','Objection','Limits'][a]),hookA:shots[0].voice,hookB:tr(`ถ้าคุณเป็น ${b.audience} อย่าเพิ่งข้ามคำถามนี้`,`If you are ${b.audience}, consider this question first`),shots,caption:tr(`ก่อนเลือก ${p.title} รุ่น ${p.variant} ลองเช็กให้ตรงกับการใช้งานของคุณ ราคาและเงื่อนไขอาจเปลี่ยนแปลง`,`Before choosing ${p.title}, variant ${p.variant}, check that it fits your needs. Prices and conditions may change.`),disclosure:tr('ลิงก์ Affiliate: ฉันอาจได้รับคอมมิชชันจากการซื้อผ่านลิงก์นี้','Affiliate disclosure: I may earn commission from purchases through this link.'),facebook:tr(`สำหรับ ${b.audience}\nคำถามที่ควรเช็กเกี่ยวกับ ${p.title}:\n• รุ่น ${p.variant} ตรงกับการใช้งานไหม?\n• มีข้อจำกัดอะไรที่แหล่งข้อมูลยังไม่ระบุ?\n• ราคา ค่าส่ง และเงื่อนไขล่าสุดเป็นอย่างไร?\n\nข้อมูลนี้เป็นแนวทางตรวจสอบ ไม่ใช่รีวิวการใช้งานหากยังไม่ได้ทดลอง`,`For ${b.audience}\nQuestions to ask about ${p.title}:\n• Does variant ${p.variant} fit your use?\n• Which limitations are still unknown?\n• What are the current price, shipping and conditions?\n\nThis is a buying checklist, not an untested personal review.`),ready:false,reviewed:false,linkChecked:false,evidenceVersion:p.snapshots.at(-1)?.id||null,brief:structuredClone(b),revisions:[],createdAt:now()};}
function storyEditor(){const s=storyDraft,p=product(s.productId),flags=storyFlags(s);return `<div class="editor-toolbar"><div class="row">${badge(s.platform+' · '+s.duration+'s · '+s.language.toUpperCase(),'violet')}${badge(s.ready?T('พร้อมถ่าย','Ready'):T('ร่าง','Draft'),s.ready?'green':'orange')}</div><div class="actions">${btn(T('ย้อนกลับ','Undo'),'undo-story','small')}${btn(T('ทำซ้ำ','Redo'),'redo-story','small')}${btn(T('ซ้อมบท','Rehearse'),'teleprompter','small cyan')}${btn(T('บันทึกเวอร์ชัน','Save version'),'save-story','small primary')}</div></div><section id="panel-script" data-studio-panel="script" role="tabpanel" aria-labelledby="tab-script" class="card tone-violet">${field('storyName',T('ชื่อบท','Story name'),s.name)}<div class="grid cols2">${area('storyHookA','Hook A',s.hookA)}${area('storyHookB','Hook B',s.hookB)}</div><div class="actions mb">${btn(T('คัดลอก Hook A','Copy Hook A'),'copy-part','small','data-part="hookA"')}${btn(T('เก็บในคลัง Hook','Save to hook library'),'save-hook','small')}</div>${area('storyCaption','Caption',s.caption)}${area('disclosure',T('ข้อความเปิดเผย Affiliate','Affiliate disclosure'),s.disclosure)}${area('facebookCopy',T('โพสต์ Facebook / FAQ','Facebook post / FAQ'),s.facebook)}<div class="actions">${btn(T('คัดลอก Caption','Copy caption'),'copy-part','small','data-part="caption"')}${btn(T('คัดลอก CTA','Copy CTA'),'copy-part','small','data-part="cta"')}${btn(T('คัดลอกทั้งชุด','Copy full pack'),'copy-story','small')}</div><p class="sub mt">${T('เปลี่ยนภาษา UI ไม่แปลหรือเขียนทับบทของคุณ','Changing the UI language never rewrites your story.')}</p></section><section id="panel-scenes" data-studio-panel="scenes" role="tabpanel" aria-labelledby="tab-scenes"><div class="section-title"><h2>${T('ฉากพร้อมถ่าย','Your shooting cards')}</h2><span class="sub">${T('เวลาคือเป้าหมาย ต้องจับเวลาพูดจริง','Timings are targets. Rehearse the actual delivery.')}</span></div><div class="scene-list">${s.shots.map((x,i)=>`<article class="card scene-card"><div class="section-title"><h3><span class="scene-number">${String(i+1).padStart(2,'0')}</span> ${esc(x.time)}s</h3><label class="check"><input type="checkbox" id="shotdone${i}" data-shot="${i}" ${s.shotDone?.[i]?'checked':''}>${T('ถ่ายแล้ว','Filmed')}</label></div><div class="grid cols2">${area('visual'+i,T('ภาพที่ต้องถ่าย','Visual direction'),x.visual)}${area('voice'+i,T('บทพูด','Spoken script'),x.voice)}</div><div class="formgrid">${field('overlay'+i,T('ข้อความบนจอ','On-screen text'),x.overlay)}${field('ref'+i,T('Evidence ID','Evidence ID'),x.evidence)}</div><div class="row between"><small>${T('อุปกรณ์','Props')}: ${esc(x.props||'—')}</small>${btn(T('คัดลอกบทฉากนี้','Copy scene script'),'copy-part','small','data-part="scene" data-scene="'+i+'"')}</div></article>`).join('')}</div></section><section id="panel-review" data-studio-panel="review" role="tabpanel" aria-labelledby="tab-review" class="card"><h2>${T('ตรวจบทก่อนพร้อมถ่าย','Review before filming')}</h2><p class="sub">${T('ตัวตรวจจับคำเสี่ยงและช่องว่าง ไม่แทนการตรวจทุกข้ออ้างด้วยตนเอง','Basic checks flag risky wording and gaps. You must still review every claim.')}</p><div id="quality-flags">${flags.length?flags.map(f=>`<p class="notice">${esc(f)}</p>`).join(''):badge(T('ผ่านการตรวจเบื้องต้น','Basic checks passed'),'green')}</div><details><summary>${T('ดูหลักฐานที่ใช้ได้','View available evidence')}</summary>${p.dims.map((d,i)=>d.evidence?`<p><strong>${p.id.slice(0,6)}-E${i+1}</strong> · ${esc(d.evidence)}</p>`:'').join('')}${s.brief.experience?`<p><strong>USER-TEST</strong> · ${esc(s.brief.experience)}</p>`:''}</details><label class="checkrow mt"><input id="reviewed" type="checkbox" ${s.reviewed?'checked':''}><span>${T('ตรวจทุกข้ออ้างกับหลักฐาน และมีสิทธิ์ใช้ภาพ','I checked every claim against the evidence and have rights to the visuals.')}</span></label><label class="checkrow"><input id="linkChecked" type="checkbox" ${s.linkChecked?'checked':''}><span>${T('ตรวจลิงก์ รุ่น ราคา/โปร และข้อความ Affiliate แล้ว','I checked the link, variant, price/offer and disclosure.')}</span></label><div class="actions mt">${btn(T('ตรวจอีกครั้ง','Check again'),'validate-story','cyan')}${s.evidenceVersion!==p.snapshots.at(-1)?.id?btn(T('ทวนกับหลักฐานล่าสุด','Review latest evidence'),'refresh-story-evidence','cyan'):''}${btn(T('บันทึกพร้อมถ่าย','Save as Ready'),'ready-story','primary')}${btn(T('เปิด Planner','Open planner'),'nav','ghost','data-page="planner"')}</div></section><section id="panel-history" data-studio-panel="history" role="tabpanel" aria-labelledby="tab-history" class="card"><h2>${T('เวอร์ชันและจุดคืนกลับ','Versions & checkpoints')}</h2><p class="sub">${T('คืนเวอร์ชันเป็นร่าง โดยไม่ลบประวัติเดิม','Restore a version as a draft without deleting history.')}</p>${s.revisions.length?s.revisions.slice().reverse().map((r,i)=>`<div class="task"><div class="grow"><strong>v${s.revisions.length-i}</strong> · ${date(r.at)}<div>${badge(r.checkpoint?T('จุดคืนกลับ','Checkpoint'):r.ready?T('พร้อม','Ready'):T('ร่าง','Draft'))}</div></div><div class="actions">${btn(T('ดู','View'),'view-revision','small',`data-id="${esc(r.id)}"`)}${btn(T('คืนเวอร์ชัน','Restore'),'restore-revision','small cyan',`data-id="${esc(r.id)}"`)}</div></div>`).join(''):`<p class="muted">${T('บันทึกเวอร์ชันแรกเพื่อเริ่มประวัติ','Save your first version to start the history.')}</p>`}</section>`;}

function syncStory(){if(!storyDraft||!$('#storyName'))return;const s=storyDraft;Object.assign(s,{name:$('#storyName').value,hookA:$('#storyHookA').value,hookB:$('#storyHookB').value,caption:$('#storyCaption').value,disclosure:$('#disclosure').value,facebook:$('#facebookCopy').value,reviewed:$('#reviewed').checked,linkChecked:$('#linkChecked').checked});s.shots.forEach((x,i)=>{x.visual=$('#visual'+i).value;x.voice=$('#voice'+i).value;x.overlay=$('#overlay'+i).value;x.evidence=$('#ref'+i).value.trim()});s.shots[0].voice=s.hookA;s.shotDone=s.shots.map((_,i)=>$('#shotdone'+i)?.checked||false);}
function storyFlags(s){const p=product(s.productId),f=[],text=[s.hookA,s.hookB,s.caption,s.facebook,s.disclosure,...s.shots.map(x=>x.voice+' '+x.overlay)].join('\n');if(!s.brief.audience)f.push(T('ระบุกลุ่มคนดู','Specify an audience.'));if(/\[.+?\]/.test(text))f.push(T('ยังมีช่อง [ข้อความ] ที่ต้องเติม','Resolve the [placeholder] text.'));if(!s.disclosure.trim())f.push(T('เพิ่มข้อความ Affiliate','Add an affiliate disclosure.'));if(/การันตี|รับประกันผล|ดีที่สุด|ปลอดภัย100|หายขาด|guaranteed|cures?|best in the world|100% safe/i.test(text))f.push(T('มีคำรับรองผลหรือคำกล่าวเกินหลักฐาน ให้ปรับเป็นข้อความที่พิสูจน์ได้','Remove guarantees or absolute claims.'));if((!s.brief.own||!s.brief.experience)&&/ใช้มาแล้ว|ลองแล้ว|ทดสอบแล้ว|ใช้.{0,5}7 วัน|I tested|I used|I tried/i.test(text))f.push(T('มีประสบการณ์ใช้จริงที่ยังไม่มีบันทึกรองรับ','First-hand experience is not backed by test notes.'));const valid=new Set(p.dims.flatMap((d,i)=>d.evidence?[p.id.slice(0,6)+'-E'+(i+1)]:[]));if(s.brief.own&&s.brief.experience)valid.add('USER-TEST');s.shots.forEach((x,i)=>{if(x.evidence&&!valid.has(x.evidence))f.push(T('หลักฐานไม่พบในฉาก ','Unknown evidence in scene ')+(i+1))});if(!s.shots.some(x=>valid.has(x.evidence)))f.push(T('ต้องมีอย่างน้อยหนึ่งฉากที่อ้างหลักฐาน','At least one scene must reference evidence.'));if(s.evidenceVersion!==p.snapshots.at(-1)?.id)f.push(T('ข้อมูลสินค้าเปลี่ยนแล้ว สร้างบทใหม่หรือทวนกับ snapshot ล่าสุด','Product evidence changed. Regenerate and review against the latest snapshot.'));if(stale(p)&&/ราคา|price|฿|บาท|THB/.test(text))f.push(T('ข้อมูลราคาเก่า กลับไปตรวจวันที่หลักฐานก่อนพร้อมถ่าย','Price evidence is stale. Refresh the product observation date first.'));if(state.stories.some(x=>x.id!==s.id&&x.productId===s.productId&&x.hookA===s.hookA))f.push(T('Hook ซ้ำกับบทที่บันทึกแล้ว ให้เปลี่ยนมุมหรือระบุการทดลองในบทเดิม','This hook matches another story. Revise it or use the existing story.'));if(s.brief.avoid&&s.brief.avoid.split(/[,\n]/).some(w=>w.trim()&&text.toLowerCase().includes(w.trim().toLowerCase())))f.push(T('มีข้อความที่อยู่ในรายการไม่อยากพูด','The script contains words you asked to avoid.'));return [...new Set(f)];}
function storyText(s){return `${s.name}\n${s.platform} · ${s.duration}s · ${s.language}\nHook A: ${s.hookA}\nHook B: ${s.hookB}\n\n`+s.shots.map(x=>`${x.time}s\nVisual: ${x.visual}\nVoice: ${x.voice}\nOverlay: ${x.overlay}\nEvidence: ${x.evidence||'—'}\nProps: ${x.props}`).join('\n\n')+`\n\nCaption\n${s.caption}\n${s.disclosure}\n\nFacebook\n${s.facebook}`;}
async function saveStory(ready){syncStory();const s=storyDraft;if(!s)throw Error(T('เลือกมุมเรื่องก่อน','Choose an angle first.'));const flags=storyFlags(s);if(ready&&(flags.length||!s.reviewed||!s.linkChecked))throw Error(flags[0]||T('ตรวจรายการและยืนยันทั้งสองข้อก่อน','Complete both review checkboxes.'));s.ready=ready;s.revisions.push({id:uid(),at:now(),text:storyText(s),ready,shots:structuredClone(s.shots),snapshot:storySnapshot(s)});const i=state.stories.findIndex(x=>x.id===s.id);if(i<0)state.stories.push(structuredClone(s));else state.stories[i]=structuredClone(s);state.plans.forEach(plan=>plan.tasks.filter(t=>t.storyId===s.id&&t.status!=='done').forEach(t=>{t.previousRevision=t.revision;t.revision=s.revisions.at(-1).id}));await persist();sessionStories[s.id]=structuredClone(s);recordStoryHistory();clearDraft('studio');render();toast(ready?T('บันทึกบทพร้อมถ่ายแล้ว','Ready story saved.'):T('บันทึกร่างและเวอร์ชันแล้ว','Draft and revision saved.'));}

const jobNames=()=>({research:T('ตรวจหลักฐานและข้ออ้าง','Check evidence & claims'),script:T('ทวนและซ้อมบท','Review & rehearse'),shoot:T('ถ่ายหรือเตรียมภาพ','Film or prepare visuals'),edit:T('ตัดต่อและใส่ข้อความ','Edit & add captions'),check:T('ตรวจลิงก์ รุ่น ราคา','Check link, variant & price'),publish:T('โพสต์ด้วยตนเอง','Publish manually'),measure:T('บันทึกผลเมื่อครบ 72 ชม.','Record results at 72 hours')});
function schedule(stories,cfg,reserved={}){const capacity=Math.floor(cfg.minutes*(1-cfg.reserve/100)),days=Array.from({length:cfg.days},(_,i)=>dayPlus(cfg.start,i)),usage={},tasks=[],deferred=[];days.forEach(d=>usage[d]=reserved[d]||0);let cursor=cfg.start;stories.slice(0,cfg.max).forEach(s=>{let dep=null,lastPublish=null;const jobs=[['research',15],['script',20],['shoot',s.brief.minutes||30],['edit',30],['check',10],['publish',5],['measure',10]];let blocked=false;for(const [type,effort]of jobs){if(blocked){deferred.push({storyId:s.id,type,effort});continue}let remaining=effort,parts=[];let earliest=cursor;if(type==='shoot'&&s.brief.own&&cfg.arrival>earliest)earliest=cfg.arrival;if(type==='measure'&&lastPublish)earliest=dayPlus(lastPublish,3);for(const d of days){if(d<earliest||cfg.off.includes(d)||!cfg.weekdays.includes(new Date(d+'T12:00:00+07:00').getUTCDay()))continue;let free=capacity-usage[d];if(free<=0)continue;const n=Math.min(remaining,free);const task={id:uid(),storyId:s.id,productId:s.productId,revision:s.revisions.at(-1)?.id||null,type,effort:n,totalEffort:effort,date:d,time:(()=>{const [h,m]=cfg.time.split(':').map(Number),t=h*60+m+usage[d]+n;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')})(),status:'todo',dependency:dep,part:parts.length+1,platform:s.platform};tasks.push(task);parts.push(task);usage[d]+=n;remaining-=n;dep=task.id;cursor=d;if(!remaining){if(type==='publish')lastPublish=d;break}}
if(remaining){deferred.push({storyId:s.id,type,effort:remaining});blocked=true}}
});return {id:uid(),createdAt:now(),config:cfg,capacity,tasks,deferred,usage};}
function plannerView(){return head('ADAPTIVE PLANNER',T('แผนที่พอดีกับเวลาของคุณ','A plan that fits your time'),T('เหลือเวลาสำรอง และทำงานตามลำดับก่อน–หลัง','Keep a buffer and follow the dependencies.'))+`<div class="grid mainaside"><section class="card"><h2>${T('สร้างแผนใหม่','Build a production plan')}</h2><form id="plan-form" class="mt"><div class="formgrid">${field('planStart',T('วันเริ่ม','Start date'),today(),'date','required')}${sel('planDays',T('ระยะเวลา','Horizon'),[[7,T('7 วัน','7 days')],[14,T('14 วัน','14 days')],[30,T('30 วัน','30 days')]],7)}${field('dailyMinutes',T('เวลาว่างต่อวัน (นาที)','Available minutes per day'),60,'number','required min="5" max="600" step="1"')}${field('reserve',T('เวลาสำรอง (%)','Buffer (%)'),state.settings.reserve,'number','required min="20" max="80" step="1"')}${field('maxPosts',T('จำนวนคลิปสูงสุด','Maximum clips'),3,'number','required min="1" max="30" step="1"')}${field('planTime',T('เวลานัดหมาย / ทดลองโพสต์ (ไทย)','Scheduled time / trial posting time (Bangkok)'),'19:00','time','required')}${field('arrival',T('สินค้าในมือพร้อมใช้วันที่','Physical product available from'),today(),'date','required')}${field('daysOff',T('วันหยุด YYYY-MM-DD คั่นด้วยจุลภาค','Days off: YYYY-MM-DD, comma-separated'),'')}</div><label>${T('วันที่สะดวก','Available weekdays')}</label><div class="row mb">${[T('อา','Sun'),T('จ','Mon'),T('อ','Tue'),T('พ','Wed'),T('พฤ','Thu'),T('ศ','Fri'),T('ส','Sat')].map((n,i)=>`<label class="check"><input type="checkbox" class="weekday" value="${i}" checked>${n}</label>`).join('')}</div><label>${T('เลือกบทที่จะทำ (ลำดับตามรายการ)','Choose stories (processed in this order)')}</label><div class="listcheck mb">${state.stories.length?state.stories.map(s=>`<label class="check"><input class="plan-story" type="checkbox" value="${s.id}" ${s.ready?'checked':''}>${esc(s.name)} ${badge(s.ready?T('พร้อม','Ready'):T('ร่าง','Draft'),s.ready?'green':'orange')}</label>`).join(''):`<p class="sub">${T('บันทึกบทใน Story Studio ก่อนสร้างแผน','Save a story in Story Studio first.')}</p>`}</div><button class="primary" type="submit" ${!state.stories.length?'disabled':''}>${T('คำนวณแผนตามกำลัง','Build a capacity plan')}</button></form></section><aside class="stack" style="align-content:start"><section class="card glow"><h2>${T('เวลาที่เหลือ คือพื้นที่ให้ทำได้จริง','Leave room for real life')}</h2><p class="muted">${T('แบ่งงานใหญ่ข้ามวันได้ ไม่จองเกิน 80% ของเวลาว่าง งานที่ไม่ทันจะอยู่ในรายการเลื่อน','Large tasks can span days. At most 80% of your time is booked. Unfinished work is explicitly deferred.')}</p><div class="notice info">${T('เวลาโพสต์คือช่วงทดลองตามเวลาที่คุณสะดวก ไม่ใช่เวลาที่ดีที่สุดจากข้อมูลตลาด','Posting times are trial slots based on your availability, not market-proven best times.')}</div><p class="sub">${T('แผนใหม่ไม่ย้ายงานเก่าอัตโนมัติ • โปรดหลีกเลี่ยงการเลือกบทซ้ำในแผนที่ยังทำอยู่','New plans never move existing work. Avoid duplicating stories in active plans.')}</p></section></aside></div><section class="space"><div class="section-title"><h2>${T('แผนที่บันทึก','Saved plans')}</h2><div class="actions">${[['list',T('รายการ','List')],['calendar',T('ปฏิทิน','Calendar')],['board',T('กระดาน','Board')]].map(([v,l])=>btn(l,'plan-view',v===planView?'cyan small':'small',`data-view="${v}"`)).join('')}</div></div>${state.plans.slice().reverse().map(plan=>planRender(plan)).join('')||`<div class="empty"><h3>${T('ยังไม่มีแผนงาน','No plans yet')}</h3></div>`}</section>`}
function taskCard(t,plan){const name=jobNames()[t.type],s=state.stories.find(s=>s.id===t.storyId),blocked=t.dependency&&!plan.tasks.find(x=>x.id===t.dependency)?.status.includes('done');return `<div class="task"><div class="grow"><strong>${name}${t.totalEffort>t.effort?' · '+T('ส่วน ','part ')+t.part:''}</strong><p class="sub">${esc(s?.name||'—')} · ${esc(t.platform)}</p><small>${date(t.date)} ${esc(t.time)} · ${num(t.effort)} ${T('นาที','min')} · ${t.dependency?T('มีงานก่อนหน้า','Has prerequisite'):T('เริ่มได้','Can start')}</small></div>${badge(t.status==='done'?T('เสร็จ','Done'):blocked?T('รองานก่อนหน้า','Waiting'):T('พร้อมเริ่ม','To do'),t.status==='done'?'green':'')} ${t.status!=='done'?btn(T('เสร็จ','Done'),'complete-task','small',`data-id="${esc(t.id)}" data-plan="${plan.id}"`):''}</div>`}
function planRender(p){const done=p.tasks.filter(x=>x.status==='done').length;let content='';if(planView==='list')content=p.tasks.map(t=>taskCard(t,p)).join('');if(planView==='calendar')content=`<div class="calendar">${Object.entries(p.usage).map(([d,used])=>`<div class="day"><strong>${date(d)}</strong><small style="display:block">${num(used)}/${num(p.capacity)} ${T('นาที','min')}</small>${p.tasks.filter(t=>t.date===d).map(t=>`<div class="job">${t.status==='done'?'✓ ':''}${jobNames()[t.type]} · ${num(t.effort)}m</div>`).join('')}</div>`).join('')}</div>`;if(planView==='board')content=`<div class="board">${['todo','waiting','done'].map(v=>`<div><h3>${v==='done'?T('เสร็จแล้ว','Done'):v==='waiting'?T('รองานก่อนหน้า','Waiting'):T('พร้อมเริ่ม','To do')}</h3>${p.tasks.filter(t=>{const blocked=t.dependency&&p.tasks.find(x=>x.id===t.dependency)?.status!=='done';return v==='done'?t.status==='done':t.status!=='done'&&(v==='waiting'?blocked:!blocked)}).map(t=>taskCard(t,p)).join('')}</div>`).join('')}</div>`;return `<div class="card mb"><div class="section-title"><h3>${date(p.config.start)} · ${num(p.config.days)} ${T('วัน','days')}</h3>${badge(`${done}/${p.tasks.length} `+T('งาน','tasks'),'cyan')}</div>${content}${p.deferred.length?`<div class="notice mt"><strong>${T('เกินช่วงแผน ต้องเลื่อนงาน','Deferred beyond this plan')}</strong><ul>${p.deferred.map(x=>`<li>${esc(state.stories.find(s=>s.id===x.storyId)?.name||'')} · ${jobNames()[x.type]} · ${x.effort} ${T('นาที','min')}</li>`).join('')}</ul></div>`:''}</div>`}

function resultMetricsForm(){return `<form id="metric-form"><div class="formgrid">${sel('metricPost',T('โพสต์','Post'),state.posts.map(p=>[p.id,p.name]))}${sel('metricWindow',T('อายุโพสต์ที่วัด','Post-age window'),[['24h','24h'],['72h','72h'],['7d','7d']],filter.window)}${field('metricDate',T('วันเวลาที่สังเกต (ไทย)','Observed time (Bangkok)'),today()+'T19:00','datetime-local','required')}${sel('attribution',T('เชื่อมยอดกับโพสต์','Attribution'),[['unknown',T('ไม่ทราบ / ยอดรวมสินค้า','Unknown / product totals')],['post',T('มีแหล่งยืนยันระดับโพสต์','Confirmed post-level source')]],'unknown')}${field('metricSource',T('แหล่งข้อมูล / ชื่อรายงาน *','Source / report name *'),'','text','required')}<div class="notice">${T('บันทึกยอดสะสม ณ อายุโพสต์ที่เลือก ระบบใช้ snapshot ล่าสุด ไม่บวก snapshot ซ้ำ ค่าที่ไม่ทราบให้เว้นว่าง','Enter cumulative totals at the selected post age. Only the latest snapshot is counted. Leave unknown values blank.')}</div>${['views','clicks','orders','cancelled','sales','estimated','confirmed','cost','retention'].map(k=>field('m-'+k,metricLabel(k),'','number',`min="0" ${k==='retention'?'max="100"':''} step="${['views','clicks','orders','cancelled'].includes(k)?'1':'0.01'}"`)).join('')}</div><button class="primary" type="submit">${T('บันทึก snapshot','Save snapshot')}</button></form>`}
function metricLabel(k){return ({views:T('ยอดชม','Views'),clicks:T('คลิก','Clicks'),orders:T('ออเดอร์','Orders'),cancelled:T('ออเดอร์ยกเลิก','Cancelled orders'),sales:T('ยอดขาย (บาท)','Sales (THB)'),estimated:T('คอมมิชชันประมาณการ (บาท)','Estimated commission (THB)'),confirmed:T('คอมมิชชันยืนยัน (บาท)','Confirmed commission (THB)'),cost:T('ต้นทุนที่บันทึก (บาท)','Recorded costs (THB)'),retention:T('Retention ช่วงต้น (%) ถ้ามี','Early retention (%) if known')})[k]}
function resultsView(){const rows=latestRows(),a=attributed(rows),click=paired(rows,'clicks','views',100),conv=paired(a,'orders','clicks',100),epc=paired(a,'confirmed','clicks');return head('RESULTS & LEARNING',T('วัดผล แล้วค่อยขยับ','Measure, then make your next move'),T('ยอดยืนยันแยกจากประมาณการ • สกุลเงิน THB • snapshot สะสม','Confirmed and estimated totals stay separate • THB • Cumulative snapshots'))+`<div class="filterbar"><div class="field"><label for="resultWindow">${T('อายุโพสต์เดียวกัน','Same post age')}</label><select id="resultWindow">${['24h','72h','7d'].map(w=>`<option ${filter.window===w?'selected':''}>${w}</option>`).join('')}</select></div><div class="field"><label for="resultPlatform">${T('ช่องทาง','Platform')}</label><select id="resultPlatform">${[['all',T('ทุกช่องทาง','All platforms')],['TikTok','TikTok'],['Facebook','Facebook']].map(([v,l])=>`<option value="${v}" ${filter.platform===v?'selected':''}>${l}</option>`).join('')}</select></div><p class="sub">${rows.length} ${T('โพสต์มีข้อมูลในช่วงนี้','posts with data in this window')}</p></div><div class="grid cols4 mb">${kpi(T('ยอดชม','Views'),num(total(rows,'views')),T('ไม่รวมค่าที่หาย','Missing values excluded'))}${kpi('Click-to-view',click===null?'N/A':num(click)+'%',T('รวมเฉพาะคู่ข้อมูลครบ','Only complete numerator/denominator pairs'),'cyantext')}${kpi(T('คอมมิชชันยืนยัน','Confirmed'),money(total(a,'confirmed')),T('ระบุโพสต์ได้เท่านั้น','Post-attributed only'))}${kpi(T('ประมาณการ','Estimated'),money(total(a,'estimated')),T('ยังไม่ใช่รายได้ยืนยัน','Not confirmed earnings'))}</div><div class="grid cols3 mb"><div class="card"><h3>Orders per click</h3><p>${conv===null?'N/A':num(conv)+'%'}</p><small>${T('อัตราส่วน ไม่จำเป็นต้องเป็น unique conversion','A ratio, not necessarily unique conversions')}</small></div><div class="card"><h3>EPC</h3><p>${epc===null?'N/A':money(epc)}</p><small>${T('คอมมิชชันยืนยัน / คลิกที่ระบุโพสต์ได้','Confirmed commission / attributed clicks')}</small></div><div class="card"><h3>${T('ไม่ทราบที่มา','Unknown attribution')}</h3><p>${rows.length-a.length} ${T('โพสต์','posts')}</p><small>${T('ไม่ใช้ยอดเหล่านี้ตัดสินใจขยายผล','Excluded from scale decisions')}</small></div></div><div class="grid cols2"><section class="card"><h2>${T('ลงทะเบียนโพสต์ที่เผยแพร่','Register a published post')}</h2><form id="post-form" class="mt">${sel('postStory',T('เลือกบท','Story'),state.stories.map(s=>[s.id,s.name]))}${field('postName',T('ชื่อโพสต์ *','Post title *'),'','text','required maxlength="200"')}${field('postUrl',T('URL โพสต์ *','Post URL *'),'','url','required')}${field('publishedAt',T('วันเวลาเผยแพร่ (ไทย)','Published time (Bangkok)'),today()+'T12:00','datetime-local','required')}${sel('postVariant','Hook',[['A','Hook A'],['B','Hook B']],'A')}<button type="submit" class="primary" ${!state.stories.length?'disabled':''}>${T('บันทึกโพสต์','Save post')}</button>${!state.stories.length?`<p class="sub">${T('บันทึกบทก่อนเพิ่มโพสต์','Save a story before registering a post.')}</p>`:''}</form></section><section class="card"><h2>${T('บันทึกผลสะสม','Record cumulative results')}</h2><div class="mt">${state.posts.length?resultMetricsForm():`<p class="muted">${T('เพิ่มโพสต์ด้านซ้ายก่อนบันทึกยอด','Register a post before adding metrics.')}</p>`}</div></section></div><section class="card space"><h2>${T('โพสต์และคำแนะนำ','Posts & next experiments')}</h2>${state.posts.length?state.posts.map(p=>{const m=rows.find(r=>r.post.id===p.id);return `<div class="task"><div class="grow"><h3>${esc(p.name)}</h3><p class="sub">${p.platform} · ${date(p.publishedAt)} · Hook ${p.variant} · ${p.metrics.length} snapshots</p><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${T('เปิดโพสต์','Open post')} ↗</a><p>${recommend(p,m)}</p>${m?`<div class="row">${badge(T('ชม ','Views ')+num(m.views))}${badge(T('คลิก ','Clicks ')+num(m.clicks))}${badge(T('ออเดอร์ ','Orders ')+num(m.orders))}${badge(m.attribution==='post'?T('ระบุโพสต์ได้','Post-attributed'):T('ไม่ทราบที่มา','Unknown attribution'),m.attribution==='post'?'green':'orange')}</div>`:''}</div></div>`}).join(''):`<p class="muted">${T('ยังไม่มีโพสต์','No published posts yet.')}</p>`}<div class="actions mt">${btn(T('ส่งออกผล CSV','Export results CSV'),'export-csv','ghost')}</div></section>${rows.length?`<section class="card space"><h2>${T('คอมมิชชันยืนยันต่อโพสต์','Confirmed commission by post')}</h2><p class="sub">${T('เฉพาะยอดที่ระบุโพสต์ได้ในช่วงที่เลือก','Post-attributed observations in the selected window')}</p><div class="plot">${a.filter(r=>r.confirmed!==null).slice(-8).map((r,i)=>`<div class="plotcol"><small>${money(r.confirmed)}</small><div class="plotbar" style="height:${Math.max(2,r.confirmed/Math.max(1,...a.map(x=>x.confirmed||0))*110)}px"></div><small>${esc(r.post.name.slice(0,12))}</small></div>`).join('')}</div></section>`:''}`}
function recommend(p,m){if(!m)return T('ยังไม่มีข้อมูลในช่วงที่เลือก เก็บผลที่อายุโพสต์เท่ากันก่อน','No observation in this window. Measure posts at the same age.');const cfg=state.settings;const evidence=`[${m.id.slice(0,8)}]`;if(m.attribution!=='post')return T('ยังสรุปเรื่องยอดขายต่อโพสต์ไม่ได้ ตรวจแหล่ง attribution ก่อน','Post-level sales cannot be inferred. Check attribution first.')+' '+evidence;if(m.views===null||m.clicks===null||m.views<cfg.minViews||m.clicks<cfg.minClicks)return T('ข้อมูลยังน้อยตามเกณฑ์ที่ตั้งไว้ เก็บเพิ่มก่อนตัดสิน อย่ารีบสรุปว่า Hook ผิด','Below your sample thresholds. Collect more evidence; do not assume the hook caused it.')+' '+evidence;const ctr=ratio(m.clicks,m.views,100),opc=ratio(m.orders,m.clicks,100),cpm=ratio(m.confirmed,m.views,1000);if(ctr<cfg.clickTarget)return T('ทดลองปรับ CTA หรือความตรงกลุ่มเป้าหมาย และตรวจ tracking เพราะคลิกต่อยอดชมต่ำกว่าเกณฑ์','Try a clearer CTA or audience framing; also check tracking. Click-to-view is below your target.')+' '+evidence;if(opc!==null&&opc<cfg.orderTarget)return T('ตรวจรุ่น สต๊อก ราคา ค่าส่ง และความล่าช้าของ attribution ก่อนเปลี่ยนบท','Check variant, stock, price, shipping and attribution delays before rewriting.')+' '+evidence;const cohort=attributed(latestRows(m.window,p.platform)).filter(x=>x.post.productId===p.productId&&x.post.productVariant===p.productVariant&&x.orders!==null&&x.confirmed!==null&&x.views>=cfg.minViews&&x.clicks>=cfg.minClicks&&ratio(x.clicks,x.views,100)>=cfg.clickTarget&&ratio(x.orders,x.clicks,100)>=cfg.orderTarget&&ratio(x.confirmed,x.views,1000)>=cfg.commissionTarget);if(opc!==null&&cpm!==null&&cohort.length>=3&&score(product(p.productId)).coverage>=80)return T('มีผลดีซ้ำอย่างน้อย 3 โพสต์ใน cohort เดียวกัน ลองเพิ่มหนึ่งมุมภายในกำลังผลิต ผลนี้ยังเป็นเชิงสังเกต','At least 3 comparable posts meet your targets. Try one additional angle within capacity. This remains observational.')+' '+evidence;return T('มีสัญญาณพอทดลองต่อ ยังไม่พอขยายผล เก็บอย่างน้อย 3 โพสต์ที่ช่องทางและอายุวัดเท่ากัน','Promising enough to test again, not enough to scale. Gather at least 3 posts on the same platform at the same age.')+' '+evidence;}

function labView(){return head('EXPERIMENT LAB',T('เปลี่ยนทีละอย่าง เรียนรู้ให้ชัด','Change one thing. Learn clearly.'),T('การเทียบโพสต์ Organic เป็นข้อมูลเชิงสังเกต ไม่ใช่การทดลองสุ่ม','Organic comparisons are observational, not randomized trials.'))+`<div class="grid cols2"><section class="card tone-violet"><h2>${T('ตั้งการทดลอง A/B','Define an A/B experiment')}</h2><form id="experiment-form" class="mt">${field('expName',T('ชื่อและสมมติฐาน *','Name and hypothesis *'),'','text','required maxlength="400"')}${sel('expA',T('โพสต์ A','Post A'),state.posts.map(p=>[p.id,p.name]))}${sel('expB',T('โพสต์ B','Post B'),state.posts.map(p=>[p.id,p.name]))}${sel('expVariable',T('ตัวแปรหลักหนึ่งอย่าง','One main variable'),[['hook','Hook'],['cta','CTA'],['angle',T('มุมเรื่อง','Angle')]])}${sel('expMetric',T('ตัวชี้วัดหลัก','Primary metric'),[['click','Click-to-view'],['order','Orders per click'],['commission',T('คอมมิชชัน/1,000 views','Commission/1,000 views')]])}${sel('expWindow',T('ช่วงวัดที่กำหนด','Planned measurement window'),[['24h','24h'],['72h','72h'],['7d','7d']],'72h')}<label class="checkrow"><input id="expPre" type="checkbox"><span>${T('กำหนดสมมติฐานไว้ก่อนเห็นผล (หากไม่ได้ทำ จะติดป้ายย้อนหลัง)','Hypothesis was defined before seeing results (otherwise marked retrospective)')}</span></label><button class="primary mt" ${state.posts.length<2?'disabled':''}>${T('บันทึกการทดลอง','Save experiment')}</button></form></section><section class="card"><h2>${T('สถานการณ์สมมติ','Forecast sandbox')}</h2><p class="sub">${T('ใส่สมมติฐานของคุณเองทุกค่า ไม่มี benchmark เติมให้ และไม่รวมในรายได้จริง','Supply your own assumptions. No benchmarks are filled in; results are not real earnings.')}</p><form id="forecast-form"><div class="formgrid">${field('fViews',T('ยอดชมสมมติ','Assumed views'),'','number','required min="0"')}${field('fClick',T('Click-to-view (%)','Click-to-view (%)'),'','number','required min="0" max="100" step="0.01"')}${field('fOrder',T('Orders per click (%)','Orders per click (%)'),'','number','required min="0" step="0.01"')}${sel('fMode',T('วิธีคิดคอมมิชชัน','Commission model'),[['rate',T('อัตรา %','Percentage rate')],['fixed',T('ยอดต่อออเดอร์','Fixed per order')]])}${field('fValue',T('มูลค่าที่มีสิทธิ์คิด / ยอดคอมต่อออเดอร์ (บาท)','Eligible order value / fixed payout (THB)'),'','number','required min="0" step="0.01"')}${field('fRate',T('อัตราคอม % (ใส่ 0 เมื่อใช้ยอดคงที่)','Commission % (0 for fixed payout)'),'','number','required min="0" max="100" step="0.01"')}${field('fApproval',T('สัดส่วนผ่านการยืนยัน (%)','Approval fraction (%)'),'','number','required min="0" max="100" step="0.01"')}${field('fSource',T('ที่มาของสมมติฐานทุกค่า *','Source of these assumptions *'),'','text','required')}</div><button type="submit" class="cyan">${T('คำนวณสถานการณ์','Calculate scenario')}</button></form><div id="forecast-result" class="mt"></div></section></div><div class="stack space">${state.experiments.map(e=>experimentCard(e)).join('')}</div>`}
function experimentCard(e){const posts=[state.posts.find(p=>p.id===e.a),state.posts.find(p=>p.id===e.b)],ms=posts.map(p=>p.metrics.filter(m=>m.window===e.window).sort((a,b)=>a.observedAt.localeCompare(b.observedAt)).at(-1));const compatible=posts[0].platform===posts[1].platform&&posts[0].productId===posts[1].productId&&posts[0].productVariant===posts[1].productVariant;const value=m=>!m?null:e.metric==='click'?ratio(m.clicks,m.views,100):m.attribution!=='post'?null:e.metric==='order'?ratio(m.orders,m.clicks,100):ratio(m.confirmed,m.views,1000);const vs=ms.map(value);let result=T('ยังสรุปไม่ได้','Inconclusive');const enough=compatible&&ms.every(m=>m&&m.views>=state.settings.minViews&&m.clicks>=state.settings.minClicks)&&vs.every(v=>v!==null);if(enough){const rel=Math.abs(vs[0]-vs[1])/Math.max(vs[0],vs[1],.0001);result=rel<.1?T('ผลใกล้เคียงในโพสต์คู่นี้','Similar in this pair'):T('โพสต์ ','Post ')+(vs[0]>vs[1]?'A':'B')+T(' มีค่ามากกว่าในคู่นี้ ยังไม่ใช่ผู้ชนะ',' has a higher observed value; not a proven winner')}return `<section class="card"><div class="row between"><h2>${esc(e.name)}</h2>${badge(e.pre?T('กำหนดล่วงหน้าตามที่ผู้ใช้ระบุ','User-reported prior hypothesis'):T('วิเคราะห์ย้อนหลัง','Retrospective'),e.pre?'cyan':'orange')}</div><p>${esc(result)}</p><div class="grid cols2">${posts.map((p,i)=>`<div class="data-note"><strong>${i?'B':'A'} · ${esc(p.name)}</strong><p>${vs[i]===null?'N/A':num(vs[i])+(e.metric==='commission'?' THB':'%')} · ${e.window}</p></div>`).join('')}</div><p class="sub">${T('ตัวแปร','Variable')}: ${esc(e.variable)} · n=1 ${T('โพสต์ต่อแบบ เวลาและคนดูอาจต่างกัน ไม่มีการทดสอบนัยสำคัญทางสถิติ','post per variant. Audience and timing may differ. No significance test.')}</p>${!compatible?`<p class="notice">${T('สินค้า/ช่องทางต่างกัน ไม่เปรียบเทียบเป็นการทดลองเดียว','Different product or platform: comparison is not treated as a single experiment.')}</p>`:''}</section>`}

function settingsView(){const s=state.settings;return head('WORKSPACE SETTINGS',T('ตั้งค่าให้เข้ากับงานของคุณ','Make this workspace yours'),T('ข้อมูลในเครื่อง บัญชี และบริการที่คุณเลือกใช้','Local records, your account, and services you choose to use.'))+cloudAccountHTML()+`<div class="grid cols2"><section class="card"><h2>${T('เกณฑ์ตั้งต้นของคุณ','Your operating thresholds')}</h2><p class="sub">${T('เป็นเกณฑ์ทำงาน ไม่ใช่ benchmark ตลาดหรือความมั่นใจทางสถิติ','Operating rules, not market benchmarks or statistical confidence.')}</p><form id="settings-form"><div class="formgrid">${field('staleHours',T('เตือนข้อมูลเก่าเมื่อเกิน (ชั่วโมง)','Stale evidence threshold (hours)'),s.staleHours,'number','required min="1" max="720"')}${field('setReserve',T('เวลาสำรองในแผน (%)','Plan buffer (%)'),s.reserve,'number','required min="20" max="80"')}${field('minViews',T('ยอดชมขั้นต่ำก่อนแนะนำ','Minimum views for recommendations'),s.minViews,'number','required min="1"')}${field('minClicks',T('คลิกขั้นต่ำก่อนแนะนำ','Minimum clicks for recommendations'),s.minClicks,'number','required min="1"')}${field('clickTarget',T('เป้า Click-to-view (%)','Click-to-view target (%)'),s.clickTarget,'number','required min="0" max="100" step="0.1"')}${field('orderTarget',T('เป้า Orders per click (%)','Orders per click target (%)'),s.orderTarget,'number','required min="0" step="0.1"')}${field('commissionTarget',T('เป้าคอมยืนยัน/1,000 views (บาท)','Confirmed commission/1,000 views target (THB)'),s.commissionTarget,'number','required min="0" step="0.1"')}</div><label class="check mb"><input id="reduced" type="checkbox" ${s.reduced?'checked':''}>${T('ลดการเคลื่อนไหว','Reduce motion')}</label><button type="submit" class="primary">${T('บันทึกการตั้งค่า','Save settings')}</button></form></section><section class="stack" style="align-content:start"><div class="card"><h2>${T('สำรองและย้ายข้อมูล','Backup & transfer')}</h2><p class="muted">${T('ข้อมูลผูกกับเบราว์เซอร์และไฟล์นี้ การล้างข้อมูลเบราว์เซอร์หรือเปลี่ยนที่ function validateImport(root){const bad=()=>{throw Error(T('ไฟล์ไม่ตรงรูปแบบหรือมีข้อมูล/ความสัมพันธ์ไม่ถูกต้อง','Invalid backup structure, values or record relationships.'))};if(!root||root.app!=='Affiliate Intelligence Studio'||!['real','demo'].includes(root.mode))bad();const x=root.data;if(!x||x.schemaVersion!==2)bad();const arrays=['products','stories','plans','posts','experiments'];for(const k of arrays)if(!Array.isArray(x[k])||x[k].length>5000)bad();const isString=(v,max=30000)=>typeof v==='string'&&v.length<=max;const finite=(v,min=0,max=1e12)=>v===null||typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;const str=(v,max)=>{if(!isString(v,max))bad()};const n=(v,min,max)=>{if(!finite(v,min,max))bad()};const iso=v=>{if(!isString(v)||!Number.isFinite(Date.parse(v)))bad()};const ids=new Set();for(const k of arrays)for(const obj of x[k]){if(!obj||!isString(obj.id,100)||!/^[\w-]+$/.test(obj.id)||ids.has(obj.id))bad();ids.add(obj.id)}for(const p of x.products){['title','variant','shop','affiliate','canonical','sourceText','usecase','imageUrl','status'].forEach(k=>str(p[k],k==='imageUrl'?7500000:30000));if(!shopee(p.affiliate)||p.canonical&&!shopee(p.canonical)||p.imageUrl&&!safeImage(p.imageUrl))bad();['price','commission','rating','reviews'].forEach(k=>n(p[k]));if(p.rating!==null&&p.rating>5)bad();iso(p.observedAt);if(!Array.isArray(p.dims)||p.dims.length!==7||!Array.isArray(p.snapshots))bad();for(const d of p.dims){n(d.rating,0,5);['reason','evidence','source'].forEach(k=>str(d[k]));if(d.source&&!safeUrl(d.source)||d.rating!==null&&(!d.reason.trim()||!d.evidence.trim()))bad()}for(const z of p.snapshots){str(z.id);iso(z.createdAt);n(z.coverage,0,100);n(z.score,0,100)}}const pids=new Set(x.products.map(p=>p.id)),sids=new Set(x.stories.map(s=>s.id)),posts=new Set(x.posts.map(p=>p.id));for(const s of x.stories){if(!pids.has(s.productId)||!['th','en'].includes(s.language)||!['TikTok','Facebook'].includes(s.platform)||![15,30,60].includes(s.duration)||!Array.isArra function applyStudioTab(){if(!storyDraft&&!['brief','angles'].includes(studioTab))studioTab='brief';$$('[data-studio-panel]').forEach(el=>el.hidden=el.dataset.studioPanel!==studioTab);$$('[data-action="studio-tab"]').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===studioTab?'true':'false');b.tabIndex=b.dataset.tab===studioTab?0:-1});if(storyDraft)initStoryHistory();updateHistoryControls();}
function storySnapshot(s){const copy=structuredClone(s);delete copy.revisions;delete copy.ready;delete copy.reviewed;delete copy.linkChecked;return copy;}
function initStoryHistory(){if(!storyDraft)return;if(!storyHistories[storyDraft.id])storyHistories[storyDraft.id]={items:[storySnapshot(storyDraft)],index:0};}
function recordStoryHistory(){clearTimeout(historyTimer);if(!storyDraft)return;syncStory();initStoryHistory();const h=storyHistories[storyDraft.id],snap=storySnapshot(storyDraft);if(JSON.stringify(h.items[h.index])===JSON.stringify(snap))return;h.items=h.items.slice(0,h.index+1);h.items.push(snap);if(h.items.length>60)h.items.shift();h.index=h.items.length-1;updateHistoryControls();}
function updateHistoryControls(){const h=storyDraft&&storyHistories[storyDraft.id];$$('[data-action="undo-story"]').forEach(b=>b.disabled=!h||h.index<=0);$$('[data-action="redo-story"]').forEach(b=>b.disabled=!h||h.index>=h.items.length-1);}
function restoreStoryContent(snapshot){const id=storyDraft.id,productId=storyDraft.productId,revisions=storyDraft.revisions;storyDraft={...structuredClone(snapshot),id,productId,revisions,ready:false,reviewed:false,linkChecked:false};clearDraft('studio');render();queueSession();}
function undoStory(direction){recordStoryHistory();const h=storyHistories[storyDraft.id],next=h.index+direction;if(next<0||next>=h.items.length)return;h.index=next;restoreStoryContent(h.items[next]);}
function legacyRevisionSnapshot(r){const s=storySnapshot(storyDraft),text=r.text||'',lines=text.split('\n');s.name=lines[0]||s.name;s.hookA=lines.find(x=>x.startsWith('Hook A: '))?.slice(8)||s.hookA;s.hookB=lines.find(x=>x.startsWith('Hook B: '))?.slice(8)||s.hookB;if(Array.isArray(r.shots)&&r.shots.length===5)s.shots=structuredClone(r.shots);const caption=text.split('\n\nCaption\n')[1];if(caption){const parts=caption.split('\n\nFacebook\n');s.caption=parts[0];if(parts[1]!==undefined)s.facebook=parts[1]}s.shots[0].voice=s.hookA;return s;}
function revisionPreview(id){syncStory();pendingRevision=storyDraft.revisions.find(r=>r.id===id);if(!pendingRevision)return;const snapshot=pendingRevision.snapshot||legacyRevisionSnapshot(pendingRevision);modal(T('คืนเวอร์ชันเป็นร่างใหม่','Restore this version as a draft'),`<p>${T('เก็บข้อความปัจจุบันเป็นจุดคืนกลับก่อน และต้องตรวจ Ready ใหม่','Your current content is checkpointed first. Review is required again.')}</p><div class="grid cols2"><div class="data-note"><strong>${T('ปัจจุบัน','Current')}</strong><p>${esc(storyDraft.hookA)}</p></div><div class="data-note"><strong>${T('เวอร์ชันที่เลือก','Selected version')}</strong><p>${esc(snapshot.hookA)}</p></div></div>${!pendingRevision.snapshot?`<p class="notice mt">${T('เวอร์ชันเก่าเก็บเฉพาะข้อความและฉาก จะคงบรีฟปัจจุบันไว้ กรุณาทวน Caption และข้อความ Affiliate หลังคืน','Legacy revisions store text and scenes only. The current brief is retained; review caption and disclosure after restoring.')}</p>`:''}`,btn(T('คืนเป็นร่าง','Restore draft'),'confirm-restore-revision','primary'));}
function confirmRevisionRestore(){if(!pendingRevision)return;const snap=pendingRevision.snapshot?structuredClone(pendingRevision.snapshot):legacyRevisionSnapshot(pendingRevision);recordStoryHistory();storyDraft.revisions.push({id:uid(),at:now(),text:storyText(storyDraft),shots:structuredClone(storyDraft.shots),snapshot:storySnapshot(storyDraft),ready:false,checkpoint:true});$('#dialog').close();restoreStoryContent(snap);recordStoryHistory();pendingRevision=null;toast(T('คืนเป็นร่างแล้ว เวอร์ชันเดิมยังอยู่ครบ','Restored as a draft. Previous versions remain available.'));}
function hookLibrary(){const all=[...state.stories.map(s=>({id:s.id,text:s.hookA,name:s.name,productId:s.productId})),...(state.hooks||[])];return `<div class="card space"><div class="section-title"><h2>${T('คลัง Hook ของคุณ','Your hook library')}</h2>${storyDraft?btn(T('เก็บ Hook นี้','Save this hook'),'save-hook','small cyan'):''}</div>${all.length?all.slice().reverse().slice(0,30).map(h=>`<div class="task"><div class="grow"><p>${esc(h.text)}</p><small>${esc(h.name||'')}</small></div>${btn(T('ใช้','Use'),'use-hook','small',`data-id="${esc(h.id)}"`)}</div>`).join(''):`<p class="sub">${T('บันทึกบทหรือ Hook ที่ชอบเพื่อกลับมาใช้กับบริบทที่เหมาะสม','Save stories or useful hooks to reuse in a suitable context.')}</p>`}<p class="sub">${T('ทวนชื่อสินค้าและหลักฐานทุกครั้งก่อนนำ Hook ไปใช้กับสินค้าอื่น','Recheck the product name and evidence when reusing a hook.')}</p></div>`;}

function tickPrompter(ts){if(!promptRunning)return;const elapsed=promptLast?Math.min(100,ts-promptLast):0;promptLast=ts;promptElapsed+=elapsed;const scroll=$('#prompt-scroll');if(!scroll){stopPrompter();return}scroll.scrollTop+=promptSpeed*elapsed/1000;$('#prompt-clock').textContent=String(Math.floor(promptElapsed/60000)).padStart(2,'0')+':'+String(Math.floor(promptElapsed/1000)%60).padStart(2,'0');promptFrame=requestAnimationFrame(tickPrompter);}

function cloudError(error){const code=error?.message||String(error);if(code.includes('CLOUD_CONFLICT'))return T('ข้อมูลบนคลาวด์เปลี่ยนจากอีกเครื่อง ร่างในเครื่องยังอยู่ กรุณาดูข้อมูลคลาวด์ก่อนเลือกอีกครั้ง','Cloud changed on another device. Local drafts are safe. Review the cloud copy before continuing.');if(code.includes('Failed to fetch')||!navigator.onLine)return T('ออฟไลน์หรือเชื่อมต่อไม่ได้ ข้อมูลยังบันทึกในเครื่อง','Offline or connection unavailable. Your work remains on this device.');return T('ทำรายการไม่สำเร็จ: ','Request failed: ')+code;}

let cloudReady=false,cloudAuthEvent=null,cloudRecoveryRequested=false;
async function processCloudAuth(){if(!cloudReady||!cloudAuthEvent)return;const {session}=cloudAuthEvent;cloudAuthEvent=null;if(session?.user?.id!==cloudUser?.id)await switchCloudUser(session?.user||null);if(cloudRecoveryRequested){cloudRecoveryRequested=false;openRecoveryForm()}}
async function initCloud(){if(!CLOUD_CONFIG.url||!CLOUD_CONFIG.publishableKey||!globalThis.SPAffiliateAuth)return;cloudClient=SPAffiliateAuth.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.publishableKey,{auth:{storageKey:'sp-affiliate-auth-v1',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'},global:{fetch:(url,options={})=>fetch(url,{...options,signal:options.signal||AbortSignal.timeout(12000)})}});cloudClient.auth.onAuthStateChange((event,session)=>{cloudAuthEvent={event,session};if(event==='PASSWORD_RECOVERY')cloudRecoveryRequested=true;setTimeout(()=>processCloudAuth().catch(e=>cloudNote(cloudError(e))),0)});try{const result=await Promise.race([cloudClient.auth.getSession(),new Promise(r=>setTimeout(()=>r(null),1800))]);cloudUser=result?.data?.session?.user||null}catch{}}
