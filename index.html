function setCloudChanging(value){if(value){cloudEpoch++;pendingCloud=null;pendingOnline=null;$('#dialog').close()}cloudChanging=value;$('#main').inert=value;$('#nav').inert=value;$('#demo').disabled=value;}
function switchCloudUser(user){const run=cloudSwitchQueue.catch(()=>{}).then(async()=>{if(user?.id===cloudUser?.id)return;clearTimeout(cloudTimer);setCloudChanging(true);try{await flushSession();await persist();cloudUser=user;mode='real';cloudConflict=null;cloudMessage='';resetSession();await load();await loadSession();await loadCloudMeta();page='settings';onlineStatus={shopee:'unknown',ai:'unknown'};pendingOnline=null;pendingCloud=null;render();syncRoute(true)}finally{setCloudChanging(false)}});cloudSwitchQueue=run;return run;}
function cloudAccountHTML(){return `<section class="card mb cloud-panel"><div class="section-title"><div><div class="eyebrow">CLOUD WORKSPACE</div><h2>${T('บัญชีและซิงก์ข้ามเครื่อง','Account & cross-device sync')}</h2></div>${badge(cloudUser?T('บัญชีของคุณ','Your account'):T('ข้อมูลในเครื่อง','Local workspace'),cloudUser?'cyan':'violet')}</div><p class="sub">${T('ข้อมูลเดิมในเครื่องยังอยู่แยกต่างหาก บัญชีแต่ละคนมีพื้นที่ของตัวเอง โหมดตัวอย่างไม่ส่งขึ้นคลาวด์','Your original local records stay separate. Each account has its own workspace. Demo data is never uploaded.')}</p>${!cloudClient?`<p class="notice">${T('ยังไม่ได้กำหนดค่าบริการบัญชี','Account service is not configured.')}</p>`:cloudUser?`<p><strong>${esc(cloudUser.email||'')}</strong></p><div class="actions">${btn(T('ส่งข้อมูลเครื่องนี้ขึ้นคลาวด์','Upload this workspace'),'cloud-upload','cyan')}${btn(T('ดูและรับข้อมูลจากคลาวด์','Review cloud copy'),'cloud-download','ghost')}${btn(T('คัดลอกข้อมูลเดิมในเครื่องเข้าบัญชี','Copy original local records'),'cloud-copy-guest','ghost')}${btn(T('ออกจากระบบ','Sign out'),'cloud-signout','ghost')}</div><label class="check mt"><input id="cloud-auto" type="checkbox" ${cloudMeta.auto?'checked':''} ${cloudMeta.revision?'':'disabled'}>${T('ส่งขึ้นคลาวด์อัตโนมัติหลังบันทึก (เปิดได้หลังซิงก์ครั้งแรก)','Automatically upload after saving (available after first sync)')}</label><p class="sub">${T('เวอร์ชันที่เครื่องนี้รู้จัก','Known cloud revision')}: ${cloudMeta.revision||0} · ${T('ข้อมูลที่แก้พร้อมกันจะหยุดให้เลือก ไม่เขียนทับอัตโนมัติ','Concurrent edits stop for review instead of overwriting.')}</p>`:`<form id="cloud-login-form" data-private><div class="formgrid">${field('cloud-email',T('อีเมล','Email'),'','email','required autocomplete="email"')}${field('cloud-password',T('รหัสผ่าน','Password'),'','password','required autocomplete="current-password"')}</div><div class="actions"><button type="submit" class="primary">${T('เข้าสู่ระบบ','Sign in')}</button>${btn(T('สมัครบัญชี','Create account'),'cloud-signup','cyan')}${btn(T('ลืมรหัสผ่าน','Forgot password'),'cloud-reset','ghost')}</div><p class="sub">${T('บัญชีใหม่ต้องยืนยันอีเมล รหัสผ่านไม่ถูกเก็บในร่างหรือไฟล์สำรอง','New accounts require email verification. Passwords are excluded from drafts and backups.')}</p></form>`}<p id="cloud-message" class="notice info mt" role="status">${esc(cloudMessage||T('ร่างบันทึกในเครื่องเสมอ ซิงก์ครั้งแรกเมื่อคุณเลือก','Drafts always save locally. First sync happens when you choose.'))}</p></section>`;}
function scheduleCloudUpload(){clearTimeout(cloudTimer);if(cloudUser&&cloudMeta.auto&&mode==='real'&&!cloudChanging&&!cloudBusy&&!cloudConflict)cloudTimer=setTimeout(()=>cloudUpload().catch(e=>cloudNote(cloudError(e))),2000);}
function cloudContext(){return {owner:cloudUser?.id,scope:workspaceKey(),epoch:cloudEpoch};}
function assertCloudContext(context){if(!context||cloudChanging||mode!=='real'||context.owner!==cloudUser?.id||context.scope!==workspaceKey()||context.epoch!==cloudEpoch)throw Error(T('บัญชีหรือพื้นที่ทำงานเปลี่ยนแล้ว กรุณาทำรายการใหม่','Account or workspace changed. Try again.'));}
async function requireCloud(){if(!cloudClient||!cloudUser||mode!=='real')throw Error(T('เข้าสู่ระบบและใช้โหมดข้อมูลจริงก่อน','Sign in and switch to your real workspace first.'));const context=cloudContext();const {data,error}=await cloudClient.auth.getUser();assertCloudContext(context);if(error||data.user?.id!==context.owner)throw Error(T('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง','Session expired. Sign in again.'));return context.owner;}
async function cloudUpload(){if(cloudBusy||cloudChanging)return;cloudBusy=true;const scope=workspaceKey(),context=cloudContext();let uploadedVersion=sessionVersion;try{const owner=await requireCloud();await flushSession();assertCloudContext(context);const payload=backupPayload();validateImport(payload);validateRecovery(payload.editingSession,payload.data);const snapshot=structuredClone(payload);uploadedVersion=sessionVersion;cloudNote(T('กำลังส่งขึ้นคลาวด์…','Uploading…'));const {data,error}=await cloudClient.rpc('sp_affiliate_save_workspace',{p_expected_revision:cloudMeta.revision||0,p_payload:snapshot});assertCloudContext(context);if(error){if(error.message?.includes('CLOUD_CONFLICT'))cloudConflict=true;throw error}if(scope!==workspaceKey()||cloudUser?.id!==owner)return;cloudMeta={...cloudMeta,revision:data.revision};await writeRecord('cloud-meta:'+scope,cloudMeta);cloudNote(T('ซิงก์สำเร็จ เวอร์ชัน ','Synced revision ')+data.revision);if($('#cloud-auto'))$('#cloud-auto').disabled=false;}finally{cloudBusy=false;if(scope===workspaceKey()&&uploadedVersion!==sessionVersion)scheduleCloudUpload();}}
async function fetchCloud(){const context=cloudContext();const owner=await requireCloud();const {data,error}=await cloudClient.from('sp_affiliate_workspaces').select('revision,payload,updated_at').eq('owner_id',owner).maybeSingle();assertCloudContext(context);if(error)throw error;if(!data)throw Error(T('ยังไม่มีข้อมูลบนคลาวด์ ใช้ส่งขึ้นคลาวด์ครั้งแรก','No cloud copy yet. Upload this workspace first.'));const valid=validateImport(data.payload),recovery=validateRecovery(data.payload.editingSession,valid);return {...data,payload:{...data.payload,data:valid,editingSession:recovery},owner,context};}
let pendingCloud=null;
async function previewCloud(){const result=await fetchCloud();assertCloudContext(result.context);pendingCloud=result;modal(T('ตรวจข้อมูลคลาวด์ก่อนรับลงเครื่อง','Review cloud data before downloading'),`<p>${T('เวอร์ชัน','Revision')} ${pendingCloud.revision} · ${pendingCloud.payload.data.products.length} ${T('สินค้า','products')} · ${pendingCloud.payload.data.stories.length} ${T('บท','stories')}</p><p>${T('การรับลงเครื่องจะแทนที่พื้นที่บัญชีนี้ และเก็บสำเนาปัจจุบันในเครื่องให้กู้กลับได้ ข้อมูลผู้ใช้ทั่วไปเดิมไม่ถูกเปลี่ยน','Downloading replaces this account workspace and retains a local recovery copy. Original guest records are unchanged.')}</p><div class="actions">${btn(T('ดาวน์โหลด JSON คลาวด์','Download cloud JSON'),'cloud-export-remote','ghost')}</div>`,btn(T('สำรองแล้วรับข้อมูลคลาวด์','Back up & download'),'cloud-confirm-download','primary'));}
async function writeCloudBatch(entries){const frozen=structuredClone(entries);const job=saveQueue.catch(()=>{}).then(()=>new Promise((resolve,reject)=>{const tx=db.transaction('workspaces','readwrite');for(const [key,value]of frozen)tx.objectStore('workspaces').put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Transaction aborted'))}));saveQueue=job;await job;}
function applyCloudCopy(copy){const run=cloudSwitchQueue.catch(()=>{}).then(()=>applyCloudCopyNow(copy));cloudSwitchQueue=run;return run;}
async function applyCloudCopyNow(copy){assertCloudContext(copy.context);if(copy.owner!==cloudUser?.id||mode!=='real')throw Error('Account changed');setCloudChanging(true);clearTimeout(cloudTimer);try{await flushSession();const scope=workspaceKey(),previous=backupPayload();const session=copy.payload.editingSession||{version:1,drafts:{},sessionStories:{},page:'settings'};const meta={revision:copy.revision,auto:false};await writeCloudBatch([[scope,copy.payload.data],['session:'+scope,session],['cloud-backup:'+scope,previous],['cloud-meta:'+scope,meta]]);try{localStorage.removeItem(journalKey())}catch{}await load();await loadSession();cloudMeta=meta;cloudConflict=null;page='settings';render();syncRoute(true);cloudNote(T('รับข้อมูลแล้ว สำเนาก่อนรับเก็บไว้ในเครื่อง','Downloaded. The previous copy is retained on this device.'));}finally{setCloudChanging(false)}}
function openRecoveryForm(){modal(T('ตั้งรหัสผ่านใหม่','Set a new password'),`<form id="cloud-recovery-form" data-private>${field('cloud-new-password',T('รหัสผ่านใหม่อย่างน้อย 10 ตัว','New password, at least 10 characters'),'','password','required minlength="10" autocomplete="new-password"')}<button type="submit" class="primary mt">${T('บันทึกรหัสผ่าน','Save password')}</button></form>`);}
function authRedirect(){return location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'?location.origin+location.pathname:undefined;}
async function handleCloudAction(action){if(!cloudClient)throw Error('Cloud is not configured');if(action==='cloud-signup'){const email=$('#cloud-email').value,password=$('#cloud-password').value;if(!$('#cloud-login-form').reportValidity())return;if(password.length<10)throw Error(T('รหัสผ่านใหม่ต้องมีอย่างน้อย 10 ตัว','New passwords need at least 10 characters.'));const {error}=await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:authRedirect()}});if(error)throw error;$('#cloud-password').value='';cloudNote(T('ตรวจอีเมลเพื่อยืนยันบัญชี หากไม่ได้รับ ให้ตรวจการตั้งค่าอีเมลของบริการ','Check your email to verify your account. If no email arrives, check the service email configuration.'));}if(action==='cloud-reset'){const email=$('#cloud-email').value;if(!$('#cloud-email').reportValidity())return;const {error}=await cloudClient.auth.resetPasswordForEmail(email,{redirectTo:authRedirect()});if(error)throw error;cloudNote(T('หากมีบัญชีที่ใช้อีเมลนี้ ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่','If this email has an account, a password-reset link will be sent.'));}if(action==='cloud-signout'){await flushSession();await persist();const {error}=await cloudClient.auth.signOut({scope:'local'});if(error)throw error;await switchCloudUser(null);}if(action==='cloud-upload')await cloudUpload();if(action==='cloud-download')await previewCloud();if(action==='cloud-export-remote'&&pendingCloud){assertCloudContext(pendingCloud.context);download('Affiliate-cloud.json',JSON.stringify(pendingCloud.payload,null,2),'application/json');}if(action==='cloud-confirm-download'&&pendingCloud){await applyCloudCopy(pendingCloud);pendingCloud=null;$('#dialog').close();}if(action==='cloud-copy-guest'){await requireCloud();modal(T('คัดลอกข้อมูลเดิมเข้าพื้นที่บัญชี','Copy original records into this account'),`<p>${T('จะรวมข้อมูลสินค้า บท และผลจากพื้นที่ผู้ใช้ทั่วไปในเครื่องนี้ โดยไม่ลบต้นฉบับ ID ซ้ำจะเก็บข้อมูลบัญชีปัจจุบัน','Merge products, stories and results from this device’s guest workspace. Original records are retained; duplicate IDs keep the current account version.')}</p>`,btn(T('คัดลอกข้อมูล','Copy records'),'cloud-confirm-guest','primary'));}if(action==='cloud-confirm-guest')await copyGuestToAccount();if(action==='cloud-export-recovery'){const context=cloudContext();const saved=await readRecord('cloud-backup:'+workspaceKey());assertCloudContext(context);if(!saved)throw Error(T('ยังไม่มีสำเนาก่อนซิงก์','No pre-sync recovery copy yet.'));download('Affiliate-before-sync.json',JSON.stringify(saved,null,2),'application/json');}}
async function handleCloudSubmit(form){if(!form.reportValidity())return;const button=form.querySelector('button');button.disabled=true;try{if(form.id==='cloud-login-form'){const {data,error}=await cloudClient.auth.signInWithPassword({email:$('#cloud-email').value,password:$('#cloud-password').value});if(error)throw error;await switchCloudUser(data.user);}else{const {error}=await cloudClient.auth.updateUser({password:$('#cloud-new-password').value});if(error)throw error;$('#dialog').close();toast(T('เปลี่ยนรหัสผ่านแล้ว','Password updated.'));}}finally{button.disabled=false}}
window.addEventListener('online',()=>scheduleCloudUpload());

function switchWorkspaceMode(){const run=cloudSwitchQueue.catch(()=>{}).then(async()=>{setCloudChanging(true);clearTimeout(cloudTimer);try{await flushSession();await persist();mode=mode==='real'?'demo':'real';try{localStorage.setItem('aff-mode',mode)}catch{}await load();if(mode==='demo'&&!state.products.length){state=demoData();await persist()}page='today';await loadSession();await loadCloudMeta();render();syncRoute(true)}finally{setCloudChanging(false)}});cloudSwitchQueue=run;return run;}

function copyGuestToAccount(){const context=cloudContext();const run=cloudSwitchQueue.catch(()=>{}).then(async()=>{await requireCloud();assertCloudContext(context);setCloudChanging(true);try{await flushSession();const guest=await readRecord('real');if(guest){const next=structuredClone(state);for(const key of ['products','stories','plans','posts','experiments','hooks']){const ids=new Set((next[key]||[]).map(x=>x.id));next[key]=[...(next[key]||[]),...(guest[key]||[]).filter(x=>!ids.has(x.id))]}validateImport({app:'Affiliate Intelligence Studio',mode:'real',data:next});await writeCloudBatch([['cloud-backup:'+workspaceKey(),backupPayload()],[workspaceKey(),next]]);state=next;render();queueSession();}}finally{setCloudChanging(false)}});cloudSwitchQueue=run;return run;}

let onlineStatus={shopee:'unknown',ai:'unknown'},onlineVerified={},pendingOnline=null;
function providerBadge(kind){const status=onlineStatus[kind];const label=status==='connected'?T('ทดสอบเรียกใช้สำเร็จ','Last request succeeded'):status==='configured_unverified'?T('ตั้งค่าแล้ว ยังไม่ยืนยัน','Configured, unverified'):status==='not_configured'?T('ยังไม่เชื่อมต่อ','Not connected'):status==='error'?T('เชื่อมต่อไม่สำเร็จ','Connection failed'):T('ยังไม่ตรวจการเชื่อมต่อ','Not checked');return badge(label,status==='connected'?'green':'orange');}
function onlineStatusHTML(){return `<section class="card"><h2>${T('บริการออนไลน์','Online services')}</h2><div id="online-services"><div class="task">Shopee ${providerBadge('shopee')}</div><div class="task">AI ${providerBadge('ai')}</div></div><p class="sub">${T('ตรวจสถานะเมื่อเข้าสู่ระบบ คีย์บริการเก็บบนเซิร์ฟเวอร์เท่านั้น การดึงสินค้าและสร้างบทจะส่งเฉพาะข้อมูลที่เลือกเมื่อกดใช้งาน','Sign in to check status. Service keys stay on the server. Product retrieval and generation send only selected data when you request them.')}</p>${btn(T('ตรวจการตั้งค่าบริการ','Check service configuration'),'online-status','ghost')}</section>`;}
async function providerRequest(body){const context=cloudContext();await requireCloud();assertCloudContext(context);const owner=cloudUser.id;const {data,error}=await cloudClient.functions.invoke(CLOUD_CONFIG.functionName,{body});assertCloudContext(context);if(cloudUser?.id!==owner)throw Error(T('บัญชีเปลี่ยนแล้ว กรุณาทำรายการใหม่','Account changed. Try again.'));if(error){let code;try{code=(await error.context?.json())?.error}catch{}throw Error(code||error.message)}if(data?.error)throw Error(data.error);return data;}
function onlineProductControls(){return `<div class="notice info mb"><div class="actions">${btn(T('ดึงข้อมูลจากลิงก์ Shopee','Retrieve Shopee details'),'online-shopee','cyan')}${btn(T('ให้ AI ช่วยดูหลักฐาน','Ask AI to review evidence'),'online-analysis','ghost')}</div><p class="sub mt">${T('ใช้บัญชีที่เข้าสู่ระบบ และต้องเชื่อมบริการก่อน ข้อมูลที่ดึงมาจะแสดงให้ตรวจ ไม่ทับลิงก์ Affiliate หรือคะแนนของคุณ','Requires sign-in and configured services. Retrieved fields are reviewed first; your affiliate link and rubric scores are preserved.')}</p></div>`;}
function onlineProductInput(){const val=id=>$('#'+id)?.value||'';if(page==='analyze')return {id:selected,title:val('title'),variant:val('variant'),usecase:val('usecase'),price:N(val('price')),observedAt:val('observed'),sourceText:val('sourceText'),dims:WEIGHTS.map((_,i)=>({rating:N(val('dim'+i)),reason:val('reason'+i),evidence:val('ev'+i),source:val('src'+i)}))};return product(storyDraft?.productId||$('#storyProduct')?.value||studioProductId);}
function aiPreview(result){return `<p class="notice">${T('ข้อเสนอจาก AI ต้องทวนกับหลักฐาน ไม่มีการปรับคะแนนหรือ Ready อัตโนมัติ','AI suggestions require evidence review. Scores and Ready status are not changed automatically.')}</p>${result.summary?`<p>${esc(result.summary)}</p>${[['strengths',T('จุดที่มีหลักฐาน','Supported strengths')],['gaps',T('ข้อมูลที่ขาด','Evidence gaps')],['angles',T('มุมเนื้อหา','Content angles')]].map(([key,label])=>`<h3 class="mt">${label}</h3><ul>${result[key].map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`).join('')}`:`<h3>${esc(result.name)}</h3><p>${esc(result.hookA)}</p>${result.shots.map((s,i)=>`<div class="data-note mt"><strong>${i+1} · ${esc(s.time)}</strong><p>${esc(s.voice)}</p><small>${esc(s.evidence)}</small></div>`).join('')}`}`;}
async function handleOnlineAction(action){if(action==='online-status'){const result=await providerRequest({action:'status'});for(const kind of ['shopee','ai'])onlineStatus[kind]=result[kind]||'unknown';capture();render();return;}
 if(action==='online-shopee'){const url=$('#affiliate')?.value;if(!shopee(url))throw Error(T('วางลิงก์ Shopee HTTPS ก่อน','Enter a Shopee HTTPS link first.'));const owner=cloudUser?.id,selectedId=selected;try{const data=await providerRequest({action:'shopee',url});onlineStatus.shopee='connected';onlineVerified.shopee=data.verifiedAt;pendingOnline={kind:'shopee',context:cloudContext(),owner,selectedId,url,data};modal(T('ตรวจข้อมูลสินค้าที่ดึงมา','Review retrieved product details'),`<h3>${esc(data.product.title)}</h3><p>${esc(data.product.shop)}</p><p>${T('ช่วงราคา','Price range')}: ${money(data.product.priceMin)} – ${money(data.product.priceMax)}</p><p>${T('อัตราคอมมิชชันที่ API รายงาน','Reported commission rate')}: ${data.product.commissionRate??'—'}%</p><p class="notice">${T('จะเติมเฉพาะช่องว่าง ช่วงราคาไม่ใช่ราคาของรุ่นที่เลือก ตรวจรุ่น รูป และเงื่อนไขอีกครั้ง','Only empty fields will be filled. A price range is not the selected variant’s price. Verify variant, image and conditions.')}</p>`,btn(T('เติมช่องว่างจากข้อมูลนี้','Fill empty fields'),'online-apply-shopee','primary'));}catch(e){onlineStatus.shopee=e.message==='SHOPEE_NOT_CONFIGURED'?'not_configured':'error';throw e;}return;}
 if(action==='online-apply-shopee'){const p=pendingOnline;assertCloudContext(p?.context);if(!p||p.owner!==cloudUser?.id||page!=='analyze'||p.selectedId!==selected||$('#affiliate').value!==p.url)throw Error(T('ร่างเปลี่ยนแล้ว กรุณาดึงข้อมูลใหม่','Draft changed. Retrieve details again.'));const data=p.data.product;for(const [key,value]of Object.entries({title:data.title,shop:data.shop,canonical:data.canonical,price:data.price,rating:data.rating,imageUrl:data.imageUrl})){const el=$('#'+key);if(el&&!el.value&&value!==null&&value!==undefined)el.value=value}if(!$('#sourceText').value)$('#sourceText').value=[data.source,data.canonical,data.observedAt,T('ตรวจรุ่นและเงื่อนไขก่อนใช้','Verify variant and conditions before use'),data.commissionRate===null?'':T('อัตราคอมมิชชันที่รายงาน: ','Reported commission rate: ')+data.commissionRate+'%'].filter(Boolean).join('\n');capture();queueSession();$('#dialog').close();pendingOnline=null;return;}

if(form.id==='metric-form'){const p=state.posts.find(p=>p.id===v('metricPost')),dt=v('metricDate')+':00+07:00',age=(Date.parse(dt)-Date.parse(p.publishedAt))/36e5,expected={'24h':24,'72h':72,'7d':168}[v('metricWindow')];if(Date.parse(dt)>Date.now())throw Error(T('เวลาสังเกตห้ามเป็นอนาคต','Observation time cannot be in the future.'));if(Math.abs(age-expected)>expected*.15)throw Error(T('อายุโพสต์ไม่ตรงช่วงที่เลือก (ยอมคลาดเคลื่อน 15%) เลือกวันเวลาที่ใกล้ช่วงวัด','Post age does not match the window (15% tolerance). Use a matching observation time.'));const m={id:uid(),window:v('metricWindow'),observedAt:dt,source:v('metricSource').trim(),attribution:v('attribution')};['views','clicks','orders','cancelled','sales','estimated','confirmed','cost','retention'].forEach(k=>m[k]=N(v('m-'+k)));if(['views','clicks','orders','confirmed'].every(k=>m[k]===null))throw Error(T('กรอกอย่างน้อยหนึ่งยอดหลัก','Enter at least one primary metric.'));if(m.cancelled!==null&&m.orders!==null&&m.cancelled>m.orders)throw Error(T('ยอดยกเลิกต้องไม่เกินยอดออเดอร์','Cancelled orders cannot exceed total orders.'));const same=p.metrics.find(x=>x.window===m.window&&x.observedAt===m.observedAt);if(same)throw Error(T('มี snapshot เวลานี้แล้ว ใช้เวลาสังเกตใหม่เพื่อแก้ไข','A snapshot exists at this time. Use a new observation timestamp.'));p.metrics.push(m);await persist();clearDraft('results');render();toast(T('บันทึก snapshot แล้ว ไม่มีการบวกยอดซ้ำ','Snapshot saved without double counting.'))}
if(form.id==='experiment-form'){if(v('expA')===v('expB'))throw Error(T('เลือกคนละโพสต์','Choose two different posts.'));state.experiments.push({id:uid(),name:v('expName'),a:v('expA'),b:v('expB'),variable:v('expVariable'),metric:v('expMetric'),window:v('expWindow'),pre:$('#expPre').checked,createdAt:now()});await persist();clearDraft('lab');render()}
if(form.id==='forecast-form'){const orders=+v('fViews')*(+v('fClick')/100)*(+v('fOrder')/100),payout=v('fMode')==='fixed'?+v('fValue'):+v('fValue')*(+v('fRate')/100),commission=orders*payout*(+v('fApproval')/100);$('#forecast-result').innerHTML=`<div class="notice info"><strong>${T('สถานการณ์สมมติ ไม่ใช่การพยากรณ์','Hypothetical scenario, not a prediction')}</strong><p>${T('ออเดอร์สมมติ','Assumed orders')}: ${num(orders)}<br>${T('คอมมิชชันสมมติหลังปรับสัดส่วนยืนยัน','Assumed commission after approval fraction')}: ${money(commission)}</p><small>${T('ที่มา','Source')}: ${esc(v('fSource'))}</small></div>`}
if(form.id==='settings-form'){['staleHours','minViews','minClicks','clickTarget','orderTarget','commissionTarget'].forEach(k=>state.settings[k]=+v(k));state.settings.reserve=+v('setReserve');state.settings.reduced=$('#reduced').checked;await persist();clearDraft('settings');render();toast(T('บันทึกการตั้งค่าแล้ว','Settings saved.'))}
syncRoute();queueSession();}catch(err){toast(err.message||String(err))}finally{delete form.dataset.saving;submits.forEach(b=>b.disabled=false)}});
window.addEventListener('beforeunload',e=>{if(saveFailure||sessionVersion>savedSessionVersion){e.preventDefault();e.returnValue=''}});
(async()=>{try{try{mode=localStorage.getItem('aff-mode')==='demo'?'demo':'real'}catch{}db=await openDB();await initCloud();await load();await loadSession();await loadCloudMeta()}catch(e){state=state||base();db=null}render();if(location.hash)await applyLocation();else syncRoute(true);cloudReady=true;await processCloudAuth();if(!db){saveFailure=true;saveIndicator('error');toast(T('พื้นที่บันทึกไม่พร้อม ส่งออกสำรองก่อนปิดหน้า','Storage unavailable. Export your work before closing.'))}})();

document.addEventListener('keydown',e=>{if(e.target.closest('.studio-tabs')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const tabs=$$('[data-action="studio-tab"][role="tab"]:not(:disabled)'),i=tabs.indexOf(e.target),next=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click();tabs[next].focus()}if(page==='studio'&&storyDraft&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.matches('input,textarea')){e.preventDefault();undoStory(e.shiftKey?1:-1)}});
$('#dialog').addEventListener('close',stopPrompter);
