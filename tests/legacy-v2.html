function render(){document.documentElement.lang=lang;document.body.classList.toggle('reduce',state.settings.reduced);const nav=navItems();$('#nav').innerHTML=nav.map(([k,l])=>`<button data-action="nav" data-page="${k}" class="${page===k?'active':''} ${['today','analyze','studio','planner'].includes(k)?'mobile':''}" ${page===k?'aria-current="page"':''}>${icon(k)}<span>${l}</span>${k==='products'?`<span class="navcount">${state.products.length}</span>`:''}</button>`).join('')+`<button data-action="more" class="mobile ${['products','results','lab','settings'].includes(page)?'active':''}">${icon('more')}<span>${T('เพิ่มเติม','More')}</span></button>`;$('#crumb').textContent='Workspace / '+(nav.find(x=>x[0]===page)?.[1]||'');$('#lang').textContent=lang==='th'?'EN':'ไทย';$('#demo').textContent=mode==='demo'?T('กลับข้อมูลจริง','My workspace'):T('ลองตัวอย่าง','Try demo');$('#mode-badge').innerHTML=badge(T('โหมดในเครื่อง','Local workspace'),'cyan');$('#demo-banner').classList.toggle('hidden',mode!=='demo');$('#demo-banner').textContent=T('โหมดตัวอย่าง • ข้อมูลสมมติ แยกจากข้อมูลจริงของคุณ','DEMO WORKSPACE • Fictional data, isolated from your real records');$('#local-label').textContent=T('เก็บข้อมูลเฉพาะเครื่องนี้','Data stays on this device');$('#nav-label').textContent=T('พื้นที่ทำงาน','WORKSPACE');$('#backup-top').textContent=T('สำรองข้อมูล','Backup');$('#save-status').textContent=db?T('บันทึกในเครื่องอัตโนมัติ','Local autosave'):T('บันทึกไม่ได้ — ส่งออกสำรอง','Storage unavailable — export backup');const views={today:todayView,analyze:analyzeView,products:productsView,studio:studioView,planner:plannerView,results:resultsView,lab:labView,settings:settingsView};$('#main').innerHTML=views[page]();restore();}
function head(k,title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>${actions}</div>`}
function kpi(label,value,note,color=''){return `<div class="card stat"><span class="muted">${label}</span><div class="value ${color}">${value}</div><span class="sub">${note}</span></div>`}
function paired(rows,a,b,mul=1){const valid=rows.filter(x=>x[a]!==null&&x[a]!==undefined&&x[b]!==null&&x[b]!==undefined);return valid.length?ratio(valid.reduce((n,x)=>n+x[a],0),valid.reduce((n,x)=>n+x[b],0),mul):null}
function total(rows,key){let r=rows.filter(x=>x[key]!==null&&x[key]!==undefined);return r.length?r.reduce((n,x)=>n+x[key],0):null}
function latestRows(window=filter.window,platform=filter.platform){return state.posts.filter(p=>platform==='all'||p.platform===platform).flatMap(p=>{const m=p.metrics.filter(x=>x.window===window).sort((a,b)=>a.observedAt.localeCompare(b.observedAt)).at(-1);return m?[{...m,post:p}]:[]})}
function attributed(rows){return rows.filter(x=>x.attribution==='post')}
function todayView(){const rows=latestRows('72h','all'),a=attributed(rows),tasks=[];if(!state.products.length)tasks.push([T('เริ่มจากสินค้าที่อยากขาย','Start with a product'),T('วางลิงก์แล้วเพิ่มหลักฐานที่มี','Paste a link and add the evidence you have'),'analyze',T('เริ่มวิเคราะห์','Analyze'),10]);const incomplete=state.products.find(p=>score(p).coverage<60);if(incomplete)tasks.push([T('เติมหลักฐานให้ ','Add evidence for ')+incomplete.title,T('คะแนนยังไม่แสดงจนกว่าหลักฐานครบ 60%','Score stays hidden below 60% evidence coverage'),'products',T('ตรวจหลักฐาน','Review evidence'),15]);if(state.products.length&&!state.stories.length)tasks.push([T('เลือกหนึ่งเรื่องที่จะเล่า','Choose your next story'),T('สร้างชุดถ่ายทำจากสินค้าที่เลือกไว้','Build a shoot pack for a saved product'),'studio',T('สร้างบท','Create story'),20]);const due=state.plans.flatMap(p=>p.tasks).filter(t=>t.status!=='done'&&t.date<=today());if(due.length)tasks.push([T('งานที่ถึงกำหนด ','Tasks due: ')+due.length,T('ตรวจ dependency ก่อนเริ่มงาน','Check dependencies before starting'),'planner',T('เปิดแผนงาน','Open planner'),due[0].effort]);if(state.posts.length)tasks.push([T('อัปเดตยอดที่อายุโพสต์เท่ากัน','Measure posts at the same age'),T('เปรียบเทียบ 72 ชั่วโมงกับ 72 ชั่วโมง','Compare 72 hours with 72 hours'),'results',T('บันทึกผล','Log results'),10]);if(state.products.length&&!tasks.length)tasks.push([T('เตรียมแผนรอบถัดไป','Plan your next production cycle'),T('จองเวลา 80% และเหลือพื้นที่สำหรับงานแทรก','Use 80% capacity and keep a buffer'),'planner',T('วางแผน','Plan'),15]);return head('YOUR CREATOR WORKSPACE',T('วันนี้ จะเล่าเรื่องอะไรดี?','What will you create today?'),T('จากสินค้าที่สนใจ สู่คอนเทนต์ที่ตรวจสอบและวัดผลได้','Turn product evidence into stories you can make and measure.'),btn(T('+ เพิ่มสินค้า','+ Add product'),'new-product','primary'))+`<div class="grid cols4 mb">${kpi(T('สินค้าที่กำลังดู','Products in focus'),state.products.length,T('ข้อมูลของคุณในเครื่องนี้','Saved in this workspace'),'cyantext')}${kpi(T('บทพร้อมถ่าย','Ready stories'),state.stories.filter(s=>s.ready).length,T('ผ่านการตรวจของผู้ใช้','Reviewed by you'))}${kpi(T('ยอดชม · 72 ชม.','Views · 72h'),num(total(rows,'views')),T('snapshot ล่าสุดต่อโพสต์','Latest snapshot per post'))}${kpi(T('คอมมิชชันยืนยัน','Confirmed commission'),money(total(a,'confirmed')),T('เฉพาะยอดที่ระบุโพสต์ได้ · 72 ชม.','Post-attributed only · 72h'))}</div><div class="grid mainaside"><section class="card glow"><div class="section-title"><h2>${T('โฟกัสวันนี้','Today’s focus')}</h2>${badge(T('ไม่เกิน 3 งาน','Up to 3 priorities'),'cyan')}</div>${tasks.slice(0,3).map((t,i)=>`<div class="task"><span class="tasknum">0${i+1}</span><div class="grow"><h3>${esc(t[0])}</h3><p class="sub">${t[1]}</p>${btn(t[3],'nav','small',`data-page="${t[2]}"`)}</div><small>${t[4]} ${T('นาที','min')}</small></div>`).join('')}<div class="flowstrip">${[T('หลักฐาน','Evidence'),T('เรื่องเล่า','Story'),T('แผนถ่าย','Production'),T('วัดผล','Learning')].map(x=>`<span>${x}</span>`).join('')}</div></section><section class="card tone-violet"><div class="eyebrow" style="color:var(--violet)">STORY INTELLIGENCE</div><h2>${T('เล่าให้ตรงปัญหา ก่อนเริ่มขาย','Start with a real problem')}</h2><p class="muted">${T('เลือกคนดูหนึ่งกลุ่ม สถานการณ์หนึ่งอย่าง และหลักฐานที่คุณแสดงได้จริง','Choose one audience, one situation and proof you can actually show.')}</p><div class="data-note">${T('ยังไม่มีสินค้า? ใช้บทวิธีเลือกหรือเช็กลิสต์ก่อนซื้อ โดยไม่แต่งประสบการณ์ใช้จริง','No product in hand? Make a buying checklist without pretending you tested it.')}</div><div class="mt">${btn(T('เปิด Story Studio','Open Story Studio'),'nav','ghost',`data-page="studio"`)}</div></section></div><div class="grid cols2 space"><div class="card"><h2>${T('ความพร้อมของข้อมูล','Evidence readiness')}</h2>${state.products.length?state.products.slice(-4).map(p=>`<div class="mt"><div class="row between"><span>${esc(p.title)}</span><small>${score(p).coverage}%</small></div><div class="bar"><i style="width:${score(p).coverage}%"></i></div></div>`).join(''):`<p class="muted">${T('ไม่มีข้อมูลสมมติในพื้นที่จริง เพิ่มสินค้าเพื่อเริ่มต้น','Your real workspace starts clean. Add a product to begin.')}</p>`}</div><div class="card"><h2>${T('สถานะความสามารถ','Available capabilities')}</h2><div class="task"><span class="grow">${T('วิเคราะห์ตามกฎ / บทแม่แบบ / แผน / ผล','Rule scoring / templates / planning / results')}</span>${badge(T('พร้อมใช้','Available'),'green')}</div><div class="task"><span class="grow">Shopee / AI / Online research</span>${badge(T('ยังไม่เชื่อมต่อ','Not connected'),'orange')}</div><p class="sub">${T('ไฟล์นี้ทำงานในเครื่อง ไม่มีการค้นออนไลน์หรือดึงข้อมูลสินค้าอัตโนมัติ','This file works locally. No online research or automatic product retrieval.')}</p></div></div>`}
function analyzeView(){const p=product(selected)||{dims:Array.from({length:7},()=>({rating:null,evidence:'',reason:''})),observedAt:now()};return head('PRODUCT INTELLIGENCE',T('รู้จักสินค้า ก่อนเลือกขาย','Evidence before a sales pitch'),T('ระบุรุ่นและที่มาให้ชัด แล้วให้คะแนนจากหลักฐาน','Identify the variant and sources, then assess the evidence.'))+`<div class="notice info mb">${T('การดึงข้อมูลจากลิงก์ยังไม่เชื่อมต่อ: วางลิงก์เพื่อเก็บไว้ แล้วคัดลอกข้อมูลหรือเพิ่มรูปจากหน้าสินค้า ข้อมูลทั้งหมดต้องตรวจเอง','Link retrieval is not connected. Save the link, paste product information or add an image, then verify the fields yourself.')}</div><form id="product-form"><div class="grid mainaside"><div class="stack"><section class="card"><div class="section-title"><h2>${T('01 · ข้อมูลสินค้า','01 · Product details')}</h2>${badge(T('ผู้ใช้กรอก','User-provided'),'cyan')}</div><div class="formgrid">${field('affiliate',T('ลิงก์ Affiliate เดิม *','Original affiliate link *'),p.affiliate||'','url','required placeholder="https://s.shopee.co.th/…"')}${field('canonical',T('ลิงก์สินค้าหลัก (ถ้ามี)','Canonical product URL (optional)'),p.canonical||'','url')}${field('title',T('ชื่อสินค้า *','Product name *'),p.title||'','text','required maxlength="200"')}${field('variant',T('รุ่น / ขนาด / ตัวเลือก *','Variant / size / option *'),p.variant||'','text','required maxlength="120"')}${field('shop',T('ร้านค้า','Shop'),p.shop||'')}${field('price',T('ราคาของรุ่นนี้ (บาท)','Variant price (THB)'),p.price??'','number','min="0" step="0.01"')}${field('commission',T('คอมมิชชันต่อออเดอร์ (บาท ถ้าทราบ)','Commission per eligible order (THB, if known)'),p.commission??'','number','min="0" step="0.01"')}${field('observed',T('วันที่ตรวจข้อมูล','Evidence observation date'),(p.observedAt||now()).slice(0,10),'date',`required max="${today()}"`)}${field('rating',T('คะแนนร้าน/สินค้า 0–5','Listing rating 0–5'),p.rating??'','number','min="0" max="5" step="0.1"')}${field('reviews',T('จำนวนรีวิวที่หน้าเว็บแสดง','Listed review count'),p.reviews??'','number','min="0" step="1"')}</div>${area('sourceText',T('ข้อมูล / รีวิว / เงื่อนไขที่คัดลอกมา','Pasted product information / reviews / conditions'),p.sourceText||'','maxlength="20000"')}${area('usecase',T('ปัญหาหรือสถานการณ์ที่จะเล่า *','Problem or situation to address *'),p.usecase||'','required maxlength="2000"')}<div class="formgrid">${field('imageUrl',T('URL รูป (ไม่บังคับ)','Image URL (optional)'),p.imageUrl?.startsWith('data:')?'':p.imageUrl||'','url')}${field('imageFile',T('หรืออัปโหลดรูปสินค้า ≤ 5 MB','Or upload a product image ≤ 5 MB'),'','file','accept="image/png,image/jpeg,image/webp"')}</div><small>${T('รูปใช้ประกอบ ไม่ใช้อนุมานสเปกหรือผลลัพธ์ • ไม่มี OCR อัตโนมัติ','Images are references, not proof of specifications or results. No automatic OCR.')}</small></section><section class="card"><h2>${T('02 · หลักฐานและเหตุผลรายมิติ','02 · Evidence and rationale')}</h2><p class="sub">${T('ให้ 0–5 เฉพาะมิติที่มีหลักฐาน: 0 = ไม่เหมาะ, 3 = พอทดลอง, 5 = เหมาะมาก เว้นว่างเมื่อไม่ทราบ ทุกคะแนนต้องมีหลักฐานและเหตุผล','Rate 0–5 only when evidence exists: 0 = unsuitable, 3 = testable, 5 = strong. Leave unknowns blank. Each rating needs evidence and rationale.')}</p>${dimensions().map(([title,hint],i)=>`<div class="dim"><div class="row between"><h3>${title}</h3>${badge(WEIGHTS[i]+'%')}</div><p class="sub">${hint}</p><div class="formgrid">${sel('dim'+i,T('คะแนนประเมินของคุณ','Your assessment'),[['',T('ไม่ทราบ / ไม่มีหลักฐาน','Unknown / no evidence')],...[0,1,2,3,4,5].map(n=>[n,n+' / 5'])],p.dims?.[i]?.rating??'')}${field('reason'+i,T('เหตุผลของคะแนน','Reason for rating'),p.dims?.[i]?.reason||'','text','maxlength="2000"')}</div>${area('ev'+i,T('หลักฐานที่รองรับ (ข้อความหรือผลทดลอง)','Supporting evidence (source text or test result)'),p.dims?.[i]?.evidence||'','maxlength="4000"')}${field('src'+i,T('URL ที่มา (ว่าง = บันทึกของผู้ใช้)','Source URL (blank = your own record)'),p.dims?.[i]?.source||'','url')}</div>`).join('')}</section></div><aside class="stack" style="align-content:start"><section class="card glow"><div class="eyebrow">EVIDENCE FIRST</div><h2>${T('คะแนนไม่ใช่โอกาสขายเป็น %','A score is not sales probability')}</h2><p class="muted">${T('ระบบคำนวณจากคะแนนและหลักฐานที่คุณระบุ ไม่ได้ประเมินด้วย AI','The app calculates from your ratings and evidence. This is not AI evaluation.')}</p><div class="task"><strong>60%</strong><span>${T('ขั้นต่ำก่อนแสดงคะแนนรวม','Coverage required to show a score')}</span></div><div class="task"><strong>80%</strong><span>${T('หลักฐานมากขึ้น แต่ยังต้องทดลองจริง','Higher coverage; still needs real-world testing')}</span></div><p class="sub">Rubric ${RUBRIC} · weights 20/20/15/15/10/10/10</p></section><section class="card"><h2>${T('สิ่งที่ควรแยกให้ชัด','Keep these distinctions clear')}</h2><ul class="muted"><li>${T('ราคาคนละรุ่นไม่เท่ากับราคาที่ถูกกว่า','Different variants are not a price comparison')}</li><li>${T('ยอดขายสะสมไม่ใช่ยอดขายล่าสุด','Lifetime sales are not recent demand')}</li><li>${T('ไม่ทราบคอมมิชชันให้เว้นว่าง','Leave unknown commission blank')}</li><li>${T('หลักฐานเก่าให้ตรวจใหม่ก่อนโพสต์','Refresh stale evidence before posting')}</li></ul><div class="actions"><button class="primary" type="submit">${T('บันทึกและวิเคราะห์','Save & analyze')}</button>${p.id?btn(T('ยกเลิกแก้ไข','Cancel edit'),'new-product','ghost'):''}</div></section></aside></div></form>`}
function analysisCard(p){const s=score(p),prev=p.snapshots?.at(-2),delta=prev?s.coverage-prev.coverage:null;return `<div class="row"><div class="ring" style="--v:${s.coverage}"><div><strong>${s.coverage}%</strong><small>${T('หลักฐานครบ','COVERAGE')}</small></div></div><div><div class="muted">${T('คะแนนโอกาส','Opportunity score')}</div><h1>${s.score===null?'—':s.score+' / 100'}</h1>${badge(s.coverage<60?T('เก็บข้อมูลเพิ่ม','More evidence needed'):s.coverage<80?T('คะแนนเบื้องต้น','Provisional'):T('พร้อมทดลอง','Ready to test'),s.coverage<60?'orange':'cyan')}</div></div>${delta!==null?`<p class="sub">${T('Coverage เปลี่ยนจากครั้งก่อน','Coverage change since last snapshot')}: ${delta>0?'+':''}${delta}%</p>`:''}<p class="sub">${T('ความครบถ้วน ไม่ใช่ความแม่นยำ • ประเมินได้','Coverage is not accuracy • Assessed')} ${s.count}/7 ${T('มิติ','dimensions')}</p>`}

function storyEditor(){const s=storyDraft,p=product(s.productId),flags=storyFlags(s),b=s.brief;return `<section class="card tone-violet"><div class="section-title"><div><div class="eyebrow">SHOOTING PACK</div><h2>${esc(s.name)}</h2></div>${badge(`${s.platform} · ${s.duration}s · ${s.language.toUpperCase()}`,'violet')}</div><div class="notice info mb">${T('นี่คือโครงบทจากแม่แบบ ต้องทวนคำพูด ข้ออ้าง และสิทธิ์ใช้ภาพก่อนเผยแพร่ เวลาฉากเป็นการแบ่งเวลาเป้าหมาย ไม่ใช่การจับเวลาพูดจริง','This is a template outline. Review all claims and asset rights. Scene timestamps divide your target duration; rehearse to confirm the speaking time.')}</div><div class="formgrid">${field('storyName',T('ชื่อบท','Story name'),s.name)}${field('storyHookA','Hook A',s.hookA)}${field('storyHookB','Hook B',s.hookB)}<div class="field"><label>${T('ความเหมาะกับผู้สร้าง','Creator fit')}</label><span class="badge ${b.own?'green':'orange'}">${b.own?T('มีสินค้า','Product available'):T('โหมดไม่มีสินค้า','No-product mode')}</span> ${badge(b.budget===null?T('งบไม่ระบุ','Budget unknown'):p.price!==null&&p.price>b.budget&&!b.own?T('เกินงบซื้อ','Above purchase budget'):T('ตรวจงบแล้ว','Budget entered'))}</div></div><div class="tablewrap"><table><thead><tr><th>${T('เวลา (วินาที)','Time (seconds)')}</th><th>${T('ภาพ / อุปกรณ์','Visual / props')}</th><th>${T('บทพูด','Voice')}</th><th>${T('ข้อความบนจอ / หลักฐาน','Overlay / evidence')}</th></tr></thead><tbody>${s.shots.map((x,i)=>`<tr><td>${esc(x.time)}</td><td><label for="visual${i}" class="sr-only">Visual ${i+1}</label><textarea id="visual${i}">${esc(x.visual)}</textarea><small>${esc(x.props)}</small></td><td><label for="voice${i}" class="sr-only">Voice ${i+1}</label><textarea id="voice${i}">${esc(x.voice)}</textarea></td><td><label for="overlay${i}" class="sr-only">Overlay ${i+1}</label><textarea id="overlay${i}">${esc(x.overlay)}</textarea><label for="ref${i}">${T('หลักฐาน','Evidence ID')}</label><input id="ref${i}" value="${esc(x.evidence)}"></td></tr>`).join('')}</tbody></table></div><details><summary>${T('หลักฐานที่เลือกใช้อ้างอิงได้','Available evidence references')}</summary>${p.dims.map((d,i)=>d.evidence?`<p><strong>${p.id.slice(0,6)}-E${i+1}</strong> · ${esc(d.evidence)}</p>`:'').join('')}${b.experience?`<p><strong>USER-TEST</strong> · ${esc(b.experience)}</p>`:''}<p class="sub">${T('อ้างอิงแค่มี ID ไม่ได้แปลว่าข้ออ้างถูกต้อง ต้องตรวจความตรงกันเอง','An ID alone does not validate a claim. Check that it supports the actual wording.')}</p></details><div class="grid cols2 space"><div>${area('storyCaption','Caption',s.caption)}${area('disclosure',T('ข้อความเปิดเผย Affiliate','Affiliate disclosure'),s.disclosure)}</div>${area('facebookCopy',T('โพสต์ Facebook / FAQ','Facebook post / FAQ'),s.facebook)}</div><section class="card"><h3>${T('ตรวจบทก่อนพร้อมถ่าย','Review before marking Ready')}</h3><p class="sub">${T('ตัวตรวจนี้จับได้เพียงคำเสี่ยงและช่องว่าง ไม่รับรองว่าตรวจทุกข้ออ้างครบ จึงต้องตรวจด้วยตนเอง','The checker flags risky phrases and gaps, not every factual claim. Human review is required.')}</p><div id="quality-flags">${flags.length?flags.map(f=>`<p class="notice">${esc(f)}</p>`).join(''):badge(T('ผ่านการตรวจเบื้องต้น','Basic checks passed'),'green')}</div><label class="checkrow"><input id="reviewed" type="checkbox" ${s.reviewed?'checked':''}><span>${T('ฉันตรวจทุกข้ออ้างว่าตรงกับหลักฐาน รวมทั้งข้อความที่แก้เอง และมีสิทธิ์ใช้ภาพ','I checked every claim, including my edits, against the evidence and have rights to the visuals.')}</span></label><label class="checkrow"><input id="linkChecked" type="checkbox" ${s.linkChecked?'checked':''}><span>${T('ตรวจลิงก์ รุ่น ราคา/โปร และคำเปิดเผย Affiliate แล้ว','I checked the link, variant, current price/offer and affiliate disclosure.')}</span></label><div class="actions mt">${btn(T('ตรวจอีกครั้ง','Check again'),'validate-story','cyan')}${s.evidenceVersion!==p.snapshots.at(-1)?.id?btn(T('ทวนกับหลักฐานล่าสุด','Use latest evidence for review'),'refresh-story-evidence','cyan'):''}${btn(T('บันทึกร่าง','Save draft'),'save-story','ghost')}${btn(T('บันทึกพร้อมถ่าย','Save as Ready'),'ready-story','primary')}${btn(T('คัดลอกชุดบท','Copy shoot pack'),'copy-story','ghost')}${btn(T('ส่งไปวางแผน','Open planner'),'nav','ghost','data-page="planner"')}</div><p class="sub mt">${T('การแก้ข้อความหลังตรวจจะยกเลิกการรับรองเดิม • สลับภาษา UI ไม่เปลี่ยนภาษาบท','Editing the story resets review. Switching UI language never rewrites your story.')}</p></section>${s.revisions.length?`<details><summary>${T('ประวัติบท','Revision history')} · ${s.revisions.length}</summary>${s.revisions.slice().reverse().map((r,i)=>`<div class="task"><span class="grow">v${s.revisions.length-i} · ${date(r.at)}</span>${btn(T('ดูข้อความ','View text'),'view-revision','small',`data-id="${esc(r.id)}"`)}</div>`).join('')}</details>`:''}</section>`}
function syncStory(){if(!storyDraft||!$('#storyName'))return;const s=storyDraft;Object.assign(s,{name:$('#storyName').value,hookA:$('#storyHookA').value,hookB:$('#storyHookB').value,caption:$('#storyCaption').value,disclosure:$('#disclosure').value,facebook:$('#facebookCopy').value,reviewed:$('#reviewed').checked,linkChecked:$('#linkChecked').checked});s.shots.forEach((x,i)=>{x.visual=$('#visual'+i).value;x.voice=$('#voice'+i).value;x.overlay=$('#overlay'+i).value;x.evidence=$('#ref'+i).value.trim()});s.shots[0].voice=s.hookA;}
function storyFlags(s){const p=product(s.productId),f=[],text=[s.hookA,s.hookB,s.caption,s.facebook,s.disclosure,...s.shots.map(x=>x.voice+' '+x.overlay)].join('\n');if(!s.brief.audience)f.push(T('ระบุกลุ่มคนดู','Specify an audience.'));if(/\[.+?\]/.test(text))f.push(T('ยังมีช่อง [ข้อความ] ที่ต้องเติม','Resolve the [placeholder] text.'));if(!s.disclosure.trim())f.push(T('เพิ่มข้อความ Affiliate','Add an affiliate disclosure.'));if(/การันตี|รับประกันผล|ดีที่สุด|ปลอดภัย100|หายขาด|guaranteed|cures?|best in the world|100% safe/i.test(text))f.push(T('มีคำรับรองผลหรือคำกล่าวเกินหลักฐาน ให้ปรับเป็นข้อความที่พิสูจน์ได้','Remove guarantees or absolute claims.'));if((!s.brief.own||!s.brief.experience)&&/ใช้มาแล้ว|ลองแล้ว|ทดสอบแล้ว|ใช้.{0,5}7 วัน|I tested|I used|I tried/i.test(text))f.push(T('มีประสบการณ์ใช้จริงที่ยังไม่มีบันทึกรองรับ','First-hand experience is not backed by test notes.'));const valid=new Set(p.dims.flatMap((d,i)=>d.evidence?[p.id.slice(0,6)+'-E'+(i+1)]:[]));if(s.brief.own&&s.brief.experience)valid.add('USER-TEST');s.shots.forEach((x,i)=>{if(x.evidence&&!valid.has(x.evidence))f.push(T('หลักฐานไม่พบในฉาก ','Unknown evidence in scene ')+(i+1))});if(!s.shots.some(x=>valid.has(x.evidence)))f.push(T('ต้องมีอย่างน้อยหนึ่งฉากที่อ้างหลักฐาน','At least one scene must reference evidence.'));if(s.evidenceVersion!==p.snapshots.at(-1)?.id)f.push(T('ข้อมูลสินค้าเปลี่ยนแล้ว สร้างบทใหม่หรือทวนกับ snapshot ล่าสุด','Product evidence changed. Regenerate and review against the latest snapshot.'));if(stale(p)&&/ราคา|price|฿|บาท|THB/.test(text))f.push(T('ข้อมูลราคาเก่า กลับไปตรวจวันที่หลักฐานก่อนพร้อมถ่าย','Price evidence is stale. Refresh the product observation date first.'));if(state.stories.some(x=>x.id!==s.id&&x.productId===s.productId&&x.hookA===s.hookA))f.push(T('Hook ซ้ำกับบทที่บันทึกแล้ว ให้เปลี่ยนมุมหรือระบุการทดลองในบทเดิม','This hook matches another story. Revise it or use the existing story.'));if(s.brief.avoid&&s.brief.avoid.split(/[,\n]/).some(w=>w.trim()&&text.toLowerCase().includes(w.trim().toLowerCase())))f.push(T('มีข้อความที่อยู่ในรายการไม่อยากพูด','The script contains words you asked to avoid.'));return [...new Set(f)];}
function storyText(s){return `${s.name}\n${s.platform} · ${s.duration}s · ${s.language}\nHook A: ${s.hookA}\nHook B: ${s.hookB}\n\n`+s.shots.map(x=>`${x.time}s\nVisual: ${x.visual}\nVoice: ${x.voice}\nOverlay: ${x.overlay}\nEvidence: ${x.evidence||'—'}\nProps: ${x.props}`).join('\n\n')+`\n\nCaption\n${s.caption}\n${s.disclosure}\n\nFacebook\n${s.facebook}`;}
async function saveStory(ready){syncStory();const s=storyDraft;if(!s)throw Error(T('เลือกมุมเรื่องก่อน','Choose an angle first.'));const flags=storyFlags(s);if(ready&&(flags.length||!s.reviewed||!s.linkChecked))throw Error(flags[0]||T('ตรวจรายการและยืนยันทั้งสองข้อก่อน','Complete both review checkboxes.'));s.ready=ready;s.revisions.push({id:uid(),at:now(),text:storyText(s),ready,shots:structuredClone(s.shots)});const i=state.stories.findIndex(x=>x.id===s.id);if(i<0)state.stories.push(structuredClone(s));else state.stories[i]=structuredClone(s);state.plans.forEach(plan=>plan.tasks.filter(t=>t.storyId===s.id&&t.status!=='done').forEach(t=>{t.previousRevision=t.revision;t.revision=s.revisions.at(-1).id}));await persist();clearDraft('studio');render();toast(ready?T('บันทึกบทพร้อมถ่ายแล้ว','Ready story saved.'):T('บันทึกร่างและเวอร์ชันแล้ว','Draft and revision saved.'));}
const jobNames=()=>({research:T('ตรวจหลักฐานและข้ออ้าง','Check evidence & claims'),script:T('ทวนและซ้อมบท','Review & rehearse'),shoot:T('ถ่ายหรือเตรียมภาพ','Film or prepare visuals'),edit:T('ตัดต่อและใส่ข้อความ','Edit & add captions'),check:T('ตรวจลิงก์ รุ่น ราคา','Check link, variant & price'),publish:T('โพสต์ด้วยตนเอง','Publish manually'),measure:T('บันทึกผลเมื่อครบ 72 ชม.','Record results at 72 hours')});
function schedule(stories,cfg,reserved={}){const capacity=Math.floor(cfg.minutes*(1-cfg.reserve/100)),days=Array.from({length:cfg.days},(_,i)=>dayPlus(cfg.start,i)),usage={},tasks=[],deferred=[];days.forEach(d=>usage[d]=reserved[d]||0);let cursor=cfg.start;stories.slice(0,cfg.max).forEach(s=>{let dep=null,lastPublish=null;const jobs=[['research',15],['script',20],['shoot',s.brief.minutes||30],['edit',30],['check',10],['publish',5],['measure',10]];let blocked=false;for(const [type,effort]of jobs){if(blocked){deferred.push({storyId:s.id,type,effort});continue}let remaining=effort,parts=[];let earliest=cursor;if(type==='shoot'&&s.brief.own&&cfg.arrival>earliest)earliest=cfg.arrival;if(type==='measure'&&lastPublish)earliest=dayPlus(lastPublish,3);for(const d of days){if(d<earliest||cfg.off.includes(d)||!cfg.weekdays.includes(new Date(d+'T12:00:00+07:00').getUTCDay()))continue;let free=capacity-usage[d];if(free<=0)continue;const n=Math.min(remaining,free);const task={id:uid(),storyId:s.id,productId:s.productId,revision:s.revisions.at(-1)?.id||null,type,effort:n,totalEffort:effort,date:d,time:(()=>{const [h,m]=cfg.time.split(':').map(Number),t=h*60+m+usage[d]+n;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')})(),status:'todo',dependency:dep,part:parts.length+1,platform:s.platform};tasks.push(task);parts.push(task);usage[d]+=n;remaining-=n;dep=task.id;cursor=d;if(!remaining){if(type==='publish')lastPublish=d;break}}
if(remaining){deferred.push({storyId:s.id,type,effort:remaining});blocked=true}}
});return {id:uid(),createdAt:now(),config:cfg,capacity,tasks,deferred,usage};}
function plannerView(){return head('ADAPTIVE PLANNER',T('แผนที่พอดีกับเวลาของคุณ','A plan that fits your time'),T('เหลือเวลาสำรอง และทำงานตามลำดับก่อน–หลัง','Keep a buffer and follow the dependencies.'))+`<div class="grid mainaside"><section class="card"><h2>${T('สร้างแผนใหม่','Build a production plan')}</h2><form id="plan-form" class="mt"><div class="formgrid">${field('planStart',T('วันเริ่ม','Start date'),today(),'date','required')}${sel('planDays',T('ระยะเวลา','Horizon'),[[7,T('7 วัน','7 days')],[14,T('14 วัน','14 days')],[30,T('30 วัน','30 days')]],7)}${field('dailyMinutes',T('เวลาว่างต่อวัน (นาที)','Available minutes per day'),60,'number','required min="5" max="600" step="1"')}${field('reserve',T('เวลาสำรอง (%)','Buffer (%)'),state.settings.reserve,'number','required min="20" max="80" step="1"')}${field('maxPosts',T('จำนวนคลิปสูงสุด','Maximum clips'),3,'number','required min="1" max="30" step="1"')}${field('planTime',T('เวลานัดหมาย / ทดลองโพสต์ (ไทย)','Scheduled time / trial posting time (Bangkok)'),'19:00','time','required')}${field('arrival',T('สินค้าในมือพร้อมใช้วันที่','Physical product available from'),today(),'date','required')}${field('daysOff',T('วันหยุด YYYY-MM-DD คั่นด้วยจุลภาค','Days off: YYYY-MM-DD, comma-separated'),'')}</div><label>${T('วันที่สะดวก','Available weekdays')}</label><div class="row mb">${[T('อา','Sun'),T('จ','Mon'),T('อ','Tue'),T('พ','Wed'),T('พฤ','Thu'),T('ศ','Fri'),T('ส','Sat')].map((n,i)=>`<label class="check"><input type="checkbox" class="weekday" value="${i}" checked>${n}</label>`).join('')}</div><label>${T('เลือกบทที่จะทำ (ลำดับตามรายการ)','Choose stories (processed in this order)')}</label><div class="listcheck mb">${state.stories.length?state.stories.map(s=>`<label class="check"><input class="plan-story" type="checkbox" value="${s.id}" ${s.ready?'checked':''}>${esc(s.name)} ${badge(s.ready?T('พร้อม','Ready'):T('ร่าง','Draft'),s.ready?'green':'orange')}</label>`).join(''):`<p class="sub">${T('บันทึกบทใน Story Studio ก่อนสร้างแผน','Save a story in Story Studio first.')}</p>`}</div><button class="primary" type="submit" ${!state.stories.length?'disabled':''}>${T('คำนวณแผนตามกำลัง','Build a capacity plan')}</button></form></section><aside class="stack" style="align-content:start"><section class="card glow"><h2>${T('เวลาที่เหลือ คือพื้นที่ให้ทำได้จริง','Leave room for real life')}</h2><p class="muted">${T('แบ่งงานใหญ่ข้ามวันได้ ไม่จองเกิน 80% ของเวลาว่าง งานที่ไม่ทันจะอยู่ในรายการเลื่อน','Large tasks can span days. At most 80% of your time is booked. Unfinished work is explicitly deferred.')}</p><div class="notice info">${T('เวลาโพสต์คือช่วงทดลองตามเวลาที่คุณสะดวก ไม่ใช่เวลาที่ดีที่สุดจากข้อมูลตลาด','Posting times are trial slots based on your availability, not market-proven best times.')}</div><p class="sub">${T('แผนใหม่ไม่ย้ายงานเก่าอัตโนมัติ • โปรดหลีกเลี่ยงการเลือกบทซ้ำในแผนที่ยังทำอยู่','New plans never move existing work. Avoid duplicating stories in active plans.')}</p></section></aside></div><section class="space"><div class="section-title"><h2>${T('แผนที่บันทึก','Saved plans')}</h2><div class="actions">${[['list',T('รายการ','List')],['calendar',T('ปฏิทิน','Calendar')],['board',T('กระดาน','Board')]].map(([v,l])=>btn(l,'plan-view',v===planView?'cyan small':'small',`data-view="${v}"`)).join('')}</div></div>${state.plans.slice().reverse().map(plan=>planRender(plan)).join('')||`<div class="empty"><h3>${T('ยังไม่มีแผนงาน','No plans yet')}</h3></div>`}</section>`}
function taskCard(t,plan){const name=jobNames()[t.type],s=state.stories.find(s=>s.id===t.storyId),blocked=t.dependency&&!plan.tasks.find(x=>x.id===t.dependency)?.status.includes('done');return `<div class="task"><div class="grow"><strong>${name}${t.totalEffort>t.effort?' · '+T('ส่วน ','part ')+t.part:''}</strong><p class="sub">${esc(s?.name||'—')} · ${esc(t.platform)}</p><small>${date(t.date)} ${esc(t.time)} · ${num(t.effort)} ${T('นาที','min')} · ${t.dependency?T('มีงานก่อนหน้า','Has prerequisite'):T('เริ่มได้','Can start')}</small></div>${badge(t.status==='done'?T('เสร็จ','Done'):blocked?T('รองานก่อนหน้า','Waiting'):T('พร้อมเริ่ม','To do'),t.status==='done'?'green':'')} ${t.status!=='done'?btn(T('เสร็จ','Done'),'complete-task','small',`data-id="${esc(t.id)}" data-plan="${plan.id}"`):''}</div>`}
function planRender(p){const done=p.tasks.filter(x=>x.status==='done').length;let content='';if(planView==='list')content=p.tasks.map(t=>taskCard(t,p)).join('');if(planView==='calendar')content=`<div class="calendar">${Object.entries(p.usage).map(([d,used])=>`<div class="day"><strong>${date(d)}</strong><small style="display:block">${num(used)}/${num(p.capacity)} ${T('นาที','min')}</small>${p.tasks.filter(t=>t.date===d).map(t=>`<div class="job">${t.status==='done'?'✓ ':''}${jobNames()[t.type]} · ${num(t.effort)}m</div>`).join('')}</div>`).join('')}</div>`;if(planView==='board')content=`<div class="board">${['todo','waiting','done'].map(v=>`<div><h3>${v==='done'?T('เสร็จแล้ว','Done'):v==='waiting'?T('รองานก่อนหน้า','Waiting'):T('พร้อมเริ่ม','To do')}</h3>${p.tasks.filter(t=>{const blocked=t.dependency&&p.tasks.find(x=>x.id===t.dependency)?.status!=='done';return v==='done'?t.status==='done':t.status!=='done'&&(v==='waiting'?blocked:!blocked)}).map(t=>taskCard(t,p)).join('')}</div>`).join('')}</div>`;return `<div class="card mb"><div class="section-title"><h3>${date(p.config.start)} · ${num(p.config.days)} ${T('วัน','days')}</h3>${badge(`${done}/${p.tasks.length} `+T('งาน','tasks'),'cyan')}</div>${content}${p.deferred.length?`<div class="notice mt"><strong>${T('เกินช่วงแผน ต้องเลื่อนงาน','Deferred beyond this plan')}</strong><ul>${p.deferred.map(x=>`<li>${esc(state.stories.find(s=>s.id===x.storyId)?.name||'')} · ${jobNames()[x.type]} · ${x.effort} ${T('นาที','min')}</li>`).join('')}</ul></div>`:''}</div>`}
function resultMetricsForm(){return `<form id="metric-form"><div class="formgrid">${sel('metricPost',T('โพสต์','Post'),state.posts.map(p=>[p.id,p.name]))}${sel('metricWindow',T('อายุโพสต์ที่วัด','Post-age window'),[['24h','24h'],['72h','72h'],['7d','7d']],filter.window)}${field('metricDate',T('วันเวลาที่สังเกต (ไทย)','Observed time (Bangkok)'),today()+'T19:00','datetime-local','required')}${sel('attribution',T('เชื่อมยอดกับโพสต์','Attribution'),[['unknown',T('ไม่ทราบ / ยอดรวมสินค้า','Unknown / product totals')],['post',T('มีแหล่งยืนยันระดับโพสต์','Confirmed post-level source')]],'unknown')}${field('metricSource',T('แหล่งข้อมูล / ชื่อรายงาน *','Source / report name *'),'','text','required')}<div class="notice">${T('บันทึกยอดสะสม ณ อายุโพสต์ที่เลือก ระบบใช้ snapshot ล่าสุด ไม่บวก snapshot ซ้ำ ค่าที่ไม่ทราบให้เว้นว่าง','Enter cumulative totals at the selected post age. Only the latest snapshot is counted. Leave unknown values blank.')}</div>${['views','clicks','orders','cancelled','sales','estimated','confirmed','cost','retention'].map(k=>field('m-'+k,metricLabel(k),'','number',`min="0" ${k==='retention'?'max="100"':''} step="${['views','clicks','orders','cancelled'].includes(k)?'1':'0.01'}"`)).join('')}</div><button class="primary" type="submit">${T('บันทึก snapshot','Save snapshot')}</button></form>`}
function metricLabel(k){return ({views:T('ยอดชม','Views'),clicks:T('คลิก','Clicks'),orders:T('ออเดอร์','Orders'),cancelled:T('ออเดอร์ยกเลิก','Cancelled orders'),sales:T('ยอดขาย (บาท)','Sales (THB)'),estimated:T('คอมมิชชันประมาณการ (บาท)','Estimated commission (THB)'),confirmed:T('คอมมิชชันยืนยัน (บาท)','Confirmed commission (THB)'),cost:T('ต้นทุนที่บันทึก (บาท)','Recorded costs (THB)'),retention:T('Retention ช่วงต้น (%) ถ้ามี','Early retention (%) if known')})[k]}
function resultsView(){const rows=latestRows(),a=attributed(rows),click=paired(rows,'clicks','views',100),conv=paired(a,'orders','clicks',100),epc=paired(a,'confirmed','clicks');return head('RESULTS & LEARNING',T('วัดผล แล้วค่อยขยับ','Measure, then make your next move'),T('ยอดยืนยันแยกจากประมาณการ • สกุลเงิน THB • snapshot สะสม','Confirmed and estimated totals stay separate • THB • Cumulative snapshots'))+`<div class="filterbar"><div class="field"><label for="resultWindow">${T('อายุโพสต์เดียวกัน','Same post age')}</label><select id="resultWindow">${['24h','72h','7d'].map(w=>`<option ${filter.window===w?'selected':''}>${w}</option>`).join('')}</select></div><div class="field"><label for="resultPlatform">${T('ช่องทาง','Platform')}</label><select id="resultPlatform">${[['all',T('ทุกช่องทาง','All platforms')],['TikTok','TikTok'],['Facebook','Facebook']].map(([v,l])=>`<option value="${v}" ${filter.platform===v?'selected':''}>${l}</option>`).join('')}</select></div><p class="sub">${rows.length} ${T('โพสต์มีข้อมูลในช่วงนี้','posts with data in this window')}</p></div><div class="grid cols4 mb">${kpi(T('ยอดชม','Views'),num(total(rows,'views')),T('ไม่รวมค่าที่หาย','Missing values excluded'))}${kpi('Click-to-view',click===null?'N/A':num(click)+'%',T('รวมเฉพาะคู่ข้อมูลครบ','Only complete numerator/denominator pairs'),'cyantext')}${kpi(T('คอมมิชชันยืนยัน','Confirmed'),money(total(a,'confirmed')),T('ระบุโพสต์ได้เท่านั้น','Post-attributed only'))}${kpi(T('ประมาณการ','Estimated'),money(total(a,'estimated')),T('ยังไม่ใช่รายได้ยืนยัน','Not confirmed earnings'))}</div><div class="grid cols3 mb"><div class="card"><h3>Orders per click</h3><p>${conv===null?'N/A':num(conv)+'%'}</p><small>${T('อัตราส่วน ไม่จำเป็นต้องเป็น unique conversion','A ratio, not necessarily unique conversions')}</small></div><div class="card"><h3>EPC</h3><p>${epc===null?'N/A':money(epc)}</p><small>${T('คอมมิชชันยืนยัน / คลิกที่ระบุโพสต์ได้','Confirmed commission / attributed clicks')}</small></div><div class="card"><h3>${T('ไม่ทราบที่มา','Unknown attribution')}</h3><p>${rows.length-a.length} ${T('โพสต์','posts')}</p><small>${T('ไม่ใช้ยอดเหล่านี้ตัดสินใจขยายผล','Excluded from scale decisions')}</small></div></div><div class="grid cols2"><section class="card"><h2>${T('ลงทะเบียนโพสต์ที่เผยแพร่','Register a published post')}</h2><form id="post-form" class="mt">${sel('postStory',T('เลือกบท','Story'),state.stories.map(s=>[s.id,s.name]))}${field('postName',T('ชื่อโพสต์ *','Post title *'),'','text','required maxlength="200"')}${field('postUrl',T('URL โพสต์ *','Post URL *'),'','url','required')}${field('publishedAt',T('วันเวลาเผยแพร่ (ไทย)','Published time (Bangkok)'),today()+'T12:00','datetime-local','required')}${sel('postVariant','Hook',[['A','Hook A'],['B','Hook B']],'A')}<button type="submit" class="primary" ${!state.stories.length?'disabled':''}>${T('บันทึกโพสต์','Save post')}</button>${!state.stories.length?`<p class="sub">${T('บันทึกบทก่อนเพิ่มโพสต์','Save a story before registering a post.')}</p>`:''}</form></section><section class="card"><h2>${T('บันทึกผลสะสม','Record cumulative results')}</h2><div class="mt">${state.posts.length?resultMetricsForm():`<p class="muted">${T('เพิ่มโพสต์ด้านซ้ายก่อนบันทึกยอด','Register a post before adding metrics.')}</p>`}</div></section></div><section class="card space"><h2>${T('โพสต์และคำแนะนำ','Posts & next experiments')}</h2>${state.posts.length?state.posts.map(p=>{const m=rows.find(r=>r.post.id===p.id);return `<div class="task"><div class="grow"><h3>${esc(p.name)}</h3><p class="sub">${p.platform} · ${date(p.publishedAt)} · Hook ${p.variant} · ${p.metrics.length} snapshots</p><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${T('เปิดโพสต์','Open post')} ↗</a><p>${recommend(p,m)}</p>${m?`<div class="row">${badge(T('ชม ','Views ')+num(m.views))}${badge(T('คลิก ','Clicks ')+num(m.clicks))}${badge(T('ออเดอร์ ','Orders ')+num(m.orders))}${badge(m.attribution==='post'?T('ระบุโพสต์ได้','Post-attributed'):T('ไม่ทราบที่มา','Unknown attribution'),m.attribution==='post'?'green':'orange')}</div>`:''}</div></div>`}).join(''):`<p class="muted">${T('ยังไม่มีโพสต์','No published posts yet.')}</p>`}<div class="actions mt">${btn(T('ส่งออกผล CSV','Export results CSV'),'export-csv','ghost')}</div></section>${rows.length?`<section class="card space"><h2>${T('คอมมิชชันยืนยันต่อโพสต์','Confirmed commission by post')}</h2><p class="sub">${T('เฉพาะยอดที่ระบุโพสต์ได้ในช่วงที่เลือก','Post-attributed observations in the selected window')}</p><div class="plot">${a.filter(r=>r.confirmed!==null).slice(-8).map((r,i)=>`<div class="plotcol"><small>${money(r.confirmed)}</small><div class="plotbar" style="height:${Math.max(2,r.confirmed/Math.max(1,...a.map(x=>x.confirmed||0))*110)}px"></div><small>${esc(r.post.name.slice(0,12))}</small></div>`).join('')}</div></section>`:''}`}
function recommend(p,m){if(!m)return T('ยังไม่มีข้อมูลในช่วงที่เลือก เก็บผลที่อายุโพสต์เท่ากันก่อน','No observation in this window. Measure posts at the same age.');const cfg=state.settings;const evidence=`[${m.id.slice(0,8)}]`;if(m.attribution!=='post')return T('ยังสรุปเรื่องยอดขายต่อโพสต์ไม่ได้ ตรวจแหล่ง attribution ก่อน','Post-level sales cannot be inferred. Check attribution first.')+' '+evidence;if(m.views===null||m.clicks===null||m.views<cfg.minViews||m.clicks<cfg.minClicks)return T('ข้อมูลยังน้อยตามเกณฑ์ที่ตั้งไว้ เก็บเพิ่มก่อนตัดสิน อย่ารีบสรุปว่า Hook ผิด','Below your sample thresholds. Collect more evidence; do not assume the hook caused it.')+' '+evidence;const ctr=ratio(m.clicks,m.views,100),opc=ratio(m.orders,m.clicks,100),cpm=ratio(m.confirmed,m.views,1000);if(ctr<cfg.clickTarget)return T('ทดลองปรับ CTA หรือความตรงกลุ่มเป้าหมาย และตรวจ tracking เพราะคลิกต่อยอดชมต่ำกว่าเกณฑ์','Try a clearer CTA or audience framing; also check tracking. Click-to-view is below your target.')+' '+evidence;if(opc!==null&&opc<cfg.orderTarget)return T('ตรวจรุ่น สต๊อก ราคา ค่าส่ง และความล่าช้าของ attribution ก่อนเปลี่ยนบท','Check variant, stock, price, shipping and attribution delays before rewriting.')+' '+evidence;const cohort=attributed(latestRows(m.window,p.platform)).filter(x=>x.post.productId===p.productId&&x.post.productVariant===p.productVariant&&x.orders!==null&&x.confirmed!==null&&x.views>=cfg.minViews&&x.clicks>=cfg.minClicks&&ratio(x.clicks,x.views,100)>=cfg.clickTarget&&ratio(x.orders,x.clicks,100)>=cfg.orderTarget&&ratio(x.confirmed,x.views,1000)>=cfg.commissionTarget);if(opc!==null&&cpm!==null&&cohort.length>=3&&score(product(p.productId)).coverage>=80)return T('มีผลดีซ้ำอย่างน้อย 3 โพสต์ใน cohort เดียวกัน ลองเพิ่มหนึ่งมุมภายในกำลังผลิต ผลนี้ยังเป็นเชิงสังเกต','At least 3 comparable posts meet your targets. Try one additional angle within capacity. This remains observational.')+' '+evidence;return T('มีสัญญาณพอทดลองต่อ ยังไม่พอขยายผล เก็บอย่างน้อย 3 โพสต์ที่ช่องทางและอายุวัดเท่ากัน','Promising enough to test again, not enough to scale. Gather at least 3 posts on the same platform at the same age.')+' '+evidence;}
function labView(){return head('EXPERIMENT LAB',T('เปลี่ยนทีละอย่าง เรียนรู้ให้ชัด','Change one thing. Learn clearly.'),T('การเทียบโพสต์ Organic เป็นข้อมูลเชิงสังเกต ไม่ใช่การทดลองสุ่ม','Organic comparisons are observational, not randomized trials.'))+`<div class="grid cols2"><section class="card tone-violet"><h2>${T('ตั้งการทดลอง A/B','Define an A/B experiment')}</h2><form id="experiment-form" class="mt">${field('expName',T('ชื่อและสมมติฐาน *','Name and hypothesis *'),'','text','required maxlength="400"')}${sel('expA',T('โพสต์ A','Post A'),state.posts.map(p=>[p.id,p.name]))}${sel('expB',T('โพสต์ B','Post B'),state.posts.map(p=>[p.id,p.name]))}${sel('expVariable',T('ตัวแปรหลักหนึ่งอย่าง','One main variable'),[['hook','Hook'],['cta','CTA'],['angle',T('มุมเรื่อง','Angle')]])}${sel('expMetric',T('ตัวชี้วัดหลัก','Primary metric'),[['click','Click-to-view'],['order','Orders per click'],['commission',T('คอมมิชชัน/1,000 views','Commission/1,000 views')]])}${sel('expWindow',T('ช่วงวัดที่กำหนด','Planned measurement window'),[['24h','24h'],['72h','72h'],['7d','7d']],'72h')}<label class="checkrow"><input id="expPre" type="checkbox"><span>${T('กำหนดสมมติฐานไว้ก่อนเห็นผล (หากไม่ได้ทำ จะติดป้ายย้อนหลัง)','Hypothesis was defined before seeing results (otherwise marked retrospective)')}</span></label><button class="primary mt" ${state.posts.length<2?'disabled':''}>${T('บันทึกการทดลอง','Save experiment')}</button></form></section><section class="card"><h2>${T('สถานการณ์สมมติ','Forecast sandbox')}</h2><p class="sub">${T('ใส่สมมติฐานของคุณเองทุกค่า ไม่มี benchmark เติมให้ และไม่รวมในรายได้จริง','Supply your own assumptions. No benchmarks are filled in; results are not real earnings.')}</p><form id="forecast-form"><div class="formgrid">${field('fViews',T('ยอดชมสมมติ','Assumed views'),'','number','required min="0"')}${field('fClick',T('Click-to-view (%)','Click-to-view (%)'),'','number','required min="0" max="100" step="0.01"')}${field('fOrder',T('Orders per click (%)','Orders per click (%)'),'','number','required min="0" step="0.01"')}${sel('fMode',T('วิธีคิดคอมมิชชัน','Commission model'),[['rate',T('อัตรา %','Percentage rate')],['fixed',T('ยอดต่อออเดอร์','Fixed per order')]])}${field('fValue',T('มูลค่าที่มีสิทธิ์คิด / ยอดคอมต่อออเดอร์ (บาท)','Eligible order value / fixed payout (THB)'),'','number','required min="0" step="0.01"')}${field('fRate',T('อัตราคอม % (ใส่ 0 เมื่อใช้ยอดคงที่)','Commission % (0 for fixed payout)'),'','number','required min="0" max="100" step="0.01"')}${field('fApproval',T('สัดส่วนผ่านการยืนยัน (%)','Approval fraction (%)'),'','number','required min="0" max="100" step="0.01"')}${field('fSource',T('ที่มาของสมมติฐานทุกค่า *','Source of these assumptions *'),'','text','required')}</div><button type="submit" class="cyan">${T('คำนวณสถานการณ์','Calculate scenario')}</button></form><div id="forecast-result" class="mt"></div></section></div><div class="stack space">${state.experiments.map(e=>experimentCard(e)).join('')}</div>`}
function experimentCard(e){const posts=[state.posts.find(p=>p.id===e.a),state.posts.find(p=>p.id===e.b)],ms=posts.map(p=>p.metrics.filter(m=>m.window===e.window).sort((a,b)=>a.observedAt.localeCompare(b.observedAt)).at(-1));const compatible=posts[0].platform===posts[1].platform&&posts[0].productId===posts[1].productId&&posts[0].productVariant===posts[1].productVariant;const value=m=>!m?null:e.metric==='click'?ratio(m.clicks,m.views,100):m.attribution!=='post'?null:e.metric==='order'?ratio(m.orders,m.clicks,100):ratio(m.confirmed,m.views,1000);const vs=ms.map(value);let result=T('ยังสรุปไม่ได้','Inconclusive');const enough=compatible&&ms.every(m=>m&&m.views>=state.settings.minViews&&m.clicks>=state.settings.minClicks)&&vs.every(v=>v!==null);if(enough){const rel=Math.abs(vs[0]-vs[1])/Math.max(vs[0],vs[1],.0001);result=rel<.1?T('ผลใกล้เคียงในโพสต์คู่นี้','Similar in this pair'):T('โพสต์ ','Post ')+(vs[0]>vs[1]?'A':'B')+T(' มีค่ามากกว่าในคู่นี้ ยังไม่ใช่ผู้ชนะ',' has a higher observed value; not a proven winner')}return `<section class="card"><div class="row between"><h2>${esc(e.name)}</h2>${badge(e.pre?T('กำหนดล่วงหน้าตามที่ผู้ใช้ระบุ','User-reported prior hypothesis'):T('วิเคราะห์ย้อนหลัง','Retrospective'),e.pre?'cyan':'orange')}</div><p>${esc(result)}</p><div class="grid cols2">${posts.map((p,i)=>`<div class="data-note"><strong>${i?'B':'A'} · ${esc(p.name)}</strong><p>${vs[i]===null?'N/A':num(vs[i])+(e.metric==='commission'?' THB':'%')} · ${e.window}</p></div>`).join('')}</div><p class="sub">${T('ตัวแปร','Variable')}: ${esc(e.variable)} · n=1 ${T('โพสต์ต่อแบบ เวลาและคนดูอาจต่างกัน ไม่มีการทดสอบนัยสำคัญทางสถิติ','post per variant. Audience and timing may differ. No significance test.')}</p>${!compatible?`<p class="notice">${T('สินค้า/ช่องทางต่างกัน ไม่เปรียบเทียบเป็นการทดลองเดียว','Different product or platform: comparison is not treated as a single experiment.')}</p>`:''}</section>`}

function validateImport(root){const bad=()=>{throw Error(T('ไฟล์ไม่ตรงรูปแบบหรือมีข้อมูล/ความสัมพันธ์ไม่ถูกต้อง','Invalid backup structure, values or record relationships.'))};if(!root||root.app!=='Affiliate Intelligence Studio'||!['real','demo'].includes(root.mode))bad();const x=root.data;if(!x||x.schemaVersion!==2)bad();const arrays=['products','stories','plans','posts','experiments'];for(const k of arrays)if(!Array.isArray(x[k])||x[k].length>5000)bad();const isString=(v,max=30000)=>typeof v==='string'&&v.length<=max;const finite=(v,min=0,max=1e12)=>v===null||typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;const str=(v,max)=>{if(!isString(v,max))bad()};const n=(v,min,max)=>{if(!finite(v,min,max))bad()};const iso=v=>{if(!isString(v)||!Number.isFinite(Date.parse(v)))bad()};const ids=new Set();for(const k of arrays)for(const obj of x[k]){if(!obj||!isString(obj.id,100)||!/^[\w-]+$/.test(obj.id)||ids.has(obj.id))bad();ids.add(obj.id)}for(const p of x.products){['title','variant','shop','affiliate','canonical','sourceText','usecase','imageUrl','status'].forEach(k=>str(p[k],k==='imageUrl'?7500000:30000));if(!shopee(p.affiliate)||p.canonical&&!shopee(p.canonical)||p.imageUrl&&!safeImage(p.imageUrl))bad();['price','commission','rating','reviews'].forEach(k=>n(p[k]));if(p.rating!==null&&p.rating>5)bad();iso(p.observedAt);if(!Array.isArray(p.dims)||p.dims.length!==7||!Array.isArray(p.snapshots))bad();for(const d of p.dims){n(d.rating,0,5);['reason','evidence','source'].forEach(k=>str(d[k]));if(d.source&&!safeUrl(d.source)||d.rating!==null&&(!d.reason.trim()||!d.evidence.trim()))bad()}for(const z of p.snapshots){str(z.id);iso(z.createdAt);n(z.coverage,0,100);n(z.score,0,100)}}const pids=new Set(x.products.map(p=>p.id)),sids=new Set(x.stories.map(s=>s.id)),posts=new Set(x.posts.map(p=>p.id));for(const s of x.stories){if(!pids.has(s.productId)||!['th','en'].includes(s.language)||!['TikTok','Facebook'].includes(s.platform)||![15,30,60].includes(s.duration)||!Array.isArray(s.shots)||s.shots.length!==5||!Array.isArray(s.revisions)||!s.brief)bad();['name','hookA','hookB','caption','disclosure','facebook'].forEach(k=>str(s[k]));for(const shot of s.shots)['time','visual','voice','overlay','evidence','props'].forEach(k=>str(shot[k]));for(const r of s.revisions){str(r.id);if(!/^[\w-]+$/.test(r.id))bad();str(r.text,100000);iso(r.at)}if(typeof s.ready!=='boolean'||typeof s.brief.own!=='boolean'||typeof s.brief.face!=='boolean')bad();['audience','experience','avoid','equipment','goal','tone'].forEach(k=>str(s.brief[k]));n(s.brief.minutes,10,480);n(s.brief.budget)}for(const p of x.posts){if(!pids.has(p.productId)||!sids.has(p.storyId)||!['TikTok','Facebook'].includes(p.platform)||!['A','B'].includes(p.variant)||!Array.isArray(p.metrics))bad();str(p.name);str(p.productVariant);str(p.productTitle);if(!safeUrl(p.url))bad();iso(p.publishedAt);const mids=new Set();for(const m of p.metrics){str(m.id,100);if(mids.has(m.id))bad();mids.add(m.id);if(!['24h','72h','7d'].includes(m.window)||!['post','unknown'].includes(m.attribution))bad();iso(m.observedAt);str(m.source);['views','clicks','orders','cancelled','sales','estimated','confirmed','cost','retention'].forEach(k=>n(m[k]));if(m.retention!==null&&m.retention>100)bad()}}for(const p of x.plans){if(!p.config||!Array.isArray(p.tasks)||!Array.isArray(p.deferred)||!p.usage||typeof p.usage!=='object')bad();iso(p.config.start);n(p.capacity,1,600);if(![7,14,30].includes(p.config.days))bad();const tids=new Set(p.tasks.map(t=>t.id));for(const t of p.tasks){if(!sids.has(t.storyId)||!pids.has(t.productId)||!['research','script','shoot','edit','check','publish','measure'].includes(t.type)||!['todo','done'].includes(t.status)||t.dependency&&!tids.has(t.dependency))bad();if(!['TikTok','Facebook'].includes(t.platform))bad();str(t.id,100);if(!/^[\w-]+$/.test(t.id))bad();iso(t.date);str(t.time);if(!/^\d{2}:\d{2}$/.test(t.time))bad();n(t.effort,1,600);n(t.totalEffort,1,600)}for(const d of p.deferred){if(!sids.has(d.storyId)||!Object.keys(jobNames()).includes(d.type))bad();n(d.effort,1,600)}}for(const e of x.experiments){if(!posts.has(e.a)||!posts.has(e.b)||e.a===e.b||!['click','order','commission'].includes(e.metric)||!['24h','72h','7d'].includes(e.window))bad();str(e.name);str(e.variable)}if(!x.profile||!x.settings)bad();const z=x.settings;for(const k of ['reserve','staleHours','minViews','minClicks','clickTarget','orderTarget','commissionTarget'])if(typeof z[k]!=='number'||!Number.isFinite(z[k])||z[k]<0)bad();if(z.reserve<20||z.reserve>80||z.staleHours<1||z.minViews<1||z.minClicks<1)bad();['audience','goal','tone','experience','equipment','avoid'].forEach(k=>str(x.profile[k]));if(typeof x.profile.own!=='boolean'||typeof x.profile.face!=='boolean')bad();n(x.profile.minutes,10,480);n(x.profile.budget);return structuredClone(x);}

async function handleAction(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;try{if(['open-story','product-story','demo'].includes(a)&&!allowDiscard){syncStory();if(dirtyStory()){pendingNavigation={...b.dataset};modal(T('ร่างยังไม่บันทึก','Unsaved draft'),`<p>${T('กลับไปบันทึกร่างก่อน หรือยืนยันละทิ้งการแก้ไขนี้','Save the draft first, or confirm discarding these edits.')}</p>`,btn(T('ละทิ้งร่างและไปต่อ','Discard & continue'),'discard-navigation','primary'));return}}allowDiscard=false;if(a==='discard-navigation'){const next=pendingNavigation;pendingNavigation=null;storyDraft=null;$('#dialog').close();allowDiscard=true;await handleAction({target:{closest:()=>({dataset:next})}});return}if(a==='nav'){syncStory();capture();page=b.dataset.page;render();window.scrollTo(0,0)}
if(a==='more')modal(T('พื้นที่ทำงานเพิ่มเติม','More workspace tools'),navItems().filter(([k])=>['products','results','lab','settings'].includes(k)).map(([k,l])=>btn(l,'modal-nav','ghost',`data-page="${k}"`)).join(' '));
if(a==='modal-nav'){$('#dialog').close();syncStory();capture();page=b.dataset.page;render();window.scrollTo(0,0)}
if(a==='lang'){syncStory();capture();lang=lang==='th'?'en':'th';try{localStorage.setItem('aff-lang',lang)}catch{}render()}
if(a==='new-product'){selected=null;clearDraft('analyze');page='analyze';render();window.scrollTo(0,0)}
if(a==='edit-product'){selected=b.dataset.id;clearDraft('analyze');page='analyze';render();window.scrollTo(0,0)}
if(a==='copy-link')await copy(product(b.dataset.id).affiliate);
if(a==='product-story'){selected=b.dataset.id;storyDraft=null;clearDraft('studio');page='studio';render();window.scrollTo(0,0)}
if(a==='compare'){const ps=$$('.compare-check:checked').map(el=>product(el.value));if(ps.length<2||ps.length>5)throw Error(T('เลือก 2–5 สินค้า','Select 2–5 products.'));$('#comparison').innerHTML=`<section class="card"><h2>${T('เปรียบเทียบข้อมูล','Evidence comparison')}</h2><p class="notice info">${T('ใช้ rubric เดียวกัน แต่ชุดมิติและรุ่นอาจต่างกัน ห้ามสรุปว่าราคาถูกที่สุดจากตารางนี้','Same rubric, but dimensions and variants may differ. This is not a cheapest-product ranking.')}</p><div class="tablewrap"><table><thead><tr><th>${T('มิติ','Dimension')}</th>${ps.map(p=>`<th>${esc(p.title)}<br><small>${esc(p.variant)}</small></th>`).join('')}</tr></thead><tbody><tr><td>${T('โอกาส / Coverage','Opportunity / coverage')}</td>${ps.map(p=>`<td>${formatScore(p)} / ${score(p).coverage}%</td>`).join('')}</tr><tr><td>${T('ราคา','Price')}</td>${ps.map(p=>`<td>${money(p.price)}</td>`).join('')}</tr>${dimensions().map(([n],i)=>`<tr><td>${n}</td>${ps.map(p=>`<td>${p.dims[i].rating??'—'}<p class="sub">${esc(p.dims[i].reason)}</p></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;$('#comparison').scrollIntoView({behavior:'smooth'})}
if(a==='save-profile'){readProfile();await persist();toast(T('บันทึกบรีฟแล้ว','Brief saved.'))}
if(a==='generate-story'){if(storyDraft&&$('#storyName'))syncStory();const p=product($('#storyProduct').value),brief=readProfile();if(!brief.audience)throw Error(T('ระบุกลุ่มคนดูก่อนเลือกมุมเรื่อง','Enter an audience before choosing an angle.'));if(brief.minutes<10||brief.minutes>480)throw Error(T('เวลาถ่ายต้อง 10–480 นาที','Filming time must be 10–480 minutes.'));const angle=Number(b.dataset.angle);if(angle===1&&!brief.own)toast(T('ยังไม่มีสินค้า เปลี่ยนเป็นมุมวิธีเลือกให้','No product in hand: using a buying-guide angle.'));const next=makeStory(p,brief,angle,Number($('#duration').value),$('#storyLanguage').value,$('#platform').value);if(storyDraft&&(!state.stories.some(s=>s.id===storyDraft.id)||storyText(storyDraft)!==storyText(state.stories.find(s=>s.id===storyDraft.id)))){pendingStory=next;modal(T('มีร่างที่ยังไม่บันทึก','Unsaved story draft'),`<p>${T('บันทึกร่างปัจจุบันก่อนสร้างมุมใหม่ หรือยืนยันแทนที่ร่าง','Save the current draft first, or confirm replacing it.')}</p>`,btn(T('แทนที่ร่าง','Replace draft'),'replace-story','primary'));return}storyDraft=next;await persist();clearDraft('studio');render();$('#story-editor').scrollIntoView({behavior:'smooth'})}
if(a==='replace-story'){storyDraft=pendingStory;pendingStory=null;$('#dialog').close();clearDraft('studio');render();$('#story-editor').scrollIntoView()}
if(a==='open-story'){storyDraft=structuredClone(state.stories.find(s=>s.id===b.dataset.id));selected=storyDraft.productId;clearDraft('studio');render();$('#story-editor').scrollIntoView({behavior:'smooth'})}
if(a==='refresh-story-evidence'){syncStory();storyDraft.evidenceVersion=product(storyDraft.productId).snapshots.at(-1)?.id;storyDraft.ready=false;storyDraft.reviewed=false;storyDraft.linkChecked=false;clearDraft('studio');render();$('#story-editor').scrollIntoView();toast(T('ผูกหลักฐานล่าสุดแล้ว โปรดทวนบทและยืนยันใหม่','Latest evidence linked. Review the script and confirm again.'))}
if(a==='validate-story'){syncStory();const f=storyFlags(storyDraft);$('#quality-flags').innerHTML=f.length?f.map(x=>`<p class="notice">${esc(x)}</p>`).join(''):badge(T('ผ่านการตรวจเบื้องต้น กรุณาทวนด้วยตนเอง','Basic checks passed. Human review is still required.'),'green')}
if(a==='save-story')await saveStory(false);
if(a==='ready-story')await saveStory(true);
if(a==='copy-story'){syncStory();await copy(storyText(storyDraft))}
if(a==='view-revision'){const r=storyDraft.revisions.find(r=>r.id===b.dataset.id);modal(T('เวอร์ชันที่บันทึก','Saved revision'),`<pre>${esc(r.text)}</pre>`)}
if(a==='plan-view'){capture();planView=b.dataset.view;render()}
if(a==='complete-task'){const p=state.plans.find(x=>x.id===b.dataset.plan),t=p.tasks.find(x=>x.id===b.dataset.id),s=state.stories.find(x=>x.id===t.storyId);if(t.dependency&&p.tasks.find(x=>x.id===t.dependency)?.status!=='done')throw Error(T('ทำงานก่อนหน้าให้เสร็จก่อน','Complete the prerequisite first.'));if(['shoot','check','publish'].includes(t.type)&&(!s.ready||storyFlags(s).length))throw Error(T('บทต้องผ่านการตรวจและเป็น Ready ก่อนงานนี้','The story must pass review and be Ready before this task.'));if(t.type==='publish'){pendingTask={p,t};modal(T('ยืนยันโพสต์ด้วยตนเอง','Confirm manual publishing'),`<p>${T('คุณเผยแพร่โพสต์เองแล้วใช่ไหม? เว็บนี้ไม่ได้โพสต์แทนคุณ','Have you published this post yourself? This app does not publish it.')}</p>`,btn(T('โพสต์แล้ว','I published it'),'confirm-task','primary'));return}if(t.type==='measure'){const posts=state.posts.filter(x=>x.storyId===t.storyId).sort((a,b)=>a.publishedAt.localeCompare(b.publishedAt)),post=posts.at(-1);if(!post||Date.now()-Date.parse(post.publishedAt)<72*36e5||!post.metrics.some(m=>m.window==='72h'))throw Error(T('ลงทะเบียนโพสต์จริง รออายุครบ 72 ชั่วโมง และบันทึก snapshot ก่อนจบงานนี้','Register the actual post, wait 72 hours after publishing and save a 72h snapshot first.'));}t.status='done';await persist();capture();render()}
if(a==='confirm-task'){pendingTask.t.status='done';await persist();$('#dialog').close();capture();render();toast(T('บันทึกแล้ว เพิ่ม URL และยอดในหน้าผลโพสต์','Saved. Add the post URL and metrics in Results.'))}
if(a==='export')exportData();if(a==='export-csv')exportCSV();if(a==='close-modal')$('#dialog').close();
if(a==='demo'){syncStory();if(mode==='real')await persist();mode=mode==='real'?'demo':'real';await load();if(mode==='demo'&&!state.products.length){state=demoData();await persist()}drafts={};selected=null;storyDraft=null;page='today';render()}
if(a==='import-merge'||a==='import-replace'){if(!pendingImport)throw Error('No import');if(a==='import-replace'){modal(T('สำรองแล้วแทนที่ข้อมูล?','Back up and replace data?'),`<p>${T('จะดาวน์โหลดสำรองข้อมูลปัจจุบันก่อน แล้วแทนที่ข้อมูลทั้งหมดในโหมดนี้ด้วยไฟล์ที่เลือก','A backup of the current workspace will download before the imported file replaces it.')}</p>`,btn(T('สำรองและแทนที่','Back up & replace'),'confirm-import','primary'));return}exportData();const next=structuredClone(state);for(const key of ['products','stories','plans','posts','experiments']){const ids=new Set(next[key].map(x=>x.id));next[key].push(...pendingImport[key].filter(x=>!ids.has(x.id)))}validateImport({app:'Affiliate Intelligence Studio',mode,data:next});state=next;await persist();pendingImport=null;drafts={};storyDraft=null;render();toast(T('นำเข้าแล้ว ID ซ้ำเก็บข้อมูลเดิม','Imported. Existing records with the same ID were preserved.'))}
if(a==='confirm-import'){exportData();state=pendingImport;await persist();pendingImport=null;drafts={};selected=null;storyDraft=null;$('#dialog').close();render();toast(T('แทนที่ข้อมูลแล้ว','Workspace replaced.'))}
}catch(err){toast(err.message||String(err))}}
let pendingStory=null,pendingTask=null;
document.addEventListener('click',handleAction);
document.addEventListener('input',e=>{if(page==='studio'&&storyDraft&&e.target.closest('#story-editor')&&!['reviewed','linkChecked'].includes(e.target.id)){storyDraft.reviewed=false;storyDraft.linkChecked=false;storyDraft.ready=false;if($('#reviewed'))$('#reviewed').checked=false;if($('#linkChecked'))$('#linkChecked').checked=false;if(e.target.id==='storyHookA'&&$('#voice0'))$('#voice0').value=e.target.value;if(e.target.id==='voice0'&&$('#storyHookA'))$('#storyHookA').value=e.target.value;}});
document.addEventListener('change',async e=>{try{if(e.target.id==='resultWindow'){filter.window=e.target.value;clearDraft('results');render()}if(e.target.id==='resultPlatform'){filter.platform=e.target.value;clearDraft('results');render()}if(e.target.id.startsWith('status-')){const p=product(e.target.id.slice(7));if(e.target.value==='ready'&&score(p).coverage<60){e.target.value=p.status;throw Error(T('หลักฐานต้องครบอย่างน้อย 60% ก่อนพร้อมทดลอง','At least 60% evidence coverage is required.'))}p.status=e.target.value;await persist()}if(e.target.id==='import-file'){const f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error(T('ไฟล์ใหญ่เกิน 20 MB','File exceeds 20 MB.'));const root=JSON.parse(await f.text());if(root.mode!==mode)throw Error(T('โหมดตัวอย่างกับข้อมูลจริงต้องนำเข้าแยกกัน เปลี่ยนโหมดให้ตรงกับไฟล์ก่อน','Demo and real backups are isolated. Switch to the matching workspace first.'));pendingImport=validateImport(root);$('#import-preview').innerHTML=`<div class="notice info mt">${T('ตรวจรูปแบบแล้ว','Validated')} · ${pendingImport.products.length} ${T('สินค้า','products')} · ${pendingImport.stories.length} ${T('บท','stories')} · ${pendingImport.posts.length} ${T('โพสต์','posts')}</div><div class="actions mt">${btn(T('รวมกับข้อมูลเดิม','Merge records'),'import-merge','cyan')}${btn(T('แทนที่ทั้งหมด','Replace workspace'),'import-replace','ghost')}</div>`}}catch(err){pendingImport=null;toast(err.message||String(err))}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(!form.checkValidity()){form.reportValidity();return}const v=id=>$('#'+id).value;try{if(form.id==='product-form')await saveProduct(form);
if(form.id==='plan-form'){const chosen=$$('.plan-story:checked').map(el=>state.stories.find(s=>s.id===el.value)),weekdays=$$('.weekday:checked').map(el=>+el.value);if(!chosen.length||!weekdays.length)throw Error(T('เลือกอย่างน้อยหนึ่งบทและหนึ่งวัน','Select at least one story and weekday.'));const ongoing=new Set(state.plans.flatMap(p=>p.tasks.filter(t=>t.status!=='done').map(t=>t.storyId)));if(chosen.some(s=>ongoing.has(s.id)))throw Error(T('บทที่เลือกมีแผนที่ยังไม่เสร็จอยู่แล้ว','A selected story already has an unfinished plan.'));const cfg={start:v('planStart'),days:+v('planDays'),minutes:+v('dailyMinutes'),reserve:+v('reserve'),max:+v('maxPosts'),time:v('planTime'),arrival:v('arrival'),off:v('daysOff').split(',').map(x=>x.trim()).filter(Boolean),weekdays};if(cfg.time.split(':').map(Number).reduce((h,m)=>h*60+m)+cfg.minutes>1440)throw Error(T('ช่วงเวลาทำงานล้นวัน เลือกเวลาเริ่มให้เร็วขึ้นหรือลดนาทีต่อวัน','The work block crosses midnight. Start earlier or reduce daily minutes.'));if(cfg.off.some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d)||!Number.isFinite(Date.parse(d))))throw Error(T('วันหยุดใช้รูปแบบ YYYY-MM-DD','Use YYYY-MM-DD for days off.'));const reserved={};state.plans.forEach(p=>p.tasks.forEach(t=>{reserved[t.date]=(reserved[t.date]||0)+t.effort}));const plan=schedule(chosen,cfg,reserved);if(!plan.tasks.length)throw Error(T('ไม่มีเวลาที่ว่างพอในช่วงแผนนี้','No usable capacity in this plan.'));state.plans.push(plan);await persist();clearDraft('planner');render();toast(T('สร้างแผนแล้ว งานเกินกำลังแยกไว้ด้านล่าง','Plan saved. Deferred work is listed below.'))}
if(form.id==='post-form'){const s=state.stories.find(s=>s.id===v('postStory'));if(!s)throw Error(T('เลือกบทก่อน','Choose a story.'));const url=safeUrl(v('postUrl'));if(!url)throw Error(T('URL โพสต์ไม่ถูกต้อง','Invalid post URL.'));if(state.posts.some(p=>p.url===url))throw Error(T('โพสต์ URL นี้มีแล้ว กรุณาเพิ่ม snapshot แทน','This post already exists. Add a snapshot instead.'));const dt=v('publishedAt')+':00+07:00';if(Date.parse(dt)>Date.now())throw Error(T('โพสต์ต้องเผยแพร่แล้ว ไม่ใช่เวลาอนาคต','Publication time cannot be in the future.'));state.posts.push({id:uid(),storyId:s.id,storyVersion:s.revisions.at(-1)?.id||null,productId:s.productId,productVariant:product(s.productId).variant,productTitle:product(s.productId).title,platform:s.platform,name:v('postName').trim(),url,publishedAt:dt,variant:v('postVariant'),metrics:[]});await persist();clearDraft('results');render();toast(T('บันทึกโพสต์แล้ว','Post saved.'))}
if(form.id==='metric-form'){const p=state.posts.find(p=>p.id===v('metricPost')),dt=v('metricDate')+':00+07:00',age=(Date.parse(dt)-Date.parse(p.publishedAt))/36e5,expected={'24h':24,'72h':72,'7d':168}[v('metricWindow')];if(Date.parse(dt)>Date.now())throw Error(T('เวลาสังเกตห้ามเป็นอนาคต','Observation time cannot be in the future.'));if(Math.abs(age-expected)>expected*.15)throw Error(T('อายุโพสต์ไม่ตรงช่วงที่เลือก (ยอมคลาดเคลื่อน 15%) เลือกวันเวลาที่ใกล้ช่วงวัด','Post age does not match the window (15% tolerance). Use a matching observation time.'));const m={id:uid(),window:v('metricWindow'),observedAt:dt,source:v('metricSource').trim(),attribution:v('attribution')};['views','clicks','orders','cancelled','sales','estimated','confirmed','cost','retention'].forEach(k=>m[k]=N(v('m-'+k)));if(['views','clicks','orders','confirmed'].every(k=>m[k]===null))throw Error(T('กรอกอย่างน้อยหนึ่งยอดหลัก','Enter at least one primary metric.'));if(m.cancelled!==null&&m.orders!==null&&m.cancelled>m.orders)throw Error(T('ยอดยกเลิกต้องไม่เกินยอดออเดอร์','Cancelled orders cannot exceed total orders.'));const same=p.metrics.find(x=>x.window===m.window&&x.observedAt===m.observedAt);if(same)throw Error(T('มี snapshot เวลานี้แล้ว ใช้เวลาสังเกตใหม่เพื่อแก้ไข','A snapshot exists at this time. Use a new observation timestamp.'));p.metrics.push(m);await persist();clearDraft('results');render();toast(T('บันทึก snapshot แล้ว ไม่มีการบวกยอดซ้ำ','Snapshot saved without double counting.'))}
if(form.id==='experiment-form'){if(v('expA')===v('expB'))throw Error(T('เลือกคนละโพสต์','Choose two different posts.'));state.experiments.push({id:uid(),name:v('expName'),a:v('expA'),b:v('expB'),variable:v('expVariable'),metric:v('expMetric'),window:v('expWindow'),pre:$('#expPre').checked,createdAt:now()});await persist();clearDraft('lab');render()}
if(form.id==='forecast-form'){const orders=+v('fViews')*(+v('fClick')/100)*(+v('fOrder')/100),payout=v('fMode')==='fixed'?+v('fValue'):+v('fValue')*(+v('fRate')/100),commission=orders*payout*(+v('fApproval')/100);$('#forecast-result').innerHTML=`<div class="notice info"><strong>${T('สถานการณ์สมมติ ไม่ใช่การพยากรณ์','Hypothetical scenario, not a prediction')}</strong><p>${T('ออเดอร์สมมติ','Assumed orders')}: ${num(orders)}<br>${T('คอมมิชชันสมมติหลังปรับสัดส่วนยืนยัน','Assumed commission after approval fraction')}: ${money(commission)}</p><small>${T('ที่มา','Source')}: ${esc(v('fSource'))}</small></div>`}
if(form.id==='settings-form'){['staleHours','minViews','minClicks','clickTarget','orderTarget','commissionTarget'].forEach(k=>state.settings[k]=+v(k));state.settings.reserve=+v('setReserve');state.settings.reduced=$('#reduced').checked;await persist();clearDraft('settings');render();toast(T('บันทึกการตั้งค่าแล้ว','Settings saved.'))}
}catch(err){toast(err.message||String(err))}});
window.addEventListener('beforeunload',e=>{if(storyDraft){syncStory();if(dirtyStory()){e.preventDefault();e.returnValue=''}}});
(async()=>{try{db=await openDB();await load()}catch(e){state=base();db=null}render();if(!db)toast(T('พื้นที่บันทึกไม่พร้อม ส่งออกสำรองก่อนปิดหน้า','Storage unavailable. Export your work before closing.'));})();
</script></body></html>
